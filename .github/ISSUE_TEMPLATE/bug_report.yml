name: Bug report
description: Something in the app does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Wiki tab
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 8, Android 15
  - type: input
    id: version
    attributes:
      label: Content version or commit
      description: The content version shown in Settings, or the commit you built from.
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Italian
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
