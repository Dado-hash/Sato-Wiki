name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Validate content bundle
        run: dart run tool/validate_content.dart

      - name: Validate Italian content bundle
        run: dart run tool/validate_content.dart assets/content/seed_bundle_it.json

      - name: Generate content bundle
        run: dart run tool/generate_bundle.dart

      - name: Generate Italian content bundle
        run: dart run tool/generate_bundle.dart assets/content/seed_bundle_it.json build/pages

      - name: Test
        run: flutter test

  publish-content:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Pages content
        run: dart run tool/generate_bundle.dart assets/content/seed_bundle_en.json build/pages

      - name: Generate Italian Pages content
        run: dart run tool/generate_bundle.dart assets/content/seed_bundle_it.json build/pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
