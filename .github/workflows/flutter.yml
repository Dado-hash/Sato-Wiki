name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Validate content bundle
        run: dart run tool/validate_content.dart

      - name: Validate Italian content bundle
        run: dart run tool/validate_content.dart assets/content/seed_bundle_it.json

      - name: Generate content bundle
        run: dart run tool/generate_bundle.dart --stamp

      - name: Generate Italian content bundle
        run: dart run tool/generate_bundle.dart --stamp assets/content/seed_bundle_it.json build/pages

      - name: Test
        run: flutter test

  publish-content:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Content-bundle version stamps are timestamp-based, so re-publishing
      # on every push (even unrelated app-code commits) makes every install
      # think there's a new content version and forces a full media
      # re-download. Only redeploy Pages when the seed bundles themselves
      # changed in this push.
      - name: Check content changes
        id: content_check
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1 && \
             git diff --quiet HEAD^ HEAD -- assets/content/seed_bundle_en.json assets/content/seed_bundle_it.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.content_check.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.content_check.outputs.changed == 'true'
        run: flutter pub get

      - name: Generate Pages content
        if: steps.content_check.outputs.changed == 'true'
        run: dart run tool/generate_bundle.dart --stamp assets/content/seed_bundle_en.json build/pages

      - name: Generate Italian Pages content
        if: steps.content_check.outputs.changed == 'true'
        run: dart run tool/generate_bundle.dart --stamp assets/content/seed_bundle_it.json build/pages

      - name: Configure Pages
        if: steps.content_check.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.content_check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - name: Deploy Pages
        id: deployment
        if: steps.content_check.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
