name: Android App Distribution

# Builds a signed release APK.
#
# - A push to main that touches the app sends the APK to the Firebase App
#   Distribution testers. develop is not built: every change reaches main
#   through a pull request, and building both sent testers the same change
#   twice.
# - Publishing a GitHub release attaches the APK to that release instead.
# - A manual run sends the chosen branch to the testers, or, with
#   `release_tag` set, attaches the APK to that existing release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the APK to this existing release instead of sending it to testers
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  release:
    types:
      - published

permissions:
  contents: read

# Grouped by event and ref, so a release build never cancels the tester
# build of the same commit.
concurrency:
  group: android-distribution-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Needed to attach the APK to a release.
      contents: write
    env:
      # Empty for tester builds.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          # A stable key is required: testers cannot install an update signed
          # with a different key than the build they already have.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --build-number "${{ github.run_number }}"

      - name: Write release notes
        if: env.RELEASE_TAG == ''
        run: git log -1 --pretty=format:'%h %s' > release-notes.txt

      - name: Upload to Firebase App Distribution
        if: env.RELEASE_TAG == ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools@13 appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes-file release-notes.txt

      - name: Attach APK to the GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="satowiki-${RELEASE_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release upload "$RELEASE_TAG" "$apk" --clobber
