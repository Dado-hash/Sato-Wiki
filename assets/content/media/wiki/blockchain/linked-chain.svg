<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Linked Bitcoin blockchain</title>
  <desc id="desc">Blocks link backward by hash, with a stronger valid branch selected by accumulated work.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2 2L9 5L2 8" fill="none" stroke="#7C5CFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Hash-linked history</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Each block points backward; nodes accept the strongest valid branch.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 176H884"/>
    <path d="M76 300H884"/>
    <path d="M76 424H884"/>
    <path d="M170 150V448"/>
    <path d="M456 150V448"/>
    <path d="M742 150V448"/>
  </g>

  <g stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M182 280H274" stroke="#F7931A"/>
    <path d="M372 280H464" stroke="#F7931A"/>
    <path d="M562 280H654" stroke="#F7931A"/>
    <path d="M752 280H830" stroke="#F7931A" marker-end="url(#arrow-orange)"/>
    <path d="M372 280C430 296 438 386 464 386" stroke="#7C5CFF"/>
    <path d="M562 386H654" stroke="#7C5CFF" marker-end="url(#arrow-violet)"/>
  </g>

  <g filter="url(#soft)" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="86" y="226" width="96" height="108" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="134" y="266" fill="#F4EAD8" font-size="18" font-weight="700">B0</text>
    <text x="134" y="298" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">hash</text>

    <rect x="276" y="226" width="96" height="108" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="324" y="266" fill="#F4EAD8" font-size="18" font-weight="700">B1</text>
    <text x="324" y="298" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">prev</text>

    <rect x="466" y="226" width="96" height="108" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="514" y="266" fill="#F4EAD8" font-size="18" font-weight="700">B2</text>
    <text x="514" y="298" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">prev</text>

    <rect x="656" y="226" width="96" height="108" rx="14" fill="#203327" stroke="#22C55E" stroke-width="3"/>
    <text x="704" y="266" fill="#F4EAD8" font-size="18" font-weight="700">B3</text>
    <text x="704" y="298" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13">tip</text>

    <rect x="466" y="348" width="96" height="78" rx="14" fill="#2A2331" stroke="#7C5CFF" stroke-width="2"/>
    <text x="514" y="382" fill="#F4EAD8" font-size="18" font-weight="700">B2'</text>
    <text x="514" y="406" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">fork</text>

    <rect x="656" y="348" width="96" height="78" rx="14" fill="#2A2331" stroke="#7C5CFF" stroke-width="2"/>
    <text x="704" y="382" fill="#F4EAD8" font-size="18" font-weight="700">B3'</text>
    <text x="704" y="406" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">less</text>
  </g>

  <rect x="780" y="230" width="112" height="100" rx="16" fill="#14251A" stroke="#22C55E" stroke-width="2"/>
  <text x="836" y="270" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">best</text>
  <text x="836" y="298" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">valid chain</text>
</svg>
