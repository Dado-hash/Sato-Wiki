  <g transform="translate(-6 0)">

  <text x="110" y="170" fill="#B7B1A8" font-family="JetBrains Mono" font-size="16">header</text>

  <rect x="110" y="188" width="80" height="24" rx="6" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>
  <rect x="206" y="188" width="80" height="24" rx="6" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>
  <rect x="302" y="188" width="80" height="24" rx="6" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>
  <rect x="398" y="188" width="80" height="24" rx="6" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>
  <rect x="494" y="188" width="80" height="24" rx="6" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>
  <rect x="590" y="188" width="80" height="24" rx="6" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>
  <rect x="686" y="188" width="80" height="24" rx="6" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>
  <rect x="782" y="188" width="80" height="24" rx="6" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>

  <rect x="110" y="234" width="80" height="90" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="206" y="234" width="80" height="90" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="302" y="234" width="80" height="90" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="398" y="234" width="80" height="90" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2" stroke-dasharray="6 6"/>
