  <path d="M110 346V354H574V346" stroke="#7C8794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M590 346V354H862V346" stroke="#F7931A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

