<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">secp256k1 Elliptic Curve</title>
  <desc id="desc">Elliptic curve y^2 = x^3 + 7 over the finite field of prime order p = 2^256 - 2^32 - 2^9 - 2^8 - 2^7 - 2^6 - 2^4 - 1, showing the generator point G and public key derivation K = k * G.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">secp256k1</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">The elliptic curve that secures Bitcoin key pairs</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
    <path d="M76 390H884"/>
    <path d="M481 148V390"/>
  </g>
  <text x="278" y="140" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">CURVE PARAMETERS</text>
  <text x="742" y="140" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">KEY DERIVATION</text>
  <g filter="url(#soft)">
    <rect x="64" y="162" width="408" height="216" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="268" y="196" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Curve equation</text>
    <text x="268" y="228" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="18">y² = x³ + 7</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M80 246H456"/>
    </g>
    <text x="268" y="266" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Prime order p</text>
    <text x="268" y="286" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF</text>
    <text x="268" y="304" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">FFFFFFFFFFFFFFFFFFFFFFFFFFFFFC2F</text>
    <text x="268" y="326" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Order n</text>
    <text x="268" y="346" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFE</text>
    <text x="268" y="364" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">BAAEDCE6AF48A03BBFD25E8CD0364141</text>
  </g>
  <g filter="url(#soft)">
    <rect x="512" y="162" width="408" height="216" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="716" y="196" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Public Key = k × G</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M528 214H904"/>
    </g>
    <rect x="528" y="234" width="100" height="40" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1.5"/>
    <text x="578" y="260" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">k</text>
    <text x="578" y="306" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">private key</text>
    <text x="647" y="258" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="24">×</text>
    <rect x="666" y="234" width="100" height="40" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="716" y="260" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">G</text>
    <text x="716" y="306" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">generator point</text>
    <text x="785" y="258" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="24">=</text>
    <rect x="804" y="234" width="100" height="40" rx="10" fill="#0A1F16" stroke="#22C55E" stroke-width="1.5"/>
    <text x="854" y="260" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">K</text>
    <text x="854" y="306" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">public key</text>
    <text x="716" y="368" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">ECDSA / Schnorr signatures prove k is known</text>
  </g>
  <g filter="url(#soft)">
    <rect x="64" y="404" width="856" height="82" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="492" y="436" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Generator Point G (compressed)</text>
    <text x="492" y="462" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">0279BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798</text>
    <text x="492" y="478" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798 (x-coordinate only)</text>
  </g>
</svg>
