<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lightning Invoice Lifecycle</title>
  <desc id="desc">Diagram showing the lifecycle of a BOLT 11 Lightning invoice. On the left, merchant Carol generates an invoice with payment hash, description, amount and expiry. In the center, the invoice is encoded as a bech32 string starting with lnbc. On the right, payer Alice scans the invoice, constructs a payment route and sends HTLCs back to Carol. Orange arrows show the invoice sharing direction on top and the payment flow back on the bottom.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Lightning Invoice Lifecycle</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">The receiver creates an invoice with a payment hash; the payer uses it to route a payment back</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <line x1="76" y1="200" x2="884" y2="200"/>
    <line x1="76" y1="440" x2="884" y2="440"/>
    <line x1="368" y1="148" x2="368" y2="490"/>
    <line x1="668" y1="148" x2="668" y2="490"/>
  </g>

  <!-- Left column header: Merchant -->
  <text x="218" y="178" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">MERCHANT / RECEIVER (CAROL)</text>

  <!-- Merchant card: Generate invoice -->
  <g filter="url(#soft)">
    <rect x="80" y="214" width="276" height="64" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="96" y="214" width="32" height="64" rx="14" fill="#241E31"/>
    <text x="112" y="254" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">1</text>
    <text x="144" y="240" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Generate Invoice</text>
    <text x="144" y="262" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">Creates payment hash H(x) from random secret x</text>
  </g>

  <!-- Merchant card: Invoice fields -->
  <g filter="url(#soft)">
    <rect x="80" y="292" width="276" height="84" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="96" y="292" width="32" height="84" rx="14" fill="#241E31"/>
    <text x="112" y="342" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">2</text>
    <text x="144" y="312" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Sets Invoice Fields</text>
    <text x="144" y="336" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">payment_hash: H(x)</text>
    <text x="144" y="354" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">amount: 10,000 sats • expiry: 3600s</text>
    <text x="144" y="372" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">description: "Coffee payment"</text>
  </g>

  <!-- Center column header: Invoice -->
  <text x="518" y="178" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">BOLT 11 INVOICE</text>

  <!-- Invoice card -->
  <g filter="url(#soft)">
    <rect x="380" y="214" width="276" height="162" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="396" y="230" width="244" height="48" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="518" y="250" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">BECH32 ENCODED INVOICE</text>
    <text x="424" y="270" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="11">lnbc10u1p0xj2qdppjqyz...</text>
    <text x="410" y="310" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="9">HRP: lnbc (mainnet Lightning)</text>
    <text x="410" y="328" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="9">Amount: 10u (10 microBTC)</text>
    <text x="410" y="346" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="9">Timestamp: 1745712345 (Unix)</text>
    <text x="410" y="364" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="9">Signature: recoverable ECDSA (65 bytes)</text>
  </g>

  <!-- Right column header: Payer -->
  <text x="768" y="178" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">PAYER / SENDER (ALICE)</text>

  <!-- Payer card: Scan -->
  <g filter="url(#soft)">
    <rect x="680" y="214" width="200" height="64" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="696" y="214" width="32" height="64" rx="14" fill="#203327"/>
    <text x="712" y="254" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">3</text>
    <text x="744" y="240" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Scan Invoice</text>
    <text x="744" y="262" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">Via QR code, NFC, or text</text>
  </g>

  <!-- Payer card: Route -->
  <g filter="url(#soft)">
    <rect x="680" y="292" width="200" height="84" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="696" y="292" width="32" height="84" rx="14" fill="#203327"/>
    <text x="712" y="342" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">4</text>
    <text x="744" y="312" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Route Payment</text>
    <text x="744" y="336" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">Find path to Carol</text>
    <text x="744" y="354" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">Construct onion</text>
    <text x="744" y="372" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">Send HTLCs</text>
  </g>

  <!-- Flow arrow: Invoice shared (top) -->
  <path d="M360 240H480" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="408" y="232" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">INVOICE TEXT / QR</text>

  <!-- Flow arrow: Payment back (bottom) -->
  <path d="M680 350H480" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="590" y="400" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">HTLC PAYMENT FLOW</text>

  <!-- Payment flow step card -->
  <g filter="url(#soft)">
    <rect x="380" y="418" width="200" height="56" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="480" y="442" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Payment Settled ✓</text>
    <text x="480" y="462" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">Carol reveals preimage x</text>
  </g>

  <path d="M480 478V490" stroke="#22C55E" stroke-width="3"/>
</svg>
