<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Who builds the block template</title>
  <desc id="desc">Mining work can come from a pool's template or from a miner's own node, and either one goes to the hardware.</desc>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(6 14)">

  <!-- Template sources -->
  <rect x="110" y="150" width="230" height="70" rx="8" fill="#20252D" stroke="#8B5CF6" stroke-width="2"/>
  <text x="225" y="192" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">pool</text>
  <rect x="110" y="300" width="230" height="70" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="225" y="342" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">node</text>

  <!-- Flows into the miner -->
  <path d="M340 185H630" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <polygon points="640,185 630,180 630,190" fill="#8B5CF6"/>
  <text x="490" y="172" text-anchor="middle" fill="#8B5CF6" font-family="Inter" font-size="18" font-weight="700">template</text>

  <path d="M340 335H630" stroke="#F7931A" stroke-width="3" stroke-linecap="round"/>
  <polygon points="640,335 630,330 630,340" fill="#F7931A"/>
  <text x="490" y="322" text-anchor="middle" fill="#F7931A" font-family="Inter" font-size="18" font-weight="700">template</text>

  <!-- Miner hardware -->
  <rect x="640" y="150" width="200" height="220" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <g fill="#2A303A" stroke="#46505C" stroke-width="1.5">
    <rect x="678" y="180" width="36" height="36" rx="4"/>
    <rect x="722" y="180" width="36" height="36" rx="4"/>
    <rect x="766" y="180" width="36" height="36" rx="4"/>
    <rect x="678" y="224" width="36" height="36" rx="4"/>
    <rect x="722" y="224" width="36" height="36" rx="4"/>
    <rect x="766" y="224" width="36" height="36" rx="4"/>
    <rect x="678" y="268" width="36" height="36" rx="4"/>
    <rect x="722" y="268" width="36" height="36" rx="4"/>
    <rect x="766" y="268" width="36" height="36" rx="4"/>
  </g>
  <text x="740" y="346" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">miner</text>
</g>
</svg>
