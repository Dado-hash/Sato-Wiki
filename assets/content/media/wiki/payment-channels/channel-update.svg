<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Channel Balance Updates</title>
  <desc id="desc">Diagram showing how channel balances change with each payment: Alice's balance decreases from 1.0 to 0.5 BTC while Bob's increases from 0.0 to 0.5 BTC across three commitment transactions.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Channel Balance Updates</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Each payment creates a new commitment transaction with updated balances</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
  </g>
  <g filter="url(#soft)">
    <rect x="52" y="162" width="856" height="320" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="64" y="200" width="110" height="140" rx="12" fill="#2A2116" stroke="#F7931A" stroke-width="1.5"/>
    <text x="119" y="234" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Alice</text>
    <text x="119" y="260" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">Balance</text>
    <text x="119" y="280" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">decreases</text>
    <text x="119" y="306" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">1.0 → 0.5 BTC</text>
    <rect x="786" y="200" width="110" height="140" rx="12" fill="#2A2116" stroke="#F7931A" stroke-width="1.5"/>
    <text x="841" y="234" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Bob</text>
    <text x="841" y="260" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">Balance</text>
    <text x="841" y="280" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">increases</text>
    <text x="841" y="306" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">0.0 → 0.5 BTC</text>
    <text x="480" y="178" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Bidirectional Payment Channel</text>
    <path d="M174 240L202 240" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M202 226L174 226" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M758 240L786 240" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M786 226L758 226" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="212" y="216" width="538" height="44" rx="10" fill="#1A1F28" stroke="#343A44" stroke-width="1.5"/>
    <rect x="212" y="216" width="538" height="10" rx="5" fill="#F7931A" opacity="0.8"/>
    <text x="481" y="244" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">A: 1.0 BTC — B: 0.0 BTC</text>
    <path d="M481 260V294" stroke="#7C5CFF" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
    <text x="495" y="281" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">Commit tx #1</text>
    <rect x="212" y="300" width="538" height="44" rx="10" fill="#1A1F28" stroke="#343A44" stroke-width="1.5"/>
    <rect x="212" y="300" width="376" height="44" rx="10" fill="#2A2116" opacity="0.5"/>
    <rect x="588" y="300" width="162" height="44" rx="10" fill="#14321E" opacity="0.5"/>
    <rect x="212" y="300" width="538" height="10" rx="5" fill="#F7931A" opacity="0.8"/>
    <rect x="588" y="300" width="162" height="10" rx="5" fill="#22C55E" opacity="0.8"/>
    <text x="481" y="328" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">A: 0.7 BTC — B: 0.3 BTC</text>
    <path d="M481 344V378" stroke="#7C5CFF" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
    <text x="495" y="365" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">Commit tx #2</text>
    <rect x="212" y="384" width="538" height="44" rx="10" fill="#1A1F28" stroke="#343A44" stroke-width="1.5"/>
    <rect x="212" y="384" width="269" height="44" rx="10" fill="#2A2116" opacity="0.5"/>
    <rect x="481" y="384" width="269" height="44" rx="10" fill="#14321E" opacity="0.5"/>
    <rect x="212" y="384" width="269" height="10" rx="5" fill="#F7931A" opacity="0.8"/>
    <rect x="481" y="384" width="269" height="10" rx="5" fill="#22C55E" opacity="0.8"/>
    <text x="481" y="412" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">A: 0.5 BTC — B: 0.5 BTC</text>
  </g>
</svg>
