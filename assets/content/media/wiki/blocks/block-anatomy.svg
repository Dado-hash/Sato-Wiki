<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin block anatomy</title>
  <desc id="desc">A block header commits to the previous block and the transaction list, beginning with the coinbase transaction.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Block anatomy</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Small header, ordered transactions, one consensus state update.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 154H884"/>
    <path d="M76 274H884"/>
    <path d="M76 394H884"/>
    <path d="M230 150V444"/>
    <path d="M480 150V444"/>
    <path d="M730 150V444"/>
  </g>

  <g filter="url(#soft)">
    <rect x="76" y="170" width="352" height="288" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="100" y="198" width="304" height="48" rx="12" fill="#2A2116" stroke="#F7931A" stroke-width="1.8"/>
    <text x="252" y="229" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">80-byte header</text>

    <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#F4EAD8">
      <rect x="100" y="266" width="140" height="42" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="170" y="292" text-anchor="middle">version</text>
      <rect x="264" y="266" width="140" height="42" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="334" y="292" text-anchor="middle">prev hash</text>
      <rect x="100" y="326" width="140" height="42" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="170" y="352" text-anchor="middle">Merkle root</text>
      <rect x="264" y="326" width="140" height="42" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="334" y="352" text-anchor="middle">time</text>
      <rect x="100" y="386" width="140" height="42" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="170" y="412" text-anchor="middle">nBits</text>
      <rect x="264" y="386" width="140" height="42" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="334" y="412" text-anchor="middle">nonce</text>
    </g>
  </g>

  <path d="M446 314H510" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="530" y="170" width="354" height="288" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="707" y="214" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Transactions</text>
    <rect x="568" y="246" width="278" height="46" rx="12" fill="#2A2116" stroke="#F7931A" stroke-width="1.8"/>
    <text x="707" y="276" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">coinbase first</text>
    <rect x="568" y="310" width="278" height="46" rx="12" fill="#171B21" stroke="#46505C"/>
    <text x="707" y="340" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16">tx 1</text>
    <rect x="568" y="374" width="278" height="46" rx="12" fill="#171B21" stroke="#46505C"/>
    <text x="707" y="404" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16">tx 2 ... tx n</text>
  </g>

  <path d="M698 246C652 206 584 199 434 222" stroke="#F7931A" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrow-orange)"/>
  <text x="558" y="190" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">Merkle commitment</text>
</svg>
