<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECDSA Signing and Verification</title>
  <desc id="desc">Diagram showing ECDSA signing formula s = k^-1(z + r.d) mod n and verification formula R' = u1.G + u2.Q with flow from message and private key through nonce k to signature (r, s), then through verification to check R'.x equals r.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">ECDSA Signing and Verification</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Elliptic Curve Digital Signature Algorithm used in Bitcoin since 2009</text>

  <!-- Divider lines -->
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
    <path d="M76 408H884"/>
    <path d="M480 148V490"/>
  </g>

  <text x="278" y="140" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">SIGNING</text>
  <text x="742" y="140" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">VERIFICATION</text>

  <!-- ===== LEFT COLUMN: Signing ===== -->

  <!-- Private Key -->
  <g filter="url(#soft)">
    <rect x="64" y="162" width="160" height="60" rx="14" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="144" y="190" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Private Key</text>
    <text x="144" y="212" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">d</text>
  </g>

  <!-- Message -->
  <g filter="url(#soft)">
    <rect x="256" y="162" width="160" height="60" rx="14" fill="#20252D" stroke="#7C8794" stroke-width="2"/>
    <text x="336" y="190" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Message</text>
    <text x="336" y="212" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">z</text>
  </g>

  <!-- Arrow: d to sign -->
  <path d="M144 222V258" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <!-- Arrow: z to sign -->
  <path d="M336 222V258" stroke="#7C8794" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>

  <!-- Signing box -->
  <g filter="url(#soft)">
    <rect x="64" y="266" width="352" height="192" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>

    <text x="86" y="298" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// pick random nonce</tspan>
    </text>
    <text x="86" y="322" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="18">
      <tspan fill="#F7931A">k</tspan>
      <tspan fill="#B7B1A8"> = random(1, </tspan>
      <tspan fill="#7C8794">n</tspan>
      <tspan fill="#B7B1A8">-1)</tspan>
    </text>

    <text x="86" y="353" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// compute commitment</tspan>
    </text>
    <text x="86" y="377" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="18">
      <tspan fill="#F7931A">R</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#F7931A">k</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">G</tspan>
      <tspan fill="#7C8794">,  </tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">r</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#7C8794">R</tspan>
      <tspan fill="#B7B1A8">.x</tspan>
    </text>

    <text x="86" y="410" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// signature scalar</tspan>
    </text>
    <text x="86" y="438" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600">
      <tspan fill="#F7931A">s</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#F7931A">k</tspan>
      <tspan fill="#B7B1A8">⁻¹</tspan>
      <tspan fill="#7C8794">(</tspan>
      <tspan fill="#B7B1A8">z + </tspan>
      <tspan fill="#7C8794">r</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#F7931A">d</tspan>
      <tspan fill="#7C8794">)</tspan>
      <tspan fill="#B7B1A8"> mod </tspan>
      <tspan fill="#7C8794">n</tspan>
    </text>
  </g>

  <!-- Arrow: sign box to signature -->
  <path d="M240 460V480" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <!-- Signature output -->
  <g filter="url(#soft)">
    <rect x="128" y="488" width="224" height="60" rx="14" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="240" y="516" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Signature</text>
    <text x="240" y="538" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">(r, s) pair</text>
  </g>

  <!-- Divider -->
  <rect x="470" y="158" width="2" height="392" rx="1" fill="#343A44"/>

  <!-- ===== RIGHT COLUMN: Verification ===== -->

  <!-- Inputs to verification -->
  <g filter="url(#soft)">
    <rect x="512" y="162" width="160" height="60" rx="14" fill="#20252D" stroke="#7C8794" stroke-width="2"/>
    <text x="592" y="190" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Message</text>
    <text x="592" y="212" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">z</text>
  </g>

  <g filter="url(#soft)">
    <rect x="696" y="162" width="220" height="60" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="806" y="190" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Public Key</text>
    <text x="806" y="212" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">Q</text>
  </g>

  <path d="M592 222V258" stroke="#7C8794" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <path d="M806 222V258" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>

  <!-- Signature input from left -->
  <path d="M352 518H480V294H498" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <!-- Verification box -->
  <g filter="url(#soft)">
    <rect x="498" y="266" width="418" height="192" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>

    <text x="520" y="298" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// compute helpers</tspan>
    </text>
    <text x="520" y="326" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="18">
      <tspan fill="#22C55E">u₁</tspan>
      <tspan fill="#B7B1A8"> = z </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> s⁻¹ mod </tspan>
      <tspan fill="#7C8794">n</tspan>
    </text>
    <text x="520" y="354" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="18">
      <tspan fill="#22C55E">u₂</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#7C8794">r</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> s⁻¹ mod </tspan>
      <tspan fill="#7C8794">n</tspan>
    </text>

    <text x="520" y="387" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// compute candidate point</tspan>
    </text>
    <text x="520" y="420" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600">
      <tspan fill="#F7931A">R'</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#22C55E">u₁</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">G</tspan>
      <tspan fill="#B7B1A8"> + </tspan>
      <tspan fill="#22C55E">u₂</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">Q</tspan>
    </text>
  </g>

  <!-- Arrow down to result -->
  <path d="M707 460V488" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>

  <!-- Verification result -->
  <g filter="url(#soft)">
    <rect x="546" y="496" width="322" height="52" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="707" y="522" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Check: R'.x == r ?</text>
    <text x="707" y="540" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">valid if equal, invalid otherwise</text>
  </g>

</svg>
