<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ECDSA Signing and Verification</title>
  <desc id="desc">Diagram showing ECDSA signing formula s = k^-1(z + r.d) mod n and verification formula R' = u1.G + u2.Q with flow from message and private key through nonce k to signature (r, s), then through verification to check R'.x equals r.</desc>


  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter" font-size="34" font-weight="700">ECDSA Signing and Verification</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter" font-size="18">Elliptic Curve Digital Signature Algorithm used in Bitcoin since 2009</text>

  <!-- Divider lines -->
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
    <path d="M76 424H884"/>
    <path d="M480 148V428"/>
  </g>

  <text x="278" y="140" text-anchor="middle" fill="#F7931A" font-family="Inter" font-size="15" font-weight="700">SIGNING</text>
  <text x="707" y="140" text-anchor="middle" fill="#22C55E" font-family="Inter" font-size="15" font-weight="700">VERIFICATION</text>

  <!-- ===== LEFT COLUMN: Signing ===== -->

  <!-- Private Key -->
  <g>
    <rect x="64" y="162" width="160" height="60" rx="14" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="144" y="190" text-anchor="middle" fill="#F7931A" font-family="Inter" font-size="15" font-weight="700">Private Key</text>
    <text x="144" y="212" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="14">d</text>
  </g>

  <!-- Message -->
  <g>
    <rect x="256" y="162" width="160" height="60" rx="14" fill="#20252D" stroke="#7C8794" stroke-width="2"/>
    <text x="336" y="190" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="15" font-weight="700">Message</text>
    <text x="336" y="212" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="14">z</text>
  </g>

  <!-- Arrow: d to sign -->
  <path d="M144 222V258" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="matrix(0 1 -1 0 149 250)"><path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- Arrow: z to sign -->
  <path d="M336 222V258" stroke="#7C8794" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="matrix(0 1 -1 0 341 250)"><path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- Signing box -->
  <g>
    <rect x="64" y="266" width="352" height="148" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>

    <text x="86" y="286" fill="#B7B1A8" font-family="JetBrains Mono" font-size="13">
      <tspan fill="#7C8794">// pick random nonce</tspan>
    </text>
    <text x="86" y="308" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">
      <tspan fill="#F7931A">k</tspan>
      <tspan fill="#B7B1A8"> = random(1, </tspan>
      <tspan fill="#7C8794">n</tspan>
      <tspan fill="#B7B1A8">-1)</tspan>
    </text>

    <text x="86" y="332" fill="#B7B1A8" font-family="JetBrains Mono" font-size="13">
      <tspan fill="#7C8794">// compute commitment</tspan>
    </text>
    <text x="86" y="354" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">
      <tspan fill="#F7931A">R</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#F7931A">k</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">G</tspan>
      <tspan fill="#7C8794">,  </tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">r</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#7C8794">R</tspan>
      <tspan fill="#B7B1A8">.x</tspan>
    </text>

    <text x="86" y="374" fill="#B7B1A8" font-family="JetBrains Mono" font-size="13">
      <tspan fill="#7C8794">// signature scalar</tspan>
    </text>
    <text x="86" y="394" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18" font-weight="600">
      <tspan fill="#F7931A">s</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#F7931A">k</tspan>
      <tspan fill="#B7B1A8">⁻¹</tspan>
      <tspan fill="#7C8794">(</tspan>
      <tspan fill="#B7B1A8">z + </tspan>
      <tspan fill="#7C8794">r</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#F7931A">d</tspan>
      <tspan fill="#7C8794">)</tspan>
      <tspan fill="#B7B1A8"> mod </tspan>
      <tspan fill="#7C8794">n</tspan>
    </text>
  </g>

  <!-- Arrow: sign box to signature -->
  <path d="M240 414V428" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="matrix(0 1 -1 0 245 420)"><path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- Signature output -->
  <g>
    <rect x="128" y="432" width="224" height="48" rx="14" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="240" y="452" text-anchor="middle" fill="#F7931A" font-family="Inter" font-size="15" font-weight="700">Signature</text>
    <text x="240" y="468" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="14">(r, s) pair</text>
  </g>

  <!-- Divider -->
  <rect x="470" y="158" width="2" height="322" rx="1" fill="#343A44"/>

  <!-- ===== RIGHT COLUMN: Verification ===== -->

  <!-- Inputs to verification -->
  <g>
    <rect x="512" y="162" width="160" height="60" rx="14" fill="#20252D" stroke="#7C8794" stroke-width="2"/>
    <text x="592" y="190" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="15" font-weight="700">Message</text>
    <text x="592" y="212" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="14">z</text>
  </g>

  <g>
    <rect x="696" y="162" width="220" height="60" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="806" y="190" text-anchor="middle" fill="#22C55E" font-family="Inter" font-size="15" font-weight="700">Public Key</text>
    <text x="806" y="212" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="14">Q</text>
  </g>

  <path d="M592 222V258" stroke="#7C8794" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="matrix(0 1 -1 0 597 250)"><path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M806 222V258" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="matrix(0 1 -1 0 811 250)"><path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- Signature input from left -->
  <path d="M352 456H480V294H561" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="matrix(1 0 0 1 553 289)"><path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- Verification box -->
  <g>
    <rect x="567" y="266" width="280" height="148" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>

    <text x="587" y="288" fill="#B7B1A8" font-family="JetBrains Mono" font-size="13">
      <tspan fill="#7C8794">// compute helpers</tspan>
    </text>
    <text x="587" y="310" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">
      <tspan fill="#22C55E">u₁</tspan>
      <tspan fill="#B7B1A8"> = z </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> s⁻¹ mod </tspan>
      <tspan fill="#7C8794">n</tspan>
    </text>
    <text x="587" y="334" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">
      <tspan fill="#22C55E">u₂</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#7C8794">r</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> s⁻¹ mod </tspan>
      <tspan fill="#7C8794">n</tspan>
    </text>

    <text x="587" y="356" fill="#B7B1A8" font-family="JetBrains Mono" font-size="13">
      <tspan fill="#7C8794">// compute candidate point</tspan>
    </text>
    <text x="587" y="378" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18" font-weight="600">
      <tspan fill="#F7931A">R'</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#22C55E">u₁</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">G</tspan>
      <tspan fill="#B7B1A8"> + </tspan>
      <tspan fill="#22C55E">u₂</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">Q</tspan>
    </text>
  </g>

  <!-- Arrow down to result -->
  <path d="M707 414V428" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="matrix(0 1 -1 0 712 420)"><path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- Verification result -->
  <g>
    <rect x="546" y="432" width="322" height="48" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="707" y="454" text-anchor="middle" fill="#22C55E" font-family="Inter" font-size="16" font-weight="700">Check: R'.x == r ?</text>
    <text x="707" y="470" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="12">valid if equal, invalid otherwise</text>
  </g>

</svg>
