<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Trust-Minimized Watchtower Design</title>
  <desc id="desc">Diagram showing the privacy-preserving design of watchtowers. Alice's channel data is encrypted into a blob containing only the revoked commitment txid prefix and the penalty signature — no balance or payment details. The watchtower stores these blobs in a database but cannot decrypt them. On detecting a matching txid on-chain, the watchtower publishes the encrypted justice transaction, which can only be spent by the honest node.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Trust-Minimized Watchtower Design</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Watchtowers receive encrypted justice transactions. They cannot learn channel balances, payment amounts, or counterparty identities.</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
  </g>

  <!-- Column labels -->
  <text x="180" y="142" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">CLIENT (ALICE)</text>
  <text x="480" y="142" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">WATCHTOWER</text>
  <text x="780" y="142" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">DETECTION EVENT</text>

  <!-- Left: Alice's Channel Data card -->
  <g filter="url(#soft)">
    <rect x="64" y="170" width="240" height="200" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="80" y="184" width="60" height="22" rx="6" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="110" y="200" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">CLIENT</text>
    <text x="196" y="200" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Alice's Channel</text>

    <!-- Encrypted blob visual -->
    <rect x="80" y="220" width="208" height="80" rx="10" fill="#1A1F26" stroke="#7C5CFF" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="184" y="240" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Encrypted Blob</text>
    <text x="92" y="260" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="9">revoked_txid_prefix: 0xf3a8...</text>
    <text x="92" y="276" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="9">penalty_sig: [encrypted]</text>
    <text x="92" y="292" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="9">blinding_key: [encrypted]</text>

    <!-- Not included section -->
    <line x1="80" y1="308" x2="288" y2="308" stroke="#28313B" stroke-width="1"/>
    <text x="184" y="322" text-anchor="middle" fill="#EF4444" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">NOT included</text>
    <text x="92" y="342" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">✗ Channel balance</text>
    <text x="92" y="360" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">✗ Payment details</text>
  </g>

  <!-- Center: Watchtower card -->
  <g filter="url(#soft)">
    <rect x="360" y="170" width="240" height="200" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="376" y="184" width="72" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="412" y="200" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">TOWER</text>
    <text x="490" y="200" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Watchtower</text>

    <!-- Database icon / visual -->
    <rect x="376" y="220" width="208" height="90" rx="10" fill="#1A1F26" stroke="#46505C" stroke-width="1"/>
    <rect x="412" y="230" width="136" height="24" rx="6" fill="#343A44" stroke="#46505C" stroke-width="1"/>
    <text x="480" y="248" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Blob Database</text>

    <!-- Blob entries -->
    <rect x="388" y="262" width="184" height="16" rx="4" fill="#241E31" stroke="#7C5CFF" stroke-width="0.8"/>
    <text x="396" y="275" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="9">blob_0xf3a8... ← indexed</text>
    <rect x="388" y="282" width="184" height="16" rx="4" fill="#241E31" stroke="#7C5CFF" stroke-width="0.8"/>
    <text x="396" y="295" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="9">blob_0x7b2c... ← indexed</text>

    <!-- Can't decrypt callout -->
    <rect x="376" y="322" width="208" height="34" rx="8" fill="#2A1B1B" stroke="#EF4444" stroke-width="1"/>
    <text x="480" y="338" text-anchor="middle" fill="#EF4444" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Cannot decrypt blob contents</text>
    <text x="480" y="350" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="10">No channel state visibility</text>
  </g>

  <!-- Right: Detection Event card -->
  <g filter="url(#soft)">
    <rect x="656" y="170" width="240" height="200" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="672" y="184" width="80" height="22" rx="6" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="712" y="200" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">EVENT</text>
    <text x="796" y="200" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Detection</text>

    <!-- Match found -->
    <rect x="672" y="220" width="208" height="50" rx="10" fill="#1A1F26" stroke="#22C55E" stroke-width="1.5"/>
    <text x="776" y="240" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">✓ txid match found</text>
    <text x="684" y="258" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">Matching revoked tx on-chain</text>

    <!-- Publish action -->
    <rect x="672" y="282" width="208" height="50" rx="10" fill="#1A1F26" stroke="#F7931A" stroke-width="1.5"/>
    <text x="776" y="302" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Publishes justice tx</text>
    <text x="684" y="320" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">Penalty transaction broadcast</text>

    <!-- Result -->
    <rect x="672" y="344" width="208" height="26" rx="8" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="776" y="362" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">All channel funds → Alice</text>
  </g>

  <!-- Arrow: Alice to Watchtower -->
  <path d="M304 270L340 270" stroke="#F7931A" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="322" y="260" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">Uploads encrypted blob</text>

  <!-- Arrow: Watchtower to Detection -->
  <path d="M600 270L636 270" stroke="#22C55E" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="618" y="260" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">On txid match → publish</text>

  <!-- Privacy callout banner -->
  <g filter="url(#soft)">
    <rect x="160" y="400" width="640" height="48" rx="12" fill="#241E31" stroke="#7C5CFF" stroke-width="1.5"/>
    <text x="480" y="420" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Blob encryption ensures watchtower learns nothing about channel state or balance</text>
    <text x="480" y="438" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">The watchtower only stores and matches — it never sees your balance or payment history</text>
  </g>
</svg>
