<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Routing Fee Accumulation</title>
  <desc id="desc">Diagram showing a 3-hop payment path from Alice to Diana via Bob and Carol. Alice sends 100,000 sats. Bob charges 10 msat base + 100 ppm. Carol charges 5 msat base + 50 ppm. Diana receives 99,985 sats. Each hop deducts fees from the forwarded amount.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Routing Fee Accumulation</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Each hop charges a base fee and a proportional fee, deducted from the payment amount</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M64 220H896"/>
    <path d="M64 390H896"/>
  </g>

  <!-- Alice (sender) -->
  <g filter="url(#soft)">
    <rect x="64" y="156" width="150" height="54" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="78" y="168" width="26" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="110" y="184" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13">A</text>
    <text x="124" y="184" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Alice</text>
    <text x="80" y="200" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Sender</text>
  </g>
  <text x="88" y="240" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">Sends</text>
  <text x="88" y="258" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">100,000 sats</text>

  <!-- Arrow Alice → Bob -->
  <line x1="214" y1="189" x2="282" y2="189" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="220" y="175" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">100,000 sats</text>

  <!-- Bob (hop 1) -->
  <g filter="url(#soft)">
    <rect x="292" y="156" width="150" height="54" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="306" y="168" width="26" height="22" rx="6" fill="#241E31" stroke="#7C5CFF" stroke-width="1"/>
    <text x="338" y="184" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="13">B</text>
    <text x="352" y="184" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Bob</text>
    <text x="308" y="200" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Hop 1</text>
  </g>
  <!-- Bob fee card -->
  <g filter="url(#soft)">
    <rect x="274" y="232" width="186" height="70" rx="10" fill="#20252D" stroke="#343A44" stroke-width="1"/>
    <text x="288" y="252" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Bob's fees</text>
    <text x="288" y="272" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Base: 10 msat</text>
    <text x="288" y="290" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Proportional: 100 ppm</text>
  </g>
  <!-- Forwarded amount after Bob -->
  <text x="320" y="330" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">→ 99,990 sats</text>

  <!-- Arrow Bob → Carol -->
  <line x1="442" y1="189" x2="510" y2="189" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="448" y="175" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">99,990 sats</text>

  <!-- Carol (hop 2) -->
  <g filter="url(#soft)">
    <rect x="520" y="156" width="150" height="54" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="534" y="168" width="26" height="22" rx="6" fill="#241E31" stroke="#7C5CFF" stroke-width="1"/>
    <text x="566" y="184" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="13">C</text>
    <text x="580" y="184" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Carol</text>
    <text x="536" y="200" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Hop 2</text>
  </g>
  <!-- Carol fee card -->
  <g filter="url(#soft)">
    <rect x="502" y="232" width="186" height="70" rx="10" fill="#20252D" stroke="#343A44" stroke-width="1"/>
    <text x="516" y="252" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Carol's fees</text>
    <text x="516" y="272" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Base: 5 msat</text>
    <text x="516" y="290" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Proportional: 50 ppm</text>
  </g>
  <!-- Forwarded amount after Carol -->
  <text x="548" y="330" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">→ 99,985 sats</text>

  <!-- Arrow Carol → Diana -->
  <line x1="670" y1="189" x2="738" y2="189" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="676" y="175" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">99,985 sats</text>

  <!-- Diana (recipient) -->
  <g filter="url(#soft)">
    <rect x="748" y="156" width="150" height="54" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="762" y="168" width="26" height="22" rx="6" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="794" y="184" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13">D</text>
    <text x="808" y="184" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Diana</text>
    <text x="764" y="200" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Recipient</text>
  </g>
  <text x="762" y="240" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">Receives</text>
  <text x="762" y="258" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">99,985 sats</text>

  <!-- Total fees callout -->
  <g filter="url(#soft)">
    <rect x="64" y="352" width="420" height="72" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="80" y="376" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">FORMULA</text>
    <text x="80" y="398" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="13">Total fee = base_fee × hops + amount × proportional_rate ÷ 1,000,000</text>
    <text x="80" y="416" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">= (10+5) + (100,000×100 + 99,990×50) / 1,000,000 = 15 sats</text>
  </g>

  <!-- Fee distribution -->
  <g filter="url(#soft)">
    <rect x="540" y="352" width="360" height="72" rx="10" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="556" y="376" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">FEE DISTRIBUTION</text>
    <text x="556" y="398" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Bob receives: 10 sats + 10 msat</text>
    <text x="556" y="416" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Carol receives: 5 sats — Total fees: 15 sats</text>
  </g>
</svg>
