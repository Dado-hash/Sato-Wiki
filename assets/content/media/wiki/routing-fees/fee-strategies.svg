<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Routing Fee Strategies</title>
  <desc id="desc">Comparison of three routing fee strategies: Cheap router (1 msat base, 1 ppm, high volume), Balanced router (10 msat base, 100 ppm, moderate volume), Premium router (1000 msat base, 5000 ppm, low volume). Each strategy shows a node card with network connections and a revenue comparison chart.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Routing Fee Strategies</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Nodes set their own fees. Lower fees attract more traffic; higher fees earn more per payment.</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M64 210H896"/>
    <path d="M64 370H896"/>
  </g>

  <!-- Column headers -->
  <text x="195" y="150" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">CHEAP ROUTER</text>
  <text x="480" y="150" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">BALANCED ROUTER</text>
  <text x="765" y="150" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">PREMIUM ROUTER</text>

  <!-- Column 1: Cheap router -->
  <g filter="url(#soft)">
    <rect x="80" y="168" width="230" height="100" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <rect x="96" y="182" width="34" height="22" rx="6" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="124" y="197" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12">$</text>
    <text x="140" y="197" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Cheap Router</text>
    <text x="96" y="222" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">Base fee:  1 msat</text>
    <text x="96" y="240" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">PPM:       1 ppm</text>
    <text x="96" y="258" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">High volume · Low revenue/payment</text>
  </g>
  <!-- Network lines (many, showing high volume) -->
  <g stroke="#22C55E" stroke-width="1" opacity="0.3">
    <line x1="84" y1="172" x2="44" y2="132"/>
    <line x1="180" y1="168" x2="200" y2="130"/>
    <line x1="306" y1="172" x2="340" y2="136"/>
    <line x1="84" y1="268" x2="44" y2="300"/>
    <line x1="200" y1="268" x2="220" y2="310"/>
    <line x1="306" y1="268" x2="340" y2="296"/>
  </g>
  <g stroke="#22C55E" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="170" x2="50" y2="140"/>
    <line x1="220" y1="170" x2="260" y2="140"/>
    <line x1="310" y1="270" x2="350" y2="290"/>
  </g>

  <!-- Column 2: Balanced router -->
  <g filter="url(#soft)">
    <rect x="365" y="168" width="230" height="100" rx="14" fill="#20252D" stroke="#7C5CFF" stroke-width="2"/>
    <rect x="381" y="182" width="34" height="22" rx="6" fill="#241E31" stroke="#7C5CFF" stroke-width="1"/>
    <text x="409" y="197" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="12">$$</text>
    <text x="425" y="197" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Balanced Router</text>
    <text x="381" y="222" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">Base fee:  10 msat</text>
    <text x="381" y="240" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">PPM:       100 ppm</text>
    <text x="381" y="258" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Moderate volume · Medium revenue</text>
  </g>
  <!-- Network lines (moderate) -->
  <g stroke="#7C5CFF" stroke-width="1" opacity="0.3">
    <line x1="370" y1="172" x2="340" y2="136"/>
    <line x1="590" y1="172" x2="620" y2="136"/>
    <line x1="480" y1="268" x2="480" y2="310"/>
  </g>
  <g stroke="#7C5CFF" stroke-width="1.5" opacity="0.5">
    <line x1="410" y1="170" x2="440" y2="140"/>
    <line x1="550" y1="268" x2="580" y2="290"/>
  </g>

  <!-- Column 3: Premium router -->
  <g filter="url(#soft)">
    <rect x="650" y="168" width="230" height="100" rx="14" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <rect x="666" y="182" width="34" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="694" y="197" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12">$$$</text>
    <text x="710" y="197" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Premium Router</text>
    <text x="666" y="222" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">Base fee:  1,000 msat</text>
    <text x="666" y="240" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">PPM:       5,000 ppm</text>
    <text x="666" y="258" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Low volume · High revenue/payment</text>
  </g>
  <!-- Network lines (few, showing low volume) -->
  <g stroke="#F7931A" stroke-width="1" opacity="0.3">
    <line x1="655" y1="176" x2="630" y2="140"/>
    <line x1="875" y1="176" x2="900" y2="140"/>
  </g>
  <g stroke="#F7931A" stroke-width="1.5" opacity="0.4">
    <line x1="700" y1="268" x2="730" y2="300"/>
  </g>

  <!-- Revenue comparison chart -->
  <text x="64" y="340" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Relative Revenue Comparison</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <line x1="100" y1="364" x2="100" y2="440"/>
    <line x1="100" y1="440" x2="900" y2="440"/>
    <!-- Y-axis labels -->
    <text x="88" y="440" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">0</text>
    <text x="88" y="415" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">25</text>
    <text x="88" y="390" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">50</text>
    <text x="88" y="365" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">75</text>
    <!-- Grid lines -->
    <path d="M108 414H900" stroke-dasharray="4 4"/>
    <path d="M108 389H900" stroke-dasharray="4 4"/>
    <path d="M108 364H900" stroke-dasharray="4 4"/>
  </g>

  <!-- Cheap bar -->
  <g filter="url(#soft)">
    <rect x="160" y="414" width="80" height="26" rx="4" fill="#22C55E" opacity="0.8"/>
    <text x="200" y="432" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">Volume</text>
  </g>
  <rect x="160" y="380" width="80" height="34" rx="4" fill="#203327" stroke="#22C55E" stroke-width="1"/>
  <text x="200" y="402" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">10M</text>
  <text x="200" y="462" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="10">Payments</text>

  <!-- Balanced bar -->
  <g filter="url(#soft)">
    <rect x="420" y="414" width="80" height="26" rx="4" fill="#7C5CFF" opacity="0.8"/>
    <text x="460" y="432" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">Volume</text>
  </g>
  <rect x="420" y="397" width="80" height="43" rx="4" fill="#241E31" stroke="#7C5CFF" stroke-width="1"/>
  <text x="460" y="425" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">1M</text>
  <text x="460" y="462" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="10">Payments</text>

  <!-- Premium bar -->
  <g filter="url(#soft)">
    <rect x="680" y="414" width="80" height="26" rx="4" fill="#F7931A" opacity="0.8"/>
    <text x="720" y="432" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">Volume</text>
  </g>
  <rect x="680" y="414" width="80" height="26" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  <text x="720" y="433" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">10K</text>
  <text x="720" y="462" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="10">Payments</text>

  <!-- Revenue bars on top -->
  <g filter="url(#soft)">
    <rect x="260" y="375" width="120" height="65" rx="6" fill="#203327" stroke="#22C55E" stroke-width="1" opacity="0.7"/>
    <text x="320" y="400" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">10,000 sats</text>
    <text x="320" y="420" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">Low unit fee</text>
    <text x="320" y="435" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">× high volume</text>
  </g>
  <g filter="url(#soft)">
    <rect x="520" y="380" width="120" height="60" rx="6" fill="#241E31" stroke="#7C5CFF" stroke-width="1" opacity="0.7"/>
    <text x="580" y="403" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">10,000 sats</text>
    <text x="580" y="421" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">Medium fee × volume</text>
  </g>
  <g filter="url(#soft)">
    <rect x="780" y="390" width="100" height="50" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1" opacity="0.7"/>
    <text x="830" y="412" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">10,000 sats</text>
    <text x="830" y="430" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">High fee × low volume</text>
  </g>

  <!-- Legend at bottom -->
  <line x1="64" y1="480" x2="120" y2="480" stroke="#22C55E" stroke-width="2"/>
  <text x="126" y="484" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Payment volume</text>
  <line x1="240" y1="480" x2="296" y2="480" stroke="#F7931A" stroke-width="2"/>
  <text x="302" y="484" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Total revenue</text>
  <rect x="396" y="476" width="8" height="8" rx="2" fill="#22C55E" opacity="0.6"/>
  <text x="410" y="484" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">≈ same total revenue</text>
</svg>
