<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UTXO model flow</title>
  <desc id="desc">A wallet selects whole unspent outputs, spends them, and receives new change outputs.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Coins are discrete outputs</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Wallet balance is the sum of spendable UTXOs, not one mutable account row.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 160H884"/>
    <path d="M76 300H884"/>
    <path d="M76 440H884"/>
    <path d="M180 150V458"/>
    <path d="M480 150V458"/>
    <path d="M780 150V458"/>
  </g>

  <text x="92" y="166" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">wallet-selected UTXOs</text>
  <text x="404" y="166" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">spend transaction</text>
  <text x="706" y="166" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">new UTXOs</text>

  <g filter="url(#soft)">
    <rect x="82" y="206" width="156" height="64" rx="32" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="160" y="244" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">50k sats</text>
    <rect x="112" y="298" width="126" height="64" rx="32" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="175" y="336" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">12k sats</text>
    <rect x="82" y="390" width="156" height="64" rx="32" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="160" y="428" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">30k sats</text>
  </g>

  <path d="M252 238H382" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M252 422C318 422 334 344 382 344" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="390" y="220" width="180" height="150" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="480" y="260" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Spend whole</text>
    <text x="480" y="290" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">outputs</text>
    <rect x="424" y="318" width="112" height="30" rx="15" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="480" y="339" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">no partial coin</text>
  </g>

  <path d="M584 270C644 236 652 226 704 226" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M584 322C644 356 652 366 704 366" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="704" y="194" width="174" height="64" rx="32" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="791" y="232" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">payment 60k</text>
    <rect x="704" y="332" width="174" height="64" rx="32" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="791" y="370" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">change 19k</text>
    <rect x="704" y="412" width="174" height="42" rx="21" fill="#241E31" stroke="#7C5CFF" stroke-width="1.6"/>
    <text x="791" y="439" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">fee 1k</text>
  </g>
</svg>
