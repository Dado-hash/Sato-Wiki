<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lightning channel and watchtower</title>
  <desc id="desc">Two peers share a payment channel while a watchtower watches the blockchain for an old state.</desc>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(6 12)">

  <!-- Blockchain bar -->
  <rect x="130" y="390" width="700" height="44" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <rect x="170" y="400" width="60" height="24" rx="4" fill="#2A303A"/>
  <rect x="260" y="400" width="60" height="24" rx="4" fill="#2A303A"/>
  <rect x="350" y="400" width="60" height="24" rx="4" fill="#2A303A"/>
  <rect x="440" y="400" width="60" height="24" rx="4" fill="#2A303A"/>
  <rect x="530" y="400" width="60" height="24" rx="4" fill="#2A303A"/>
  <rect x="620" y="400" width="60" height="24" rx="4" fill="#2A303A"/>

  <!-- Watchtower watching the chain -->
  <path d="M480 144V376" stroke="#46505C" stroke-width="2" stroke-dasharray="5 7"/>
  <polygon points="480,384 474,372 486,372" fill="#22C55E"/>
  <rect x="390" y="92" width="180" height="52" rx="8" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
  <text x="480" y="124" text-anchor="middle" fill="#22C55E" font-family="Inter" font-size="18" font-weight="700">watchtower</text>

  <!-- Backup file feeding node A -->
  <path d="M190 180L290 260" stroke="#7C8794" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="120" y="120" width="140" height="60" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="190" y="156" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="18" font-weight="700">backup</text>

  <!-- Channel between peers A and B -->
  <path d="M346 260H614" stroke="#F7931A" stroke-width="6" stroke-linecap="round"/>

  <circle cx="290" cy="260" r="56" fill="#20252D" stroke="#F7931A" stroke-width="2.5"/>
  <text x="290" y="270" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="28" font-weight="700">A</text>
  <circle cx="670" cy="260" r="56" fill="#20252D" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="670" y="270" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="28" font-weight="700">B</text>
</g>
</svg>
