<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Miner Incentives</title>
  <desc id="desc">Diagram showing the two sources of miner revenue: block subsidy (newly created bitcoin) and transaction fees paid by users, which together secure the network.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Miner Incentives</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">The economic rewards that motivate miners to secure the network.</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 152H884"/><path d="M76 400H884"/><path d="M480 150V490"/>
  </g>
  <!-- Left: Subsidy -->
  <g filter="url(#soft)">
    <rect x="64" y="170" width="380" height="220" rx="20" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="254" y="206" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Block Subsidy</text>
    <text x="254" y="230" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">Newly created bitcoin per block</text>
    <rect x="90" y="252" width="328" height="1" fill="#343A44"/>
    <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#F4EAD8">
      <text x="100" y="288">Source:</text>
      <text x="205" y="288" fill="#F7931A">Protocol emission schedule</text>
      <text x="100" y="318">Predictable:</text>
      <text x="205" y="318" fill="#22C55E">Known decades in advance</text>
      <text x="100" y="348">Trend:</text>
      <text x="205" y="348" fill="#F7931A">Halves every 4 years →</text>
      <text x="205" y="368" fill="#F7931A">zero by 2140</text>
    </g>
  </g>
  <!-- Right: Fees -->
  <g filter="url(#soft)">
    <rect x="480" y="170" width="416" height="220" rx="20" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="688" y="206" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Transaction Fees</text>
    <text x="688" y="230" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">Paid by users for block space</text>
    <rect x="506" y="252" width="364" height="1" fill="#343A44"/>
    <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#F4EAD8">
      <text x="520" y="288">Source:</text>
      <text x="620" y="288" fill="#22C55E">User demand for confirmation</text>
      <text x="520" y="318">Variable:</text>
      <text x="620" y="318" fill="#F7931A">Driven by mempool congestion</text>
      <text x="520" y="348">Trend:</text>
      <text x="620" y="348" fill="#22C55E">Growing as adoption increases</text>
    </g>
  </g>
  <!-- Bottom: Combined security -->
  <g filter="url(#soft)">
    <rect x="220" y="418" width="520" height="72" rx="16" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="480" y="442" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Subsidy + Fees = Miner Revenue → Network Security</text>
    <text x="480" y="462" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Miners are profit-maximizers. Their competition to collect rewards</text>
    <text x="480" y="480" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">makes the chain immutable.</text>
  </g>
  <path d="M254 390V410" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M688 390V410" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
</svg>
