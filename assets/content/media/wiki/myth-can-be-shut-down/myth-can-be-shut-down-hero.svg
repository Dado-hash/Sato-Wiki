<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Many independent nodes</title>
  <desc id="desc">A mesh of full nodes in which one node switched off leaves the rest of the network running.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 -30)">

  <!-- Mesh links -->
  <path d="M240 170H720M240 280H720M240 390H720M240 170V390M360 170V390M480 170V390M600 170V390M720 170V390" stroke="#343A44" stroke-width="2"/>

  <!-- Full nodes -->
  <circle cx="360" cy="170" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="480" cy="170" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="600" cy="170" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="720" cy="170" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="240" cy="280" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="360" cy="280" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="480" cy="280" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="600" cy="280" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="720" cy="280" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="240" cy="390" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="360" cy="390" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="480" cy="390" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="600" cy="390" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>
  <circle cx="720" cy="390" r="22" fill="#1C2128" stroke="#22C55E" stroke-width="2.5"/>

  <!-- One node switched off -->
  <circle cx="240" cy="170" r="22" fill="#171B21" stroke="#8E96A4" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="480" y="462" text-anchor="middle" fill="#B7B1A8" font-family="Inter" font-size="18">node</text>
</g>
</svg>
