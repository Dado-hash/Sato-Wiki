<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pseudonymous addresses</title>
  <desc id="desc">Several addresses linked to one identity on a public ledger, so the pseudonyms can be connected.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(10 6)">

  <!-- Identity document linked to one address -->
  <rect x="400" y="80" width="140" height="84" rx="8" fill="#20252D" stroke="#8E96A4" stroke-width="2"/>
  <text x="470" y="112" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">ID</text>
  <rect x="422" y="126" width="96" height="6" rx="3" fill="#343A44"/>
  <rect x="422" y="140" width="64" height="6" rx="3" fill="#343A44"/>
  <path d="M470 164V200" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- Linked addresses -->
  <rect x="180" y="200" width="150" height="64" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <rect x="200" y="216" width="112" height="6" rx="3" fill="#8E96A4"/>
  <rect x="200" y="228" width="86" height="6" rx="3" fill="#8E96A4"/>
  <rect x="200" y="240" width="100" height="6" rx="3" fill="#8E96A4"/>

  <rect x="395" y="200" width="150" height="64" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <rect x="415" y="216" width="112" height="6" rx="3" fill="#8E96A4"/>
  <rect x="415" y="228" width="86" height="6" rx="3" fill="#8E96A4"/>
  <rect x="415" y="240" width="100" height="6" rx="3" fill="#8E96A4"/>

  <rect x="610" y="200" width="150" height="64" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <rect x="630" y="216" width="112" height="6" rx="3" fill="#8E96A4"/>
  <rect x="630" y="228" width="86" height="6" rx="3" fill="#8E96A4"/>
  <rect x="630" y="240" width="100" height="6" rx="3" fill="#8E96A4"/>

  <path d="M330 232H395M545 232H610" stroke="#F7931A" stroke-width="3"/>

  <!-- Unlinked addresses -->
  <rect x="180" y="324" width="150" height="64" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <rect x="200" y="340" width="112" height="6" rx="3" fill="#343A44"/>
  <rect x="200" y="352" width="86" height="6" rx="3" fill="#343A44"/>
  <rect x="200" y="364" width="100" height="6" rx="3" fill="#343A44"/>

  <rect x="395" y="324" width="150" height="64" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <rect x="415" y="340" width="112" height="6" rx="3" fill="#343A44"/>
  <rect x="415" y="352" width="86" height="6" rx="3" fill="#343A44"/>
  <rect x="415" y="364" width="100" height="6" rx="3" fill="#343A44"/>

  <rect x="610" y="324" width="150" height="64" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <rect x="630" y="340" width="112" height="6" rx="3" fill="#343A44"/>
  <rect x="630" y="352" width="86" height="6" rx="3" fill="#343A44"/>
  <rect x="630" y="364" width="100" height="6" rx="3" fill="#343A44"/>

  <!-- Public ledger strip -->
  <rect x="180" y="416" width="580" height="40" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <rect x="196" y="426" width="84" height="20" rx="4" fill="#20252D" stroke="#343A44" stroke-width="1.5"/>
  <rect x="296" y="426" width="84" height="20" rx="4" fill="#20252D" stroke="#343A44" stroke-width="1.5"/>
  <rect x="396" y="426" width="84" height="20" rx="4" fill="#20252D" stroke="#343A44" stroke-width="1.5"/>
  <rect x="496" y="426" width="84" height="20" rx="4" fill="#20252D" stroke="#343A44" stroke-width="1.5"/>
  <rect x="596" y="426" width="84" height="20" rx="4" fill="#20252D" stroke="#343A44" stroke-width="1.5"/>
</g>
</svg>
