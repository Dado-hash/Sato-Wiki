<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HD Wallet Key Tree</title>
  <desc id="desc">Hierarchical tree structure of key derivation: master seed generates master key, which derives child key pairs at depth 0, then account-level keys at depth 1, chain-level keys (external/internal) at depth 2, and address-level keys at depth 3. BIP 44 and BIP 84 derivation paths shown.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">HD Wallet</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Hierarchical deterministic key derivation tree (BIP 32 / BIP 44)</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
  </g>
  <g stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M480 188L480 236" stroke="#F7931A" marker-end="url(#arrow-orange)"/>
    <path d="M310 278L194 340" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <path d="M310 278L426 340" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <path d="M650 278L534 340" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <path d="M650 278L766 340" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
  </g>
  <g filter="url(#soft)">
    <rect x="350" y="160" width="260" height="36" rx="10" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="480" y="184" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Master Seed (512 bits)</text>
  </g>
  <g filter="url(#soft)">
    <rect x="350" y="244" width="260" height="36" rx="10" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="480" y="268" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Master Key (m)</text>
  </g>
  <g filter="url(#soft)">
    <rect x="68" y="348" width="200" height="36" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="168" y="372" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">m / purpose'</text>
  </g>
  <g filter="url(#soft)">
    <rect x="300" y="348" width="200" height="36" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="400" y="372" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">m / purpose' / coin'</text>
  </g>
  <g filter="url(#soft)">
    <rect x="532" y="348" width="200" height="36" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="632" y="372" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">m / ... / account'</text>
  </g>
  <g filter="url(#soft)">
    <rect x="764" y="348" width="156" height="36" rx="10" fill="#20252D" stroke="#22C55E" stroke-width="1.5"/>
    <text x="842" y="372" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13">Address keys</text>
  </g>
  <g filter="url(#soft)">
    <rect x="64" y="408" width="856" height="90" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="492" y="436" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Standard Derivation Paths</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M80 450H904"/>
    </g>
    <text x="100" y="476" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 44 (Legacy)</text>
    <text x="100" y="492" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">m / 44' / 0' / 0' / 0 / 0</text>
    <text x="340" y="476" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 49 (SegWit)</text>
    <text x="340" y="492" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">m / 49' / 0' / 0' / 0 / 0</text>
    <text x="570" y="476" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 84 (Native SegWit)</text>
    <text x="570" y="492" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">m / 84' / 0' / 0' / 0 / 0</text>
    <text x="800" y="476" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 86 (Taproot)</text>
    <text x="800" y="492" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">m / 86' / 0' / 0' / 0 / 0</text>
  </g>
</svg>
