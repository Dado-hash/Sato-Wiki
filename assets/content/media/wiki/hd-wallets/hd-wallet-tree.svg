<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HD Wallet Key Tree</title>
  <desc id="desc">Hierarchical tree structure of key derivation: master seed generates master key, which derives child key pairs at depth 0, then account-level keys at depth 1, chain-level keys (external/internal) at depth 2, and address-level keys at depth 3. BIP 44 and BIP 84 derivation paths shown.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="52" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">HD Wallet</text>
  <text x="52" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Hierarchical deterministic key derivation tree (BIP 32 / BIP 44)</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M64 148H896"/>
  </g>
  <g stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M480 188L480 236" stroke="#F7931A" marker-end="url(#arrow-orange)"/>
    <path d="M480 280L156 346" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <path d="M480 280L388 346" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <path d="M480 280L620 346" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <path d="M480 280L830 346" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
  </g>
  <g filter="url(#soft)">
    <rect x="338" y="160" width="260" height="36" rx="10" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="468" y="184" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Master Seed (512 bits)</text>
  </g>
  <g filter="url(#soft)">
    <rect x="338" y="244" width="260" height="36" rx="10" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="468" y="268" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Master Key (m)</text>
  </g>
  <g filter="url(#soft)">
    <rect x="56" y="348" width="200" height="36" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="156" y="372" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">m / purpose'</text>
  </g>
  <g filter="url(#soft)">
    <rect x="288" y="348" width="200" height="36" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="388" y="372" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">m / purpose' / coin'</text>
  </g>
  <g filter="url(#soft)">
    <rect x="520" y="348" width="200" height="36" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="620" y="372" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">m / ... / account'</text>
  </g>
  <g filter="url(#soft)">
    <rect x="752" y="348" width="156" height="36" rx="10" fill="#20252D" stroke="#22C55E" stroke-width="1.5"/>
    <text x="830" y="372" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13">Address keys</text>
  </g>
  <g filter="url(#soft)">
    <rect x="52" y="408" width="856" height="90" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="480" y="436" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Standard Derivation Paths</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M68 450H892"/>
    </g>
    <text x="159" y="466" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 44 (Legacy)</text>
    <text x="159" y="482" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">m / 44' / 0' / 0' / 0 / 0</text>
    <text x="373" y="466" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 49 (SegWit)</text>
    <text x="373" y="482" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">m / 49' / 0' / 0' / 0 / 0</text>
    <text x="587" y="466" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 84 (Native SegWit)</text>
    <text x="587" y="482" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">m / 84' / 0' / 0' / 0 / 0</text>
    <text x="801" y="466" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 86 (Taproot)</text>
    <text x="801" y="482" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">m / 86' / 0' / 0' / 0 / 0</text>
  </g>
</svg>
