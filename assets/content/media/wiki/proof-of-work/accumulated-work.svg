<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Accumulated proof of work</title>
  <desc id="desc">Two competing branches share a common ancestor. Nodes choose the valid branch with more accumulated work.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C5CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Accumulated work wins</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Nodes compare valid branches by total work, not by trust in a miner.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 176H884"/>
    <path d="M76 286H884"/>
    <path d="M76 396H884"/>
    <path d="M168 176V438"/>
    <path d="M472 176V438"/>
    <path d="M776 176V438"/>
  </g>

  <g stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M176 246H256" stroke="#F7931A"/>
    <path d="M348 246H428" stroke="#F7931A"/>
    <path d="M520 246H584" stroke="#F7931A"/>
    <path d="M676 246H742" stroke="#F7931A" marker-end="url(#arrow-orange)"/>
    <path d="M348 246C395 254 398 356 428 356" stroke="#7C5CFF"/>
    <path d="M520 356H584" stroke="#7C5CFF"/>
    <path d="M676 356H742" stroke="#7C5CFF" marker-end="url(#arrow-violet)"/>
  </g>

  <g filter="url(#soft)" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="204" width="96" height="84" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="128" y="240" fill="#F4EAD8" font-size="18" font-weight="700">A</text>
    <g fill="#B7B1A8" opacity="0.76">
      <circle cx="112" cy="266" r="3"/>
      <circle cx="128" cy="266" r="3"/>
      <circle cx="144" cy="266" r="3"/>
    </g>

    <rect x="252" y="204" width="96" height="84" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="300" y="240" fill="#F4EAD8" font-size="18" font-weight="700">B</text>
    <g fill="#B7B1A8" opacity="0.76">
      <circle cx="284" cy="266" r="3"/>
      <circle cx="300" cy="266" r="3"/>
      <circle cx="316" cy="266" r="3"/>
    </g>

    <rect x="428" y="204" width="96" height="84" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="476" y="240" fill="#F4EAD8" font-size="18" font-weight="700">C</text>
    <g fill="#B7B1A8" opacity="0.76">
      <circle cx="460" cy="266" r="3"/>
      <circle cx="476" cy="266" r="3"/>
      <circle cx="492" cy="266" r="3"/>
    </g>

    <rect x="584" y="204" width="96" height="84" rx="14" fill="#203327" stroke="#22C55E" stroke-width="3"/>
    <text x="632" y="240" fill="#F4EAD8" font-size="18" font-weight="700">D</text>
    <g fill="#22C55E">
      <circle cx="608" cy="266" r="3"/>
      <circle cx="624" cy="266" r="3"/>
      <circle cx="640" cy="266" r="3"/>
      <circle cx="656" cy="266" r="3"/>
    </g>

    <rect x="428" y="314" width="96" height="84" rx="14" fill="#2A2331" stroke="#7C5CFF" stroke-width="2"/>
    <text x="476" y="350" fill="#F4EAD8" font-size="18" font-weight="700">C'</text>
    <g fill="#B7B1A8" opacity="0.68">
      <circle cx="468" cy="376" r="3"/>
      <circle cx="484" cy="376" r="3"/>
    </g>

    <rect x="584" y="314" width="96" height="84" rx="14" fill="#2A2331" stroke="#7C5CFF" stroke-width="2"/>
    <text x="632" y="350" fill="#F4EAD8" font-size="18" font-weight="700">D'</text>
    <g fill="#B7B1A8" opacity="0.68">
      <circle cx="624" cy="376" r="3"/>
      <circle cx="640" cy="376" r="3"/>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="770" y="204" width="112" height="84" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="2"/>
    <text x="826" y="239" fill="#22C55E" font-size="18" font-weight="700">More</text>
    <text x="826" y="265" fill="#22C55E" font-size="18" font-weight="700">work</text>

    <rect x="770" y="314" width="112" height="84" rx="14" fill="#241E31" stroke="#7C5CFF" stroke-width="2"/>
    <text x="826" y="349" fill="#B7B1A8" font-size="18" font-weight="700">Valid</text>
    <text x="826" y="375" fill="#B7B1A8" font-size="18" font-weight="700">less work</text>
  </g>

  <text x="82" y="464" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">A reorg must overtake the public branch's accumulated proof of work.</text>
</svg>
