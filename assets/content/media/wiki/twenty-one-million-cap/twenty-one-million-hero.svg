<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The 21 Million Cap</title>
  <desc id="desc">Visual representation of the 21 million bitcoin cap: a central pillar showing the fixed limit, with surrounding stats showing emission rate, coins mined, and remaining supply.</desc>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">The 21 Million Cap</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Why 21 million? The number was chosen deliberately.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 160H884"/>
    <path d="M480 160V490"/>
  </g>

  <!-- Left side: main explanation -->
  <g filter="url(#soft)">
    <rect x="64" y="180" width="380" height="308" rx="20" fill="#20252D" stroke="#F7931A" stroke-width="2"/>

    <text x="254" y="218" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">21,000,000 BTC</text>
    <text x="254" y="248" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">Hard cap in consensus code</text>

    <rect x="90" y="270" width="328" height="1" fill="#343A44"/>

    <text x="100" y="302" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16">The number comes from two decisions:</text>

    <g font-family="Inter, Arial, sans-serif" font-size="15">
      <rect x="100" y="324" width="14" height="14" rx="4" fill="#F7931A"/>
      <text x="126" y="336" fill="#B7B1A8">50 BTC block subsidy at launch</text>

      <rect x="100" y="358" width="14" height="14" rx="4" fill="#F7931A"/>
      <text x="126" y="370" fill="#B7B1A8">Halving every 210,000 blocks (~4 years)</text>
    </g>

    <rect x="90" y="400" width="328" height="1" fill="#343A44"/>

    <text x="100" y="432" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">Sum = 50 + 25 + 12.5 + 6.25 + ... ≈ 21M</text>
    <text x="100" y="456" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">Geometric series: 21,000,000 exactly</text>
  </g>

  <!-- Right side: stats cards -->
  <g filter="url(#soft)">
    <rect x="500" y="180" width="190" height="136" rx="16" fill="#20252D" stroke="#22C55E" stroke-width="1.8"/>
    <text x="595" y="218" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Mined</text>
    <text x="595" y="258" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">~19.6M</text>
    <text x="595" y="290" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">~93% of total</text>
  </g>

  <g filter="url(#soft)">
    <rect x="714" y="180" width="190" height="136" rx="16" fill="#20252D" stroke="#F7931A" stroke-width="1.8"/>
    <text x="809" y="218" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Remaining</text>
    <text x="809" y="258" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">~1.4M</text>
    <text x="809" y="290" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">~7% remaining</text>
  </g>

  <g filter="url(#soft)">
    <rect x="500" y="340" width="190" height="136" rx="16" fill="#20252D" stroke="#7C5CFF" stroke-width="1.8"/>
    <text x="595" y="378" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Last block subsidy</text>
    <text x="595" y="418" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">~2140</text>
    <text x="595" y="448" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">block 6,930,000</text>
  </g>

  <g filter="url(#soft)">
    <rect x="714" y="340" width="190" height="136" rx="16" fill="#20252D" stroke="#FF6B6B" stroke-width="1.8"/>
    <text x="809" y="378" text-anchor="middle" fill="#FF6B6B" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Divisibility</text>
    <text x="809" y="418" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">8 decimals</text>
    <text x="809" y="448" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">2.1 quadrillion units</text>
  </g>

  <text x="690" y="506" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="15">
    The cap is not arbitrary — it emerges from the block subsidy schedule and halving interval
  </text>
</svg>
