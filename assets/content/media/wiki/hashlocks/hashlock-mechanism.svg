<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hashlock Mechanism</title>
  <desc id="desc">Hashlock flow: a secret preimage is hashed with SHA-256 to produce a hash value. The hash is used as a locking condition. Spending requires revealing the preimage. Used in HTLCs for atomic swaps and Lightning Network.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Hashlock</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Lock funds with a hash, unlock by revealing the preimage</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
    <path d="M76 310H884"/>
  </g>
  <g filter="url(#soft)">
    <rect x="64" y="164" width="200" height="120" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="164" y="196" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Preimage (Secret)</text>
    <text x="164" y="224" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">Random value R</text>
    <rect x="104" y="244" width="120" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="164" y="260" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12">0x4e8d...f1a3</text>
  </g>
  <path d="M264 224L318 224" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="274" y="216" width="46" height="20" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  <text x="297" y="230" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11">SHA-256</text>
  <g filter="url(#soft)">
    <rect x="340" y="164" width="200" height="120" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="440" y="196" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Hash Lock</text>
    <text x="440" y="224" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">H = SHA256(R)</text>
    <rect x="380" y="244" width="120" height="22" rx="6" fill="#14321E" stroke="#22C55E" stroke-width="1"/>
    <text x="440" y="260" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12">0x3a2b...c9d8</text>
  </g>
  <path d="M540 224L596 224" stroke="#7C8794" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <rect x="554" y="216" width="46" height="20" rx="4" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <text x="577" y="230" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">lock</text>
  <g filter="url(#soft)">
    <rect x="616" y="164" width="300" height="120" rx="14" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="766" y="196" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Locked Output</text>
    <text x="766" y="224" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Spendable with H = SHA256(R)</text>
    <text x="766" y="256" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Anyone providing R satisfying H spends</text>
    <text x="766" y="274" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Atomic condition: reveal R to claim funds</text>
  </g>
  <g filter="url(#soft)">
    <rect x="64" y="326" width="856" height="150" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="492" y="356" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">HTLC Script (Hashed TimeLock Contract)</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M80 372H904"/>
    </g>
    <text x="492" y="402" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Two spending paths:</text>
    <text x="492" y="430" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14">Path 1 (success): OP_SHA256 &lt;hash&gt; OP_EQUALVERIFY OP_CHECKSIG</text>
    <text x="492" y="454" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="14">Path 2 (timeout): &lt;locktime&gt; OP_CHECKLOCKTIMEVERIFY OP_DROP OP_CHECKSIG</text>
    <text x="492" y="472" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Hashlocks + timelocks together = atomic, trustless conditional payments</text>
  </g>
</svg>
