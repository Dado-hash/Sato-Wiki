    <text x="656" y="228" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">5.0 BTC capacity</text>
  </g>
  <g filter="url(#soft)">
    <rect x="730" y="278" width="170" height="80" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
