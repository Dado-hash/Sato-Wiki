<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lightning Network overview</title>
  <desc id="desc">Diagram showing the Lightning Network as a second-layer overlay on top of Bitcoin. The Bitcoin blockchain is on the left with three blocks linked by arrows. A separation line with a lightning bolt divides the layers. On the right, three nodes (Alice, Bob, Carol) are connected by payment channels with bidirectional payment arrows.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Lightning Network overview</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">An overlay network for instant, high-volume Bitcoin payments</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 250H884"/>
    <path d="M460 148V490"/>
  </g>
  <text x="250" y="144" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">BITCOIN BASE LAYER</text>
  <text x="710" y="144" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">LIGHTNING NETWORK (LAYER 2)</text>
  <g filter="url(#soft)">
    <rect x="80" y="176" width="180" height="60" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="96" y="190" width="60" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="126" y="206" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">BLOCK</text>
    <text x="178" y="212" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">#800,000</text>
    <text x="170" y="226" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="9">Merkle root • Timestamp • Nonce</text>
  </g>
  <path d="M170 240V266" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <g filter="url(#soft)">
    <rect x="80" y="278" width="180" height="60" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="96" y="292" width="60" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
