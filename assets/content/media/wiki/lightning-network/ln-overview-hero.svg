    <path d="M290 308H432"/>
    <path d="M290 410H432"/>
  </g>
  <text x="338" y="200" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Funding tx</text>
  <text x="338" y="302" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Commitment tx</text>
  <text x="338" y="404" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Closing tx</text>
  <g stroke="#F7931A" stroke-width="1" opacity="0.35" stroke-dasharray="4 6">
    <path d="M328 210H428" marker-end="url(#arrow-orange)"/>
    <path d="M328 312H428" marker-end="url(#arrow-orange)"/>
    <path d="M328 414H428" marker-end="url(#arrow-orange)"/>
  </g>
  <g filter="url(#soft)">
    <rect x="448" y="260" width="24" height="100" rx="12" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="460" y="310" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="24">&#x26A1;</text>
  </g>
  <g filter="url(#soft)">
