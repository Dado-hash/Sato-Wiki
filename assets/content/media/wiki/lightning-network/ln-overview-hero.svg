<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lightning Network overview</title>
  <desc id="desc">Diagram showing the Lightning Network as a second-layer overlay on top of Bitcoin. The Bitcoin blockchain is on the left with three blocks linked by arrows. A separation line with a lightning bolt divides the layers. On the right, three nodes (Alice, Bob, Carol) are connected by payment channels with bidirectional payment arrows.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Lightning Network overview</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">An overlay network for instant, high-volume Bitcoin payments</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 250H884"/>
    <path d="M460 148V490"/>
  </g>
  <text x="250" y="144" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">BITCOIN BASE LAYER</text>
  <text x="710" y="144" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">LIGHTNING NETWORK (LAYER 2)</text>

  <!-- Bitcoin blocks -->
  <g filter="url(#soft)">
    <rect x="80" y="176" width="180" height="60" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="96" y="190" width="60" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="126" y="206" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">BLOCK</text>
    <text x="170" y="206" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">#800,000</text>
    <text x="170" y="226" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="9">Merkle root • Timestamp • Nonce</text>
  </g>
  <path d="M170 240V266" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <g filter="url(#soft)">
    <rect x="80" y="278" width="180" height="60" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="96" y="292" width="60" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="126" y="308" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">BLOCK</text>
    <text x="170" y="308" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">#800,001</text>
    <text x="170" y="328" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="9">Merkle root • Timestamp • Nonce</text>
  </g>
  <path d="M170 342V368" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <g filter="url(#soft)">
    <rect x="80" y="380" width="180" height="60" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="96" y="394" width="60" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="126" y="410" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">BLOCK</text>
    <text x="170" y="410" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">#800,002</text>
    <text x="170" y="430" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="9">Merkle root • Timestamp • Nonce</text>
  </g>

  <!-- Transaction labels and dashed arrows to layer divider -->
  <g stroke="#28313B" stroke-width="1" opacity="0.4">
    <path d="M260 206H448"/>
    <path d="M260 308H448"/>
    <path d="M260 410H448"/>
  </g>
  <text x="354" y="200" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Funding tx</text>
  <text x="354" y="302" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Commitment tx</text>
  <text x="354" y="404" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Closing tx</text>
  <g stroke="#F7931A" stroke-width="1" opacity="0.35" stroke-dasharray="4 6">
    <path d="M260 210H448" marker-end="url(#arrow-orange)"/>
    <path d="M260 312H448" marker-end="url(#arrow-orange)"/>
    <path d="M260 414H448" marker-end="url(#arrow-orange)"/>
  </g>

  <!-- Layer divider bolt -->
  <g filter="url(#soft)">
    <rect x="448" y="210" width="24" height="204" rx="12" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="460" y="320" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="24">&#x26A1;</text>
  </g>

  <!-- Lightning nodes: Bob on the left, Alice and Carol on the right -->
  <g filter="url(#soft)">
    <rect x="520" y="278" width="160" height="76" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <circle cx="654" cy="316" r="18" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="654" y="322" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">B</text>
    <text x="575" y="312" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Bob</text>
    <text x="575" y="332" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">3.0 BTC capacity</text>
  </g>
  <g filter="url(#soft)">
    <rect x="740" y="170" width="160" height="76" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <circle cx="766" cy="208" r="18" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="766" y="214" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">A</text>
    <text x="830" y="204" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Alice</text>
    <text x="830" y="224" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">5.0 BTC capacity</text>
  </g>
  <g filter="url(#soft)">
    <rect x="740" y="386" width="160" height="76" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <circle cx="766" cy="424" r="18" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="766" y="430" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">C</text>
    <text x="830" y="420" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Carol</text>
    <text x="830" y="440" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">2.0 BTC capacity</text>
  </g>

  <!-- Payment channel arrows (Bob center-left, Alice top-right, Carol bottom-right) -->
  <!-- Bob -> Alice (orange dashed, upper arc) -->
  <path d="M654 316C700 316 720 250 766 208" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)" fill="none" stroke-dasharray="6 4"/>
  <!-- Alice -> Bob (green, lower arc) -->
  <path d="M766 208C720 208 700 280 654 316" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)" fill="none"/>
  <!-- Carol -> Bob (green, upper arc) -->
  <path d="M766 424C720 424 700 350 654 316" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)" fill="none"/>
  <!-- Bob -> Carol (orange dashed, lower arc) -->
  <path d="M654 316C700 316 720 390 766 424" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)" fill="none" stroke-dasharray="6 4"/>

  <!-- Payment amount labels -->
  <rect x="682" y="250" width="50" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  <text x="707" y="266" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">0.3 BTC</text>
  <rect x="682" y="360" width="50" height="22" rx="6" fill="#14321E" stroke="#22C55E" stroke-width="1"/>
  <text x="707" y="376" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">0.2 BTC</text>

  <!-- Base layer caption -->
  <text x="170" y="486" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">Every block is validated by all full nodes.</text>
  <text x="170" y="504" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">~10 min block interval ~ 7 tx/s throughput</text>

  <!-- Lightning layer caption -->
  <text x="710" y="486" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">Only channel open &amp; close are recorded on-chain.</text>
  <text x="710" y="504" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">Intermediate payments happen off-chain between nodes.</text>
</svg>
