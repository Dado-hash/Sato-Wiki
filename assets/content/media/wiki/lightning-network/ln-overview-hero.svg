    <circle cx="568" cy="210" r="20" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="568" y="216" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">A</text>
