    <text x="758" y="324" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">B</text>
    <text x="846" y="315" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Bob</text>
    <text x="846" y="336" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">3.0 BTC capacity</text>
  </g>
  <g filter="url(#soft)">
    <rect x="540" y="386" width="170" height="80" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <circle cx="568" cy="426" r="20" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="568" y="432" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">C</text>
    <text x="656" y="423" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Carol</text>
    <text x="656" y="444" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">2.0 BTC capacity</text>
  </g>
  <path d="M710 230C730 244 740 263 745 278" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)" fill="none"/>
  <path d="M745 286C740 300 730 316 710 326" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)" fill="none" stroke-dasharray="6 4"/>
  <path d="M710 370C730 356 740 340 745 326" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)" fill="none"/>
  <path d="M745 318C740 304 730 288 710 278" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)" fill="none" stroke-dasharray="6 4"/>
  <rect x="692" y="248" width="50" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  <text x="717" y="264" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">0.3 BTC</text>
  <rect x="692" y="348" width="50" height="22" rx="6" fill="#14321E" stroke="#22C55E" stroke-width="1"/>
  <text x="717" y="364" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">0.2 BTC</text>
  <text x="625" y="512" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">Only channel open &amp; close are recorded on-chain.</text>
  <text x="625" y="530" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">Intermediate payments happen off-chain between nodes.</text>
  <text x="170" y="490" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">Every block is validated by all full nodes.</text>
  <text x="170" y="508" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">~10 min block interval ~ 7 tx/s throughput</text>
</svg>
