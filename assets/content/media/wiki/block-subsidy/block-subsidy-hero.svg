<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Block Subsidy</title>
  <desc id="desc">Visual breakdown of a block's coinbase transaction: the block subsidy (newly minted bitcoin) plus transaction fees collected by the miner, showing how value enters circulation.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Block Subsidy</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">The newly created bitcoin that enters circulation with each block.</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 152H884"/><path d="M76 440H884"/><path d="M480 150V490"/>
  </g>
  <!-- Left: Block anatomy -->
  <g filter="url(#soft)">
    <rect x="64" y="170" width="380" height="262" rx="20" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="254" y="206" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Coinbase Transaction</text>
    <rect x="90" y="228" width="328" height="1" fill="#343A44"/>
    <rect x="90" y="250" width="328" height="48" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1.5"/>
    <text x="254" y="280" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Block Subsidy (3.125 BTC as of 2024)</text>
    <text x="254" y="316" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">+</text>
    <rect x="90" y="332" width="328" height="48" rx="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
    <text x="254" y="362" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Transaction Fees (~variable)</text>
    <rect x="90" y="398" width="328" height="1" fill="#343A44"/>
    <text x="254" y="420" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15">Total coinbase output = subsidy + fees</text>
  </g>
  <!-- Right: Explanation -->
  <g filter="url(#soft)">
    <rect x="480" y="170" width="416" height="262" rx="20" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="688" y="206" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">How It Works</text>
    <rect x="506" y="228" width="364" height="1" fill="#343A44"/>
    <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#F4EAD8">
      <text x="520" y="260">The coinbase is the first</text>
      <text x="520" y="282">transaction in every block.</text>
      <text x="520" y="314">It has no inputs — it creates</text>
      <text x="520" y="336">bitcoin from nothing (within</text>
      <text x="520" y="358">protocol limits).</text>
      <text x="520" y="390" fill="#22C55E">The subsidy halves every</text>
      <text x="520" y="412" fill="#22C55E">210,000 blocks (~4 years).</text>
    </g>
  </g>
  <text x="480" y="500" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14">
    The coinbase output is the only way new bitcoin enter circulation. After 100 blocks maturity it can be spent.
  </text>
</svg>
