<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin Address Derivation</title>
  <desc id="desc">Pipeline from private key to public key to address: private key k, elliptic curve multiplication K = k*G, then SHA-256, RIPEMD-160, network byte prefix, Base58Check or Bech32 encoding to produce the final address.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Bitcoin Address</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">From private key to spendable destination</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
    <path d="M76 270H884"/>
    <path d="M76 390H884"/>
  </g>
  <g filter="url(#soft)">
    <rect x="52" y="166" width="156" height="70" rx="12" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="130" y="195" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Private Key</text>
    <text x="130" y="218" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">k</text>
  </g>
  <path d="M208 201L258 201" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="234" y="195" width="36" height="18" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  <text x="252" y="208" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="10">k × G</text>
  <g filter="url(#soft)">
    <rect x="278" y="166" width="170" height="70" rx="12" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="363" y="195" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Public Key</text>
    <text x="363" y="218" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">02 / 03 || x-coord</text>
  </g>
  <path d="M448 201L494 201" stroke="#7C8794" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <rect x="464" y="195" width="36" height="18" rx="4" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <text x="482" y="208" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">SHA-256</text>
  <g filter="url(#soft)">
    <rect x="510" y="166" width="170" height="70" rx="12" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="595" y="195" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Hash160</text>
    <text x="595" y="218" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">RIPEMD160(SHA256(K))</text>
  </g>
  <path d="M680 201L726 201" stroke="#7C8794" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <rect x="696" y="195" width="36" height="18" rx="4" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <text x="714" y="208" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">encode</text>
  <g filter="url(#soft)">
    <rect x="748" y="164" width="172" height="74" rx="12" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="834" y="193" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Address</text>
    <text x="834" y="218" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">1A1zP1... or bc1q...</text>
  </g>
  <g filter="url(#soft)">
    <rect x="52" y="286" width="856" height="86" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="480" y="316" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Address Types</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M68 332H892"/>
    </g>
    <text x="130" y="358" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Legacy (P2PKH)</text>
    <text x="310" y="358" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">SegWit (P2SH)</text>
    <text x="490" y="358" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Native SegWit (P2WPKH)</text>
    <text x="670" y="358" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Taproot (P2TR)</text>
    <text x="834" y="358" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Base58</text>
  </g>
  <g filter="url(#soft)">
    <rect x="52" y="404" width="856" height="82" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="480" y="434" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Example: Pay to Public Key Hash (P2PKH)</text>
    <text x="480" y="460" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="14">OP_DUP OP_HASH160 &lt;pubKeyHash&gt; OP_EQUALVERIFY OP_CHECKSIG</text>
    <text x="480" y="478" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Base58Check (prefix 0x00) → address starting with "1"</text>
  </g>
</svg>
