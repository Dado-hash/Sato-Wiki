<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Decentralized peer-to-peer network</title>
  <desc id="desc">A mesh of Bitcoin nodes connected without a central server, showing block and transaction relay across the network.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Decentralized mesh</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Nodes connect directly — no central server, permissionless relay.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 176H884"/>
    <path d="M76 300H884"/>
    <path d="M76 424H884"/>
  </g>

  <!-- Mesh connections -->
  <g stroke="#46505C" stroke-width="2" opacity="0.4">
    <line x1="215" y1="302" x2="330" y2="238"/>
    <line x1="215" y1="302" x2="255" y2="422"/>
    <line x1="215" y1="302" x2="530" y2="228"/>
    <line x1="330" y1="238" x2="530" y2="228"/>
    <line x1="330" y1="238" x2="280" y2="136"/>
    <line x1="330" y1="238" x2="580" y2="364"/>
    <line x1="530" y1="228" x2="620" y2="134"/>
    <line x1="530" y1="228" x2="580" y2="364"/>
    <line x1="530" y1="228" x2="720" y2="174"/>
    <line x1="255" y1="422" x2="580" y2="364"/>
    <line x1="255" y1="422" x2="400" y2="450"/>
    <line x1="400" y1="450" x2="580" y2="364"/>
    <line x1="400" y1="450" x2="690" y2="420"/>
    <line x1="580" y1="364" x2="690" y2="420"/>
    <line x1="580" y1="364" x2="830" y2="314"/>
    <line x1="690" y1="420" x2="830" y2="314"/>
    <line x1="720" y1="174" x2="830" y2="314"/>
    <line x1="620" y1="134" x2="720" y2="174"/>
    <line x1="280" y1="136" x2="620" y2="134"/>
  </g>

  <!-- Relay path highlight -->
  <g stroke="#F7931A" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M215 302H330" marker-end="url(#arrow-orange)"/>
    <path d="M330 238H530" marker-end="url(#arrow-orange)"/>
    <path d="M530 228H720" marker-end="url(#arrow-orange)"/>
    <path d="M720 174L830 314" marker-end="url(#arrow-orange)"/>
  </g>

  <g stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M215 302L255 422" marker-end="url(#arrow-green)"/>
    <path d="M255 422L400 450" marker-end="url(#arrow-green)"/>
    <path d="M580 364L690 420" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Node groups -->
  <g filter="url(#soft)">
    <circle cx="215" cy="302" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="215" y="308" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N1</text>

    <circle cx="330" cy="238" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="330" y="244" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N2</text>

    <circle cx="530" cy="228" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="530" y="234" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N3</text>

    <circle cx="255" cy="422" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="255" y="428" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N4</text>

    <circle cx="400" cy="450" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="400" y="456" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N5</text>

    <circle cx="580" cy="364" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="580" y="370" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N6</text>

    <circle cx="690" cy="420" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="690" y="426" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N7</text>

    <circle cx="830" cy="314" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="830" y="320" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N8</text>

    <circle cx="620" cy="134" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="620" y="140" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N9</text>

    <circle cx="280" cy="136" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="280" y="142" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N10</text>

    <circle cx="720" cy="174" r="28" fill="#20252D" stroke="#46505C" stroke-width="2.5"/>
    <text x="720" y="180" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">N11</text>
  </g>

  <!-- Annotations -->
  <g filter="url(#soft)">
    <rect x="60" y="310" width="120" height="72" rx="14" fill="#1D1F12" stroke="#F7931A" stroke-width="1.5"/>
    <text x="120" y="338" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Block relay</text>
    <text x="120" y="364" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">mesh propagation</text>

    <rect x="756" y="354" width="150" height="72" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
    <text x="831" y="382" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Tx relay</text>
    <text x="831" y="408" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">gossip flooding</text>
  </g>
</svg>
