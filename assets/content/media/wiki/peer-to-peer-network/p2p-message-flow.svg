<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Peer connection handshake and message flow</title>
  <desc id="desc">Sequence diagram showing version/verack handshake, inventory announcement, data request, and block or transaction relay between two nodes.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Connection handshake</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Version and verack establish a connection, then inventory and data messages follow.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 170H884"/>
    <path d="M76 290H884"/>
    <path d="M76 410H884"/>
  </g>

  <!-- Node boxes -->
  <g filter="url(#soft)">
    <rect x="70" y="146" width="180" height="52" rx="16" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="160" y="174" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Initiator</text>
    <text x="160" y="192" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">Node A</text>

    <rect x="690" y="146" width="180" height="52" rx="16" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="780" y="174" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Listener</text>
    <text x="780" y="192" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">Node B</text>
  </g>

  <!-- Version A -> B -->
  <path d="M250 180H680" stroke="#F7931A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <g filter="url(#soft)">
    <rect x="340" y="166" width="200" height="28" rx="14" fill="#1D1F12" stroke="#F7931A" stroke-width="1.5"/>
    <text x="440" y="185" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">version</text>
  </g>

  <!-- Version B -> A -->
  <path d="M690 240H260" stroke="#F7931A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <g filter="url(#soft)">
    <rect x="400" y="226" width="200" height="28" rx="14" fill="#1D1F12" stroke="#F7931A" stroke-width="1.5"/>
    <text x="500" y="245" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">version</text>
  </g>

  <!-- Verack B -> A -->
  <path d="M690 278H260" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <g filter="url(#soft)">
    <rect x="430" y="264" width="140" height="28" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
    <text x="500" y="283" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">verack</text>
  </g>

  <!-- Verack A -> B -->
  <path d="M250 300H680" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <g filter="url(#soft)">
    <rect x="430" y="286" width="140" height="28" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
    <text x="500" y="305" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">verack</text>
  </g>

  <!-- Connected label -->
  <rect x="410" y="320" width="180" height="28" rx="14" fill="#203327" stroke="#22C55E" stroke-width="1.5" opacity="0.6"/>
  <text x="500" y="339" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Connected</text>

  <!-- Headers/inv B -> A -->
  <path d="M690 370H260" stroke="#7C8794" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <g filter="url(#soft)">
    <rect x="410" y="356" width="180" height="28" rx="14" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="500" y="375" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">inv / headers</text>
  </g>

  <!-- Getdata A -> B -->
  <path d="M250 410H680" stroke="#F7931A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <g filter="url(#soft)">
    <rect x="430" y="396" width="140" height="28" rx="14" fill="#1D1F12" stroke="#F7931A" stroke-width="1.5"/>
    <text x="500" y="415" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">getdata</text>
  </g>

  <!-- Tx/block B -> A -->
  <path d="M690 460H260" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <g filter="url(#soft)">
    <rect x="420" y="446" width="160" height="28" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
    <text x="500" y="465" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">tx / block</text>
  </g>

  <!-- Legend -->
  <g filter="url(#soft)">
    <rect x="70" y="470" width="130" height="28" rx="14" fill="#1D1F12" stroke="#F7931A" stroke-width="1.2"/>
    <text x="135" y="489" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Requests</text>

    <rect x="215" y="470" width="130" height="28" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="1.2"/>
    <text x="280" y="489" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Data / ack</text>

    <rect x="360" y="470" width="130" height="28" rx="14" fill="#20252D" stroke="#46505C" stroke-width="1.2"/>
    <text x="425" y="489" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Announcement</text>
  </g>
</svg>
