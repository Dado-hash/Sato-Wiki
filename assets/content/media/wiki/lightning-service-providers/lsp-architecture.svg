<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lightning Service Provider (LSP) Architecture</title>
  <desc id="desc">A mobile wallet at the bottom holds one channel to an LSP node in the centre. The LSP node holds many channels to the wider Lightning Network at the top, so payments to and from the wallet pass through it.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter" font-size="34" font-weight="700">Lightning Service Provider (LSP)</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter" font-size="18">One channel to an always-on hub reaches the whole network.</text>

  <!-- Lightning Network -->
  <rect x="76" y="140" width="808" height="120" rx="14" fill="#1A1F26" stroke="#28313B" stroke-width="1.5"/>
  <text x="96" y="164" fill="#7C8794" font-family="JetBrains Mono" font-size="12" font-weight="700">LIGHTNING NETWORK</text>
  <line x1="140" y1="214" x2="230" y2="186" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
  <line x1="230" y1="186" x2="320" y2="222" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
  <line x1="320" y1="222" x2="410" y2="190" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
  <line x1="410" y1="190" x2="480" y2="228" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
  <line x1="480" y1="228" x2="550" y2="190" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
  <line x1="550" y1="190" x2="640" y2="222" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
  <line x1="640" y1="222" x2="730" y2="186" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>
  <line x1="730" y1="186" x2="820" y2="214" stroke="#22C55E" stroke-width="1.5" opacity="0.5"/>

  <!-- Channels from the LSP node to the network -->
  <line x1="480" y1="300" x2="320" y2="222" stroke="#22C55E" stroke-width="2" opacity="0.8"/>
  <line x1="480" y1="300" x2="480" y2="228" stroke="#22C55E" stroke-width="2" opacity="0.8"/>
  <line x1="480" y1="300" x2="640" y2="222" stroke="#22C55E" stroke-width="2" opacity="0.8"/>

  <circle cx="140" cy="214" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="230" cy="186" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="320" cy="222" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="410" cy="190" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="480" cy="228" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="550" cy="190" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="640" cy="222" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="730" cy="186" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>
  <circle cx="820" cy="214" r="10" fill="#203327" stroke="#22C55E" stroke-width="1.5"/>

  <!-- LSP node -->
  <rect x="320" y="300" width="320" height="84" rx="16" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <circle cx="368" cy="342" r="24" fill="#2A2116" stroke="#F7931A" stroke-width="2.5"/>
  <text x="368" y="347" text-anchor="middle" fill="#F7931A" font-family="Inter" font-size="14" font-weight="700">LSP</text>
  <text x="408" y="336" fill="#F4EAD8" font-family="Inter" font-size="18" font-weight="600">LSP node</text>
  <text x="408" y="360" fill="#B7B1A8" font-family="Inter" font-size="14">Always on, many channels</text>

  <!-- Callouts -->
  <rect x="76" y="312" width="212" height="60" rx="10" fill="#1A1F26" stroke="#7C5CFF" stroke-width="1.5"/>
  <text x="92" y="337" fill="#7C5CFF" font-family="Inter" font-size="13" font-weight="600">Provides inbound liquidity</text>
  <text x="92" y="357" fill="#7C5CFF" font-family="Inter" font-size="13" font-weight="600">and routing</text>
  <rect x="672" y="312" width="212" height="60" rx="10" fill="#1A1F26" stroke="#343A44" stroke-width="1.5"/>
  <text x="688" y="337" fill="#B7B1A8" font-family="Inter" font-size="13" font-weight="600">Forwards payments</text>
  <text x="688" y="357" fill="#B7B1A8" font-family="Inter" font-size="13" font-weight="600">in both directions</text>

  <!-- Channel between the wallet and the LSP node -->
  <line x1="450" y1="418" x2="450" y2="388" stroke="#F7931A" stroke-width="3" stroke-linecap="round"/>
  <path d="M443 396L450 387L457 396" stroke="#F7931A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="434" y="407" text-anchor="end" fill="#F7931A" font-family="Inter" font-size="13">send</text>
  <line x1="510" y1="386" x2="510" y2="416" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
  <path d="M503 408L510 417L517 408" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="526" y="407" fill="#22C55E" font-family="Inter" font-size="13">receive</text>

  <!-- Mobile wallet -->
  <rect x="320" y="420" width="320" height="76" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <rect x="356" y="436" width="24" height="44" rx="5" fill="#343A44" stroke="#46505C" stroke-width="1.5"/>
  <circle cx="368" cy="472" r="3" fill="#7C8794"/>
  <text x="408" y="452" fill="#F4EAD8" font-family="Inter" font-size="18" font-weight="600">Mobile wallet</text>
  <text x="408" y="476" fill="#B7B1A8" font-family="Inter" font-size="14">One channel, often offline</text>
</svg>
