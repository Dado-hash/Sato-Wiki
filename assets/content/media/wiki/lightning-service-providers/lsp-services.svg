<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LSP Services Comparison</title>
  <desc id="desc">Three column comparison of LSP services. Column 1: Inbound Liquidity with arrows pointing into the user node. Column 2: Routing as a Service showing the LSP forwarding payments. Column 3: Channel Management including splicing, watchtower, and backups.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C5CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">LSP Services</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">LSPs offer inbound liquidity, reliable routing, and channel management services</text>

  <!-- Section separator -->
  <line x1="76" y1="140" x2="884" y2="140" stroke="#28313B" stroke-width="1" opacity="0.55"/>

  <!-- ===== COLUMN 1: Inbound Liquidity ===== -->
  <g filter="url(#soft)">
    <rect x="48" y="160" width="280" height="330" rx="16" fill="#1A1F26" stroke="#343A44" stroke-width="1"/>
  </g>
  <rect x="48" y="160" width="280" height="4" rx="2" fill="#22C55E"/>
  <text x="188" y="196" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Inbound Liquidity</text>

  <!-- Column 1 price tag -->
  <g filter="url(#soft)">
    <rect x="80" y="212" width="216" height="28" rx="8" fill="#203327" stroke="#22C55E" stroke-width="1"/>
  </g>
  <text x="188" y="232" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Channel Lease &bull; Premium</text>

  <!-- Column 1 user node -->
  <circle cx="188" cy="290" r="24" fill="#203327" stroke="#22C55E" stroke-width="2.5"/>
  <text x="188" y="296" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">U</text>
  <text x="188" y="330" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">User Node</text>

  <!-- Inbound arrows pointing to user -->
  <path d="M108 280L158 280" stroke="#22C55E" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M108 290L158 290" stroke="#22C55E" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M108 300L158 300" stroke="#22C55E" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="88" y="268" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="9">Inbound liquidity flow</text>

  <!-- Column 1 feature list -->
  <text x="76" y="370" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Includes</text>
  <circle cx="80" cy="392" r="3" fill="#22C55E"/>
  <text x="92" y="396" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Dedicated channel from LSP</text>
  <circle cx="80" cy="414" r="3" fill="#22C55E"/>
  <text x="92" y="418" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Immediate receive capability</text>
  <circle cx="80" cy="436" r="3" fill="#22C55E"/>
  <text x="92" y="440" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Just-in-Time channel opening</text>
  <circle cx="80" cy="458" r="3" fill="#22C55E"/>
  <text x="92" y="462" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">No need for inbound swaps</text>

  <!-- ===== COLUMN 2: Routing as a Service ===== -->
  <g filter="url(#soft)">
    <rect x="340" y="160" width="280" height="330" rx="16" fill="#1A1F26" stroke="#343A44" stroke-width="1"/>
  </g>
  <rect x="340" y="160" width="280" height="4" rx="2" fill="#F7931A"/>
  <text x="480" y="196" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Routing as a Service</text>

  <!-- Column 2 price tag -->
  <g filter="url(#soft)">
    <rect x="372" y="212" width="216" height="28" rx="8" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  </g>
  <text x="480" y="232" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Per-Payment Fee &bull; Free/Premium</text>

  <!-- Column 2 routing diagram -->
  <circle cx="410" cy="290" r="16" fill="#203327" stroke="#22C55E" stroke-width="2"/>
  <text x="410" y="295" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">U</text>
  <circle cx="480" cy="290" r="20" fill="#2A2116" stroke="#F7931A" stroke-width="2.5"/>
  <text x="480" y="296" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">LSP</text>
  <circle cx="560" cy="290" r="16" fill="#203327" stroke="#22C55E" stroke-width="2"/>
  <text x="560" y="295" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">R</text>

  <!-- Routing arrows -->
  <path d="M426 290L454 290" stroke="#F7931A" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M500 290L538 290" stroke="#F7931A" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="426" y="278" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="9">pay</text>
  <text x="506" y="278" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="9">forward</text>
  <text x="410" y="270" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="9">User</text>
  <text x="480" y="270" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="9">LSP</text>
  <text x="560" y="270" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="9">Recipient</text>

  <!-- Column 2 feature list -->
  <text x="368" y="370" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Includes</text>
  <circle cx="372" cy="392" r="3" fill="#F7931A"/>
  <text x="384" y="396" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Payment forwarding</text>
  <circle cx="372" cy="414" r="3" fill="#F7931A"/>
  <text x="384" y="418" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Multi-hop path finding</text>
  <circle cx="372" cy="436" r="3" fill="#F7931A"/>
  <text x="384" y="440" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">High reliability uptime</text>
  <circle cx="372" cy="458" r="3" fill="#F7931A"/>
  <text x="384" y="462" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Competitive routing fees</text>

  <!-- ===== COLUMN 3: Channel Management ===== -->
  <g filter="url(#soft)">
    <rect x="632" y="160" width="280" height="330" rx="16" fill="#1A1F26" stroke="#343A44" stroke-width="1"/>
  </g>
  <rect x="632" y="160" width="280" height="4" rx="2" fill="#7C5CFF"/>
  <text x="772" y="196" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Management</text>

  <!-- Column 3 price tag -->
  <g filter="url(#soft)">
    <rect x="664" y="212" width="216" height="28" rx="8" fill="#24203B" stroke="#7C5CFF" stroke-width="1"/>
  </g>
  <text x="772" y="232" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Flat Fee &bull; Free/Premium</text>

  <!-- Column 3 management icons -->
  <!-- Splicing icon -->
  <rect x="668" y="264" width="208" height="38" rx="8" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <path d="M680 276L712 276Q718 276 718 282L718 290Q718 296 712 296L680 296Q674 296 674 290L674 282Q674 276 680 276Z" fill="none" stroke="#7C5CFF" stroke-width="1.5"/>
  <text x="718" y="282" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="11">+</text>
  <text x="728" y="290" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="13">Splicing</text>
  <text x="828" y="290" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="10">Dynamic channel resize</text>

  <!-- Watchtower icon -->
  <rect x="668" y="310" width="208" height="38" rx="8" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <rect x="680" y="320" width="16" height="14" rx="2" fill="none" stroke="#7C5CFF" stroke-width="1.5"/>
  <circle cx="688" cy="327" r="3" fill="#7C5CFF"/>
  <text x="704" y="334" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="13">Watchtower</text>
  <text x="828" y="334" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="10">Fraud monitoring</text>

  <!-- Backups icon -->
  <rect x="668" y="356" width="208" height="38" rx="8" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <path d="M680 370L684 366L692 370L698 366L706 370" stroke="#7C5CFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="714" y="380" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="13">Channel Backups</text>
  <text x="828" y="380" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="10">Static channel backup</text>

  <!-- Zero-conf icon -->
  <rect x="668" y="402" width="208" height="38" rx="8" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <circle cx="688" cy="421" r="8" fill="none" stroke="#7C5CFF" stroke-width="1.5"/>
  <path d="M685 421L690 425L696 416" stroke="#7C5CFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="704" y="426" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="13">Zero-Conf Channels</text>
  <text x="828" y="426" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="10">Instant channel usage</text>

  <!-- Column 3 feature list -->
  <text x="660" y="462" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Typically bundled with other LSP services</text>

  <text x="480" y="518" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">LSPs may charge per-service or offer bundled plans combining inbound liquidity, routing, and management.</text>
</svg>
