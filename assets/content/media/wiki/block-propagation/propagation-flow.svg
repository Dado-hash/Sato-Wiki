<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Compact block relay message flow</title>
  <desc id="desc">Sequence diagram of compact block relay between two Bitcoin nodes: sender announces via inv, receiver requests with getheaders, sender replies with headers; then compact block is sent with short IDs, mempool reconstruction happens, and if transactions are missing the receiver requests them via getblocktxn and gets a blocktxn reply.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-violet" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C5CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Compact block relay</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">BIP-152 message sequence between sender and receiver.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 166H884"/>
    <path d="M76 280H884"/>
    <path d="M76 394H884"/>
    <path d="M250 150V470"/>
    <path d="M710 150V470"/>
  </g>

  <g filter="url(#soft)">
    <rect x="82" y="134" width="168" height="52" rx="16" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="166" y="164" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Sender</text>

    <rect x="560" y="134" width="150" height="52" rx="16" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="635" y="164" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Receiver</text>
  </g>

  <g stroke="stroke">
    <path d="M250 230L560 230" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <text x="405" y="220" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">inv (block_hash)</text>

    <path d="M560 270L250 270" stroke="#22C55E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <text x="405" y="260" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">getheaders</text>

    <path d="M250 310L560 310" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <text x="405" y="300" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">headers</text>
  </g>

  <text x="405" y="346" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">── header validation ──</text>
  <text x="405" y="364" text-anchor="middle" fill="#46505C" font-family="Inter, Arial, sans-serif" font-size="12">proof of work + parent link</text>

  <g>
    <path d="M250 402L560 402" stroke="#22C55E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <text x="405" y="392" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">getdata (compact)</text>
  </g>

  <g>
    <path d="M250 440L560 440" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#arrow-violet)"/>
    <text x="405" y="432" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">cmpctblock (short IDs + header)</text>
  </g>

  <g filter="url(#soft)">
    <rect x="558" y="458" width="220" height="34" rx="12" fill="#1E2A1F" stroke="#22C55E" stroke-width="1.5"/>
    <text x="668" y="479" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">mempool reconstruction</text>
  </g>

  <g stroke="#7C8794" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8">
    <path d="M790 240H862V312H562" stroke="#7C5CFF"/>
  </g>
  <text x="856" y="266" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">getblocktxn</text>
  <text x="856" y="286" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">(if missing)</text>

  <path d="M250 466L170 466" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
  <text x="210" y="458" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">blocktxn</text>

  <rect x="76" y="482" width="168" height="26" rx="10" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
  <text x="160" y="499" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">validate + relay</text>
</svg>
