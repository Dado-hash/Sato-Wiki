<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Compact block relay message flow</title>
  <desc id="desc">Clean sequence diagram of normal-mode compact block relay. The sender announces a block, the receiver requests and validates headers, requests a compact block, reconstructs it from its mempool, and only if transactions are missing asks for them with getblocktxn before receiving blocktxn.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-violet" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C5CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="496" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Compact block relay</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Normal-mode BIP-152 flow: announce, request compact data, repair only missing transactions.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 168H884"/>
    <path d="M76 326H884"/>
    <path d="M76 452H884"/>
  </g>

  <g filter="url(#soft)">
    <rect x="112" y="136" width="188" height="52" rx="16" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="206" y="166" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Sender</text>

    <rect x="660" y="136" width="188" height="52" rx="16" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="754" y="166" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Receiver</text>
  </g>

  <g stroke="#343A44" stroke-width="1.4" stroke-dasharray="6 8" opacity="0.8">
    <path d="M206 188V508"/>
    <path d="M754 188V508"/>
  </g>

  <g>
    <circle cx="206" cy="214" r="14" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="206" y="219" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">1</text>
    <path d="M236 214H734" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <text x="480" y="204" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">inv(block_hash)</text>

    <circle cx="206" cy="252" r="14" fill="#16261B" stroke="#22C55E" stroke-width="1.4"/>
    <text x="206" y="257" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">2</text>
    <path d="M734 252H236" stroke="#22C55E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <text x="480" y="242" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">getheaders</text>

    <circle cx="206" cy="290" r="14" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="206" y="295" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">3</text>
    <path d="M236 290H734" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <text x="480" y="280" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">headers</text>
  </g>

  <g filter="url(#soft)">
    <rect x="612" y="310" width="248" height="46" rx="12" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <text x="736" y="329" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Receiver validates header</text>
    <text x="736" y="346" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">proof of work + parent link</text>
  </g>

  <g>
    <circle cx="206" cy="378" r="14" fill="#16261B" stroke="#22C55E" stroke-width="1.4"/>
    <text x="206" y="383" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">4</text>
    <path d="M734 378H236" stroke="#22C55E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <text x="480" y="368" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">getdata(MSG_CMPCT_BLOCK)</text>

    <circle cx="206" cy="416" r="14" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="206" y="421" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">5</text>
    <path d="M236 416H734" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <text x="480" y="406" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">cmpctblock(header + short IDs)</text>
  </g>

  <g filter="url(#soft)">
    <rect x="612" y="430" width="248" height="38" rx="12" fill="#1E2A1F" stroke="#22C55E" stroke-width="1.5"/>
    <text x="736" y="454" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">reconstruct -> validate + relay</text>
  </g>

  <g>
    <rect x="126" y="442" width="158" height="22" rx="11" fill="#211D31" stroke="#7C5CFF" stroke-width="1" opacity="0.92"/>
    <text x="205" y="457" text-anchor="middle" fill="#B8A9FF" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">if missing</text>

    <circle cx="206" cy="490" r="14" fill="#211D31" stroke="#7C5CFF" stroke-width="1.4"/>
    <text x="206" y="495" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">6</text>
    <path d="M734 490H236" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow-violet)"/>
    <text x="480" y="482" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">getblocktxn(indexes)</text>

    <path d="M236 514H734" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow-violet)"/>
    <text x="480" y="506" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">blocktxn(missing txs)</text>
  </g>
</svg>
