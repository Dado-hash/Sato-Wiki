<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin Game Theory</title>
  <desc id="desc">Three interconnected nodes showing the game-theoretic equilibrium between miners, full nodes, and users. Each group has aligned incentives that make honest behavior the dominant strategy.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Game Theory</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Rational self-interest aligns to secure the network without central coordination.</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 154H884"/><path d="M76 440H884"/>
  </g>
  <!-- Triangle of agents -->
  <!-- Miners (top) -->
  <g filter="url(#soft)">
    <rect x="340" y="170" width="280" height="80" rx="16" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
    <text x="480" y="199" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Miners</text>
    <text x="480" y="225" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Compete for subsidy + fees</text>
    <text x="480" y="241" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Logic: honest mining maximizes profit</text>
  </g>
  <!-- Nodes (left) -->
  <g filter="url(#soft)">
    <rect x="100" y="310" width="280" height="80" rx="16" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="240" y="339" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Full Nodes</text>
    <text x="240" y="365" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Validate and enforce rules</text>
    <text x="240" y="381" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Logic: reject invalid blocks</text>
  </g>
  <!-- Users (right) -->
  <g filter="url(#soft)">
    <rect x="580" y="310" width="280" height="80" rx="16" fill="#201A2E" stroke="#7C5CFF" stroke-width="2"/>
    <text x="720" y="339" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Users</text>
    <text x="720" y="365" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Choose which chain has value</text>
    <text x="720" y="381" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">Logic: reject worthless forks</text>
  </g>
  <!-- Connections -->
  <g stroke="#7C8794" stroke-width="2" fill="none" opacity="0.6">
    <path d="M380 250 L280 300" marker-end="url(#arrow)"/>
    <path d="M580 250 L680 300" marker-end="url(#arrow)"/>
    <path d="M380 340 L570 340" marker-end="url(#arrow)"/>
  </g>
  <!-- Equilibrium label -->
  <g filter="url(#soft)">
    <rect x="240" y="448" width="480" height="50" rx="14" fill="#171B21" stroke="#343A44" stroke-width="1.5"/>
    <text x="480" y="470" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Nash Equilibrium</text>
    <text x="480" y="490" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">No participant benefits from unilateral deviation from honest behavior</text>
  </g>
</svg>
