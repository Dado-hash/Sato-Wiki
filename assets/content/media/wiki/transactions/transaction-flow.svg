<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin transaction flow</title>
  <desc id="desc">Previous outputs feed a transaction, which creates recipient and change outputs while leaving a fee.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Spend inputs, create outputs</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">A transaction consumes previous coins and defines new spending conditions.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 160H884"/>
    <path d="M76 290H884"/>
    <path d="M76 420H884"/>
    <path d="M214 150V442"/>
    <path d="M480 150V442"/>
    <path d="M746 150V442"/>
  </g>

  <g filter="url(#soft)">
    <rect x="78" y="184" width="190" height="84" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="173" y="216" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">UTXO A</text>
    <text x="173" y="246" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="15">60,000 sats</text>

    <rect x="78" y="304" width="190" height="84" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="173" y="336" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">UTXO B</text>
    <text x="173" y="366" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="15">40,000 sats</text>
  </g>

  <path d="M282 226C330 226 342 264 388 264" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M282 346C330 346 342 306 388 306" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="390" y="196" width="192" height="176" rx="18" fill="#20252D" stroke="#F7931A" stroke-width="2.4"/>
    <text x="486" y="236" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Transaction</text>
    <rect x="426" y="262" width="120" height="32" rx="16" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="486" y="284" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">sign inputs</text>
    <g stroke="#B7B1A8" stroke-linecap="round" opacity="0.78">
      <path d="M430 322H542" stroke-width="3"/>
      <path d="M452 344H520" stroke-width="3"/>
    </g>
  </g>

  <path d="M596 248C650 222 660 214 704 214" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M596 300C650 328 660 336 704 336" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M486 384V430H708" stroke="#7C8794" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrow-muted)"/>

  <g filter="url(#soft)">
    <rect x="708" y="172" width="178" height="84" rx="14" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="797" y="204" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Recipient</text>
    <text x="797" y="234" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="15">70,000 sats</text>

    <rect x="708" y="294" width="178" height="84" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="797" y="326" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Change</text>
    <text x="797" y="356" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="15">28,500 sats</text>

    <rect x="708" y="412" width="178" height="50" rx="25" fill="#241E31" stroke="#7C5CFF" stroke-width="1.7"/>
    <text x="797" y="443" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">fee 1,500 sats</text>
  </g>
</svg>
