<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Store of Value Comparison</title>
  <desc id="desc">Comparison of store of value properties across Bitcoin, Gold, Fiat, and Real Estate across six dimensions: scarcity, durability, portability, divisibility, verifiability, and history of monetary premium.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Store of Value</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">An asset that preserves purchasing power over time — compared across key dimensions.</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 154H884"/>
  </g>
  <!-- Comparison table -->
  <g filter="url(#soft)">
    <rect x="64" y="172" width="832" height="310" rx="14" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <!-- Header -->
    <rect x="64" y="172" width="832" height="40" rx="14" fill="#171B21"/>
    <rect x="64" y="196" width="832" height="16" fill="#171B21"/>
    <text x="160" y="198" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Property</text>
    <text x="330" y="198" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Bitcoin</text>
    <text x="480" y="198" text-anchor="middle" fill="#FFD700" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Gold</text>
    <text x="630" y="198" text-anchor="middle" fill="#FF6B6B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Fiat</text>
    <text x="780" y="198" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Real Estate</text>
    <line x1="70" y1="214" x2="890" y2="214" stroke="#343A44" stroke-width="1"/>
    <!-- Row 1: Scarcity -->
    <text x="80" y="240" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Scarcity</text>
    <rect x="266" y="230" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="230" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="230" width="108" height="16" rx="8" fill="#2A281A"/>
    <rect x="416" y="230" width="76" height="16" rx="8" fill="#FFD700"/>
    <rect x="566" y="230" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="566" y="230" width="11" height="16" rx="8" fill="#FF6B6B"/>
    <rect x="716" y="230" width="108" height="16" rx="8" fill="#24202E"/>
    <rect x="716" y="230" width="65" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="260" x2="890" y2="260" stroke="#28313B" stroke-width="1"/>
    <!-- Row 2: Durability -->
    <text x="80" y="284" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Durability</text>
    <rect x="266" y="274" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="274" width="97" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="274" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="416" y="274" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="566" y="274" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="566" y="274" width="32" height="16" rx="8" fill="#F7931A"/>
    <rect x="716" y="274" width="108" height="16" rx="8" fill="#24202E"/>
    <rect x="716" y="274" width="86" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="304" x2="890" y2="304" stroke="#28313B" stroke-width="1"/>
    <!-- Row 3: Portability -->
    <text x="80" y="328" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Portability</text>
    <rect x="266" y="318" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="318" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="318" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="416" y="318" width="22" height="16" rx="8" fill="#FF6B6B"/>
    <rect x="566" y="318" width="108" height="16" rx="8" fill="#2A281A"/>
    <rect x="566" y="318" width="97" height="16" rx="8" fill="#F7931A"/>
    <rect x="716" y="318" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="716" y="318" width="11" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="348" x2="890" y2="348" stroke="#28313B" stroke-width="1"/>
    <!-- Row 4: Divisibility -->
    <text x="80" y="372" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Divisibility</text>
    <rect x="266" y="362" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="362" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="362" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="416" y="362" width="11" height="16" rx="8" fill="#FFD700"/>
    <rect x="566" y="362" width="108" height="16" rx="8" fill="#2A281A"/>
    <rect x="566" y="362" width="97" height="16" rx="8" fill="#F7931A"/>
    <rect x="716" y="362" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="716" y="362" width="22" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="392" x2="890" y2="392" stroke="#28313B" stroke-width="1"/>
    <!-- Row 5: Verifiability -->
    <text x="80" y="416" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Verifiability</text>
    <rect x="266" y="406" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="406" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="406" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="416" y="406" width="43" height="16" rx="8" fill="#F7931A"/>
    <rect x="566" y="406" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="566" y="406" width="54" height="16" rx="8" fill="#FF6B6B"/>
    <rect x="716" y="406" width="108" height="16" rx="8" fill="#24202E"/>
    <rect x="716" y="406" width="65" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="436" x2="890" y2="436" stroke="#28313B" stroke-width="1"/>
    <!-- Row 6: History -->
    <text x="80" y="460" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">History of Monetary Premium</text>
    <rect x="266" y="450" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="266" y="450" width="22" height="16" rx="8" fill="#F7931A"/>
    <rect x="416" y="450" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="416" y="450" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="566" y="450" width="108" height="16" rx="8" fill="#2A281A"/>
    <rect x="566" y="450" width="76" height="16" rx="8" fill="#FFD700"/>
    <rect x="716" y="450" width="108" height="16" rx="8" fill="#24202E"/>
    <rect x="716" y="450" width="86" height="16" rx="8" fill="#7C5CFF"/>
  </g>
</svg>
