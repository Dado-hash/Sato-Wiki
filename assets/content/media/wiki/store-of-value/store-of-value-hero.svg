<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Store of Value Comparison</title>
  <desc id="desc">Comparison of store of value properties across Bitcoin, Gold, Fiat, and Real Estate across six dimensions: scarcity, durability, portability, divisibility, verifiability, and history of monetary premium.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Store of Value</text>
  <text x="480" y="82" text-anchor="end" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">6 Properties &middot; 4 Assets</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">An asset that preserves purchasing power over time — compared across key dimensions.</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 154H884"/><path d="M76 480H884"/>
  </g>
  <!-- Legend row -->
  <rect x="540" y="168" width="14" height="14" rx="3" fill="#F7931A"/>
  <text x="560" y="180" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Bitcoin</text>
  <rect x="630" y="168" width="14" height="14" rx="3" fill="#FFD700"/>
  <text x="650" y="180" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Gold</text>
  <rect x="710" y="168" width="14" height="14" rx="3" fill="#FF6B6B"/>
  <text x="730" y="180" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Fiat</text>
  <rect x="788" y="168" width="14" height="14" rx="3" fill="#7C5CFF"/>
  <text x="808" y="180" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Real Estate</text>
  <!-- Comparison table -->
  <g filter="url(#soft)">
    <rect x="64" y="196" width="832" height="280" rx="14" fill="#20252D" stroke="#46505C" stroke-width="1.5"/>
    <!-- Header -->
    <rect x="64" y="196" width="832" height="40" rx="14" fill="#171B21"/>
    <rect x="64" y="220" width="832" height="16" fill="#171B21"/>
    <text x="160" y="222" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Property</text>
    <text x="330" y="222" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Score</text>
    <text x="480" y="222" text-anchor="middle" fill="#FFD700" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Score</text>
    <text x="630" y="222" text-anchor="middle" fill="#FF6B6B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Score</text>
    <text x="780" y="222" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Score</text>
    <line x1="70" y1="238" x2="890" y2="238" stroke="#343A44" stroke-width="1"/>
    <!-- Row 1: Scarcity -->
    <text x="80" y="264" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Scarcity</text>
    <rect x="266" y="254" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="254" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="254" width="108" height="16" rx="8" fill="#2A281A"/>
    <rect x="416" y="254" width="76" height="16" rx="8" fill="#FFD700"/>
    <rect x="566" y="254" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="566" y="254" width="11" height="16" rx="8" fill="#FF6B6B"/>
    <rect x="716" y="254" width="108" height="16" rx="8" fill="#24202E"/>
    <rect x="716" y="254" width="65" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="284" x2="890" y2="284" stroke="#28313B" stroke-width="1"/>
    <!-- Row 2: Durability -->
    <text x="80" y="308" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Durability</text>
    <rect x="266" y="298" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="298" width="97" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="298" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="416" y="298" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="566" y="298" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="566" y="298" width="32" height="16" rx="8" fill="#F7931A"/>
    <rect x="716" y="298" width="108" height="16" rx="8" fill="#24202E"/>
    <rect x="716" y="298" width="86" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="328" x2="890" y2="328" stroke="#28313B" stroke-width="1"/>
    <!-- Row 3: Portability -->
    <text x="80" y="352" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Portability</text>
    <rect x="266" y="342" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="342" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="342" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="416" y="342" width="22" height="16" rx="8" fill="#FF6B6B"/>
    <rect x="566" y="342" width="108" height="16" rx="8" fill="#2A281A"/>
    <rect x="566" y="342" width="97" height="16" rx="8" fill="#F7931A"/>
    <rect x="716" y="342" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="716" y="342" width="11" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="372" x2="890" y2="372" stroke="#28313B" stroke-width="1"/>
    <!-- Row 4: Divisibility -->
    <text x="80" y="396" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Divisibility</text>
    <rect x="266" y="386" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="386" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="386" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="416" y="386" width="11" height="16" rx="8" fill="#FFD700"/>
    <rect x="566" y="386" width="108" height="16" rx="8" fill="#2A281A"/>
    <rect x="566" y="386" width="97" height="16" rx="8" fill="#F7931A"/>
    <rect x="716" y="386" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="716" y="386" width="22" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="416" x2="890" y2="416" stroke="#28313B" stroke-width="1"/>
    <!-- Row 5: Verifiability -->
    <text x="80" y="440" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Verifiability</text>
    <rect x="266" y="430" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="266" y="430" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="416" y="430" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="416" y="430" width="43" height="16" rx="8" fill="#F7931A"/>
    <rect x="566" y="430" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="566" y="430" width="54" height="16" rx="8" fill="#FF6B6B"/>
    <rect x="716" y="430" width="108" height="16" rx="8" fill="#24202E"/>
    <rect x="716" y="430" width="65" height="16" rx="8" fill="#7C5CFF"/>
    <line x1="70" y1="460" x2="890" y2="460" stroke="#28313B" stroke-width="1"/>
    <!-- Row 6: History -->
    <text x="80" y="484" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">History of Monetary Premium</text>
    <rect x="266" y="474" width="108" height="16" rx="8" fill="#2E2020"/>
    <rect x="266" y="474" width="22" height="16" rx="8" fill="#F7931A"/>
    <rect x="416" y="474" width="108" height="16" rx="8" fill="#1E3024"/>
    <rect x="416" y="474" width="108" height="16" rx="8" fill="#22C55E"/>
    <rect x="566" y="474" width="108" height="16" rx="8" fill="#2A281A"/>
    <rect x="566" y="474" width="76" height="16" rx="8" fill="#FFD700"/>
    <rect x="716" y="474" width="108" height="16" rx="8" fill="#24202E"/>
    <rect x="716" y="474" width="86" height="16" rx="8" fill="#7C5CFF"/>
  </g>
</svg>
