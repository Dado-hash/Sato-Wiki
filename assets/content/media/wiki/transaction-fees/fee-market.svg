  <text x="776" y="232" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Mined block</text>
  <text x="776" y="254" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Coinbase = subsidy + fees</text>

