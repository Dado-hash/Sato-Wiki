<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Locking and unlocking scripts</title>
  <desc id="desc">The unlocking script (scriptSig or witness) satisfies conditions set by the locking script (scriptPubKey).</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Locking and unlocking scripts</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Every UTXO carries a scriptPubKey; the spender proves they can satisfy it.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 156H884"/>
    <path d="M76 310H884"/>
    <path d="M76 440H884"/>
    <path d="M346 150V460"/>
    <path d="M636 150V460"/>
  </g>

  <g filter="url(#soft)">
    <rect x="86" y="186" width="240" height="104" rx="16" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="206" y="218" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Unlocking Script</text>
    <text x="206" y="244" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14">scriptSig / Witness</text>
    <rect x="116" y="260" width="180" height="24" rx="12" fill="#171B21" stroke="#22C55E" stroke-width="1" opacity="0.6"/>
    <text x="206" y="277" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13">&lt;sig&gt; &lt;pubKey&gt;</text>

    <rect x="86" y="320" width="240" height="104" rx="16" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
    <text x="206" y="352" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Locking Script</text>
    <text x="206" y="378" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14">scriptPubKey</text>
    <rect x="100" y="394" width="212" height="24" rx="12" fill="#171B21" stroke="#F7931A" stroke-width="1" opacity="0.6"/>
    <text x="206" y="411" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12">OP_DUP OP_HASH160 &lt;hash&gt; OP_EQUALVERIFY OP_CHECKSIG</text>
  </g>

  <g filter="url(#soft)">
    <rect x="370" y="226" width="224" height="60" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="482" y="256" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Combined execution</text>
    <text x="482" y="276" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">unlock + lock run together</text>
  </g>

  <path d="M340 238H358" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M340 372H358" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <line x1="482" y1="300" x2="482" y2="356" stroke="#7C8794" stroke-width="3" stroke-dasharray="6 8"/>

  <text x="482" y="316" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14">validates</text>

  <path d="M608 256H648" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="666" y="176" width="202" height="52" rx="14" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="767" y="200" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Stack starts empty</text>
    <text x="767" y="218" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">[ ]</text>

    <rect x="666" y="248" width="202" height="52" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="767" y="272" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Script runs</text>
    <text x="767" y="290" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12">opcode by opcode</text>

    <rect x="666" y="320" width="202" height="52" rx="14" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="767" y="344" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Stack ends with</text>
    <text x="767" y="362" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">TRUE</text>
  </g>

  <path d="M767 422V452" stroke="#7C8794" stroke-width="2" stroke-linecap="round"/>
  <rect x="710" y="452" width="114" height="36" rx="18" fill="#241E31" stroke="#7C5CFF" stroke-width="1.6"/>
  <text x="767" y="475" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">spend confirmed</text>
</svg>
