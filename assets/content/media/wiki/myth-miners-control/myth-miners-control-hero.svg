<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Miners fill blocks, nodes check them</title>
  <desc id="desc">A miner selects transactions into a block, and a node accepts it only if it follows the rules.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(15 24)">

  <!-- Miner's pool of transactions -->
  <text x="230" y="144" text-anchor="middle" fill="#B7B1A8" font-family="Inter" font-size="18">miner</text>
  <rect x="140" y="160" width="180" height="32" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <rect x="160" y="172" width="120" height="8" rx="3" fill="#8E96A4"/>
  <rect x="140" y="204" width="180" height="32" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="160" y="216" width="120" height="8" rx="3" fill="#343A44"/>
  <rect x="140" y="248" width="180" height="32" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <rect x="160" y="260" width="120" height="8" rx="3" fill="#8E96A4"/>
  <rect x="140" y="292" width="180" height="32" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="160" y="304" width="120" height="8" rx="3" fill="#343A44"/>
  <rect x="140" y="336" width="180" height="32" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <rect x="160" y="348" width="120" height="8" rx="3" fill="#8E96A4"/>

  <!-- Selected transactions go into the block -->
  <path d="M332 264H398" stroke="#F7931A" stroke-width="3"/>
  <polygon points="398,256 410,264 398,272" fill="#F7931A"/>
  <rect x="410" y="200" width="160" height="128" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="490" y="270" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">block</text>

  <!-- Block is passed to a node that checks it -->
  <path d="M570 264H646" stroke="#B7B1A8" stroke-width="3"/>
  <polygon points="646,256 658,264 646,272" fill="#B7B1A8"/>
  <circle cx="728" cy="264" r="62" fill="#20252D" stroke="#22C55E" stroke-width="3"/>
  <text x="728" y="271" text-anchor="middle" fill="#22C55E" font-family="Inter" font-size="20" font-weight="700">node</text>
</g>
</svg>
