<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Two estimates of illicit share</title>
  <desc id="desc">Two bars for a 2017 estimate of illegal bitcoin activity, by transaction count and by dollar value, against a 50 percent line.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 -6)">

  <rect x="120" y="100" width="720" height="360" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="152" y="134" fill="#8E96A4" font-family="Inter" font-size="16">2017</text>

  <!-- Majority line -->
  <path d="M200 270H760" stroke="#B7B1A8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="772" y="276" fill="#B7B1A8" font-family="Inter" font-size="16">50%</text>

  <!-- Bars -->
  <rect x="300" y="282" width="140" height="138" rx="8" fill="#8B5CF6"/>
  <rect x="520" y="351" width="140" height="69" rx="8" fill="#8B5CF6"/>
  <text x="370" y="318" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">46%</text>
  <text x="590" y="392" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">23%</text>

  <path d="M200 420H760" stroke="#8E96A4" stroke-width="2"/>
  <text x="370" y="452" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="20">#</text>
  <text x="590" y="452" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="20">$</text>
</g>
</svg>
