<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Schnorr Signatures — signing, verification, and aggregation</title>
  <desc id="desc">Schnorr signature scheme showing individual signing and verification formulas, plus the linearity property that enables signature aggregation.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Schnorr Signatures</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Linear signatures that enable aggregation, batch verification, and privacy.</text>

  <!-- BIP 340 tag -->
  <rect x="780" y="56" width="116" height="28" rx="14" fill="#1D1B15" stroke="#F7931A" stroke-width="1.5"/>
  <text x="838" y="75" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">BIP 340</text>

  <!-- ===== LEFT — Signing ===== -->

  <rect x="76" y="154" width="128" height="34" rx="17" fill="#2A2116" stroke="#F7931A" stroke-width="1.8"/>
  <text x="140" y="176" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Signing</text>

  <g filter="url(#soft)">
    <rect x="64" y="206" width="400" height="194" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>

    <text x="86" y="236" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// nonce commitment</tspan>
    </text>
    <text x="86" y="260" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="18">
      <tspan fill="#F7931A">R</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#F7931A">k</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">G</tspan>
    </text>

    <text x="86" y="291" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// challenge hash</tspan>
    </text>
    <text x="86" y="315" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="18">
      <tspan fill="#22C55E">e</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#7C8794">H(</tspan>
      <tspan fill="#F7931A">R</tspan>
      <tspan fill="#B7B1A8"> || </tspan>
      <tspan fill="#22C55E">Q</tspan>
      <tspan fill="#B7B1A8"> || </tspan>
      <tspan fill="#56626F">m</tspan>
      <tspan fill="#7C8794">)</tspan>
    </text>

    <text x="86" y="348" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// signature scalar</tspan>
    </text>
    <text x="86" y="374" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600">
      <tspan fill="#F7931A">s</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#F7931A">k</tspan>
      <tspan fill="#B7B1A8"> + </tspan>
      <tspan fill="#22C55E">e</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#F7931A">d</tspan>
    </text>

    <text x="86" y="392" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">(R, s) — 64 bytes</text>
  </g>

  <!-- Arrow: sign → verify -->
  <path d="M264 402V434" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <!-- ===== RIGHT — Verification ===== -->

  <rect x="596" y="154" width="152" height="34" rx="17" fill="#0A1F16" stroke="#22C55E" stroke-width="1.8"/>
  <text x="672" y="176" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Verification</text>

  <g filter="url(#soft)">
    <rect x="490" y="206" width="406" height="176" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>

    <text x="512" y="236" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// compute same challenge</tspan>
    </text>
    <text x="512" y="262" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="18">
      <tspan fill="#22C55E">e</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#7C8794">H(</tspan>
      <tspan fill="#F7931A">R</tspan>
      <tspan fill="#B7B1A8"> || </tspan>
      <tspan fill="#22C55E">Q</tspan>
      <tspan fill="#B7B1A8"> || </tspan>
      <tspan fill="#56626F">m</tspan>
      <tspan fill="#7C8794">)</tspan>
    </text>

    <text x="512" y="295" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">
      <tspan fill="#7C8794">// check equation holds</tspan>
    </text>
    <text x="512" y="330" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="20" font-weight="600">
      <tspan fill="#F7931A">s</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">G</tspan>
      <tspan fill="#B7B1A8"> = </tspan>
      <tspan fill="#F7931A">R</tspan>
      <tspan fill="#B7B1A8"> + </tspan>
      <tspan fill="#22C55E">e</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#7C8794">·</tspan>
      <tspan fill="#B7B1A8"> </tspan>
      <tspan fill="#22C55E">Q</tspan>
    </text>

    <!-- Result indicator -->
    <rect x="552" y="352" width="282" height="22" rx="11" fill="#0A1F16"/>
    <text x="693" y="368" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">s·G = R + e·Q  →  valid</text>
  </g>

  <!-- ===== BOTTOM — Aggregation ===== -->

  <!-- Horizontal divider -->
  <line x1="64" y1="420" x2="896" y2="420" stroke="#28313B" stroke-width="1.5" opacity="0.5"/>

  <rect x="346" y="432" width="268" height="34" rx="17" fill="#1D1B15" stroke="#22C55E" stroke-width="1.8"/>
  <text x="480" y="454" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Aggregation (Linearity)</text>

  <g filter="url(#soft)">
    <rect x="100" y="478" width="760" height="28" rx="8" fill="#111418"/>
    <text x="480" y="498" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">
      <tspan fill="#F7931A">(R₁, s₁)</tspan>
      <tspan fill="#B7B1A8"> + </tspan>
      <tspan fill="#F7931A">(R₂, s₂)</tspan>
      <tspan fill="#B7B1A8"> → </tspan>
      <tspan fill="#22C55E">(R₁+R₂, s₁+s₂)</tspan>
      <tspan fill="#B7B1A8"> — one aggregated signature</tspan>
    </text>
  </g>

</svg>
