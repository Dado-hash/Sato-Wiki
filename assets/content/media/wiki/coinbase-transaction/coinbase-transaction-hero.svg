<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Coinbase transaction</title>
  <desc id="desc">The first transaction of a block has a null input and pays the block reward to its miner.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 -6)">

  <!-- Block with the coinbase as its first transaction -->
  <rect x="110" y="130" width="300" height="300" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <text x="130" y="168" fill="#B7B1A8" font-family="Inter" font-size="18" font-weight="700">block</text>

  <rect x="134" y="190" width="252" height="60" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="160" y="226" fill="#F7931A" font-family="Inter" font-size="18" font-weight="700">coinbase</text>

  <rect x="134" y="270" width="252" height="60" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="160" y="306" fill="#8E96A4" font-family="Inter" font-size="18">tx</text>

  <rect x="134" y="350" width="252" height="60" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="160" y="386" fill="#8E96A4" font-family="Inter" font-size="18">tx</text>

  <!-- Arrow from the coinbase to its input and outputs -->
  <path d="M390 220 H452" stroke="#F7931A" stroke-width="3" stroke-linecap="round"/>
  <polygon points="452,212 466,220 452,228" fill="#F7931A"/>

  <rect x="470" y="130" width="380" height="300" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>

  <text x="494" y="172" fill="#B7B1A8" font-family="Inter" font-size="18" font-weight="700">input</text>
  <rect x="494" y="190" width="332" height="70" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="514" y="232" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">null outpoint</text>

  <text x="494" y="300" fill="#B7B1A8" font-family="Inter" font-size="18" font-weight="700">output</text>
  <rect x="494" y="318" width="332" height="70" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="514" y="360" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">≤ subsidy + fees</text>
</g>
</svg>
