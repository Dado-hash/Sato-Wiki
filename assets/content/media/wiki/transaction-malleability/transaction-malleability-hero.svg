<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Transaction malleability before and after SegWit</title>
  <desc id="desc">Before SegWit a changed signature gives a different txid, while after SegWit the txid stays the same when only the witness changes.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 -6)">

  <rect x="100" y="130" width="340" height="300" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <rect x="520" y="130" width="340" height="300" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>

  <text x="124" y="172" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">legacy</text>
  <text x="544" y="172" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">segwit</text>

  <rect x="124" y="200" width="200" height="40" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <rect x="324" y="200" width="92" height="40" fill="#20252D" stroke="#B7B1A8" stroke-width="2"/>
  <text x="124" y="262" fill="#B7B1A8" font-family="JetBrains Mono" font-size="16">txid</text>

  <rect x="124" y="320" width="200" height="40" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <rect x="324" y="320" width="92" height="40" fill="#2A1618" stroke="#EF4444" stroke-width="2"/>
  <text x="124" y="392" fill="#B7B1A8" font-family="JetBrains Mono" font-size="16">txid'</text>

  <rect x="544" y="200" width="200" height="40" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
  <rect x="744" y="200" width="92" height="40" fill="#1C2128" stroke="#B7B1A8" stroke-width="2"/>
  <text x="544" y="262" fill="#B7B1A8" font-family="JetBrains Mono" font-size="16">txid</text>

  <rect x="544" y="320" width="200" height="40" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
  <rect x="744" y="320" width="92" height="40" fill="#2A1618" stroke="#EF4444" stroke-width="2"/>
  <text x="544" y="392" fill="#B7B1A8" font-family="JetBrains Mono" font-size="16">txid</text>
</g>
</svg>
