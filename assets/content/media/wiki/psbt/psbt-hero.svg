<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Partially signed transaction flow</title>
  <desc id="desc">An unsigned PSBT goes to three signers, whose signatures merge into one finished transaction.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 14)">

  <!-- Unsigned PSBT -->
  <rect x="96" y="200" width="180" height="120" rx="8" fill="#20252D" stroke="#B7B1A8" stroke-width="2"/>
  <text x="186" y="240" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="20">PSBT</text>
  <rect x="118" y="258" width="136" height="8" rx="4" fill="#343A44"/>
  <rect x="118" y="278" width="108" height="8" rx="4" fill="#343A44"/>
  <rect x="118" y="298" width="136" height="8" rx="4" fill="#343A44"/>

  <!-- Fan out to three signers -->
  <path d="M276 260 H350" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M350 172 V348" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M350 172 H430" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M350 260 H430" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M350 348 H430" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="430,166 438,172 430,178" fill="#B7B1A8"/>
  <polygon points="430,254 438,260 430,266" fill="#B7B1A8"/>
  <polygon points="430,342 438,348 430,354" fill="#B7B1A8"/>

  <rect x="440" y="140" width="160" height="64" rx="8" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
  <text x="520" y="178" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">key A</text>
  <rect x="440" y="228" width="160" height="64" rx="8" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
  <text x="520" y="266" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">key B</text>
  <rect x="440" y="316" width="160" height="64" rx="8" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
  <text x="520" y="354" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">key C</text>

  <!-- Merge back into one transaction -->
  <path d="M600 172 H630" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 260 H630" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 348 H630" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M630 172 V348" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M630 260 H690" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="690,254 698,260 690,266" fill="#B7B1A8"/>

  <rect x="700" y="200" width="160" height="120" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="780" y="268" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono" font-size="24">tx</text>
</g>
</svg>
