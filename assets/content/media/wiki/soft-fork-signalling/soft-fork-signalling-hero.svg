<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Soft fork activation states</title>
  <desc id="desc">A deployment moves through defined states to activation, while a row of version-bit signals shows miner readiness against a 95 percent threshold.</desc>
