<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Channel Liquidity Allocation</title>
  <desc id="desc">Diagram showing two payment channels with balance allocation. Left: Alice 0.7 BTC and Bob 0.3 BTC split of 1 BTC capacity. Right: Bob 0.1 BTC and Carol 0.4 BTC split of 0.5 BTC capacity. Callout explains outbound liquidity is your balance and inbound liquidity is the counterparty's balance.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Channel Liquidity Allocation</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Each channel has a fixed capacity split between the two parties. Outbound and inbound liquidity are mirror images.</text>

  <!-- LEFT CHANNEL: Alice ↔ Bob (1 BTC) -->
  <!-- Alice node -->
  <g filter="url(#soft)">
    <rect x="80" y="155" width="165" height="76" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <circle cx="110" cy="193" r="18" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="110" y="199" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">A</text>
    <text x="190" y="190" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Alice</text>
    <text x="190" y="211" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Balance: 0.7 BTC</text>
  </g>

  <!-- Bob node -->
  <g filter="url(#soft)">
    <rect x="315" y="155" width="165" height="76" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <circle cx="345" cy="193" r="18" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
    <text x="345" y="199" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">B</text>
    <text x="425" y="190" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Bob</text>
    <text x="425" y="211" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Balance: 0.3 BTC</text>
  </g>

  <!-- Connection arrows -->
  <path d="M245 193L278 193" stroke="#22C55E" stroke-width="3"/>
  <path d="M278 193L308 193" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="256" y="173" width="44" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  <text x="278" y="189" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">1 BTC</text>

  <!-- Balance bar -->
  <rect x="80" y="260" width="400" height="44" rx="10" fill="#1A1F26" stroke="#343A44" stroke-width="1"/>
  <rect x="82" y="262" width="276" height="40" fill="#203327"/>
  <rect x="358" y="262" width="120" height="40" fill="#2A2116"/>
  <line x1="358" y1="262" x2="358" y2="302" stroke="#343A44" stroke-width="2"/>

  <!-- Bar labels -->
  <text x="220" y="288" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">0.7 BTC</text>
  <text x="418" y="288" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">0.3 BTC</text>

  <!-- Direction indicators -->
  <text x="220" y="326" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Alice can send 0.7 BTC</text>
  <text x="418" y="326" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Bob can send 0.3 BTC</text>
  <text x="220" y="341" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="10">Outbound</text>
  <text x="418" y="341" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="10">Outbound</text>

  <!-- Vertical divider -->
  <path d="M480 155V355" stroke="#28313B" stroke-width="1" opacity="0.55" stroke-dasharray="6 4"/>

  <!-- RIGHT CHANNEL: Bob ↔ Carol (0.5 BTC) -->
  <!-- Bob node -->
  <g filter="url(#soft)">
    <rect x="500" y="155" width="165" height="76" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <circle cx="530" cy="193" r="18" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
    <text x="530" y="199" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">B</text>
    <text x="610" y="190" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Bob</text>
    <text x="610" y="211" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Balance: 0.1 BTC</text>
  </g>

  <!-- Carol node -->
  <g filter="url(#soft)">
    <rect x="735" y="155" width="165" height="76" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <circle cx="765" cy="193" r="18" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="765" y="199" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">C</text>
    <text x="845" y="190" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Carol</text>
    <text x="845" y="211" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Balance: 0.4 BTC</text>
  </g>

  <!-- Connection arrows -->
  <path d="M665 193L698 193" stroke="#F7931A" stroke-width="3"/>
  <path d="M698 193L728 193" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="676" y="173" width="44" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  <text x="698" y="189" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">0.5 BTC</text>

  <!-- Balance bar -->
  <rect x="500" y="260" width="400" height="44" rx="10" fill="#1A1F26" stroke="#343A44" stroke-width="1"/>
  <rect x="502" y="262" width="78" height="40" fill="#2A2116"/>
  <rect x="580" y="262" width="318" height="40" fill="#203327"/>
  <line x1="580" y1="262" x2="580" y2="302" stroke="#343A44" stroke-width="2"/>

  <!-- Bar labels -->
  <text x="541" y="288" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">0.1 BTC</text>
  <text x="739" y="288" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">0.4 BTC</text>

  <!-- Direction indicators -->
  <text x="541" y="326" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Bob can send 0.1 BTC</text>
  <text x="739" y="326" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Carol can send 0.4 BTC</text>
  <text x="541" y="341" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="10">Outbound</text>
  <text x="739" y="341" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="10">Outbound</text>

  <!-- Callout -->
  <g filter="url(#soft)">
    <rect x="80" y="380" width="800" height="90" rx="14" fill="#241E31" stroke="#7C5CFF" stroke-width="2"/>
    <text x="480" y="414" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">OUTBOUND vs INBOUND LIQUIDITY</text>
    <text x="300" y="445" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15">Outbound liquidity = your balance on a channel</text>
    <text x="480" y="445" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="15">|</text>
    <text x="660" y="445" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15">Inbound liquidity = counterparty's balance</text>
  </g>
</svg>
