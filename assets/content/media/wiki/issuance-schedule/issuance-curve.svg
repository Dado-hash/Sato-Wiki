<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin Issuance Schedule</title>
  <desc id="desc">A chart showing the Bitcoin issuance curve over time: block subsidy decreases by half every four years, approaching the 21 million cap asymptotically around 2140.</desc>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Issuance Schedule</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Block subsidies step down every 210,000 blocks, approaching zero asymptotically.</text>

  <!-- Chart area -->
  <g transform="translate(100, 150)">
    <!-- Grid -->
    <g stroke="#28313B" stroke-width="1" opacity="0.55">
      <line x1="0" y1="0" x2="0" y2="240"/>
      <line x1="0" y1="240" x2="760" y2="240"/>
      <line x1="0" y1="0" x2="760" y2="0"/>
      <line x1="0" y1="60" x2="760" y2="60"/>
      <line x1="0" y1="120" x2="760" y2="120"/>
      <line x1="0" y1="180" x2="760" y2="180"/>
    </g>

    <!-- Y-axis labels -->
    <text x="-10" y="245" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">0</text>
    <text x="-10" y="185" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">12.5</text>
    <text x="-10" y="125" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">25</text>
    <text x="-10" y="65" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">50</text>
    <text x="380" y="-10" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">BTC per block</text>

    <!-- X-axis labels -->
    <text x="0" y="268" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">2009</text>
    <text x="190" y="268" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">2017</text>
    <text x="380" y="268" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">2024</text>
    <text x="570" y="268" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">2032</text>
    <text x="760" y="268" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">2140</text>

    <!-- Step curve: supply per block -->
    <g filter="url(#soft)">
      <rect x="0" y="0" width="42" height="240" rx="4" fill="#F7931A" opacity="0.85"/>
      <rect x="48" y="120" width="42" height="120" rx="4" fill="#F7931A" opacity="0.8"/>
      <rect x="96" y="180" width="42" height="60" rx="4" fill="#F7931A" opacity="0.75"/>
      <rect x="144" y="210" width="42" height="30" rx="4" fill="#F7931A" opacity="0.7"/>
      <rect x="192" y="225" width="42" height="15" rx="4" fill="#F7931A" opacity="0.65"/>
      <rect x="240" y="232" width="42" height="8" rx="4" fill="#F7931A" opacity="0.6"/>
      <rect x="288" y="236" width="42" height="4" rx="4" fill="#F7931A" opacity="0.55"/>
      <rect x="336" y="238" width="42" height="2" rx="4" fill="#F7931A" opacity="0.5"/>
    </g>

    <!-- Cumulative supply curve -->
    <path d="M0 240 C100 220, 200 180, 300 120 C400 60, 500 30, 600 15 C650 8, 700 4, 760 0" stroke="#22C55E" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Cumulative label -->
    <text x="720" y="13" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12">cumulative supply</text>
  </g>

  <!-- Bottom note -->
  <g filter="url(#soft)">
    <rect x="64" y="440" width="832" height="34" rx="12" fill="#171B21" stroke="#343A44" stroke-width="1.5"/>
    <text x="480" y="462" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="15">
      The last satoshi will be mined around the year 2140. After that, miners earn only transaction fees.
    </text>
  </g>
</svg>
