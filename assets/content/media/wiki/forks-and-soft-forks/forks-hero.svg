<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Blockchain fork types</title>
  <desc id="desc">A blockchain splits at a common block into a backward-compatible soft fork branch and a non-backward-compatible hard fork branch.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C5CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Blockchain forks</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">A rule change can split the chain. Soft forks stay compatible; hard forks do not.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 176H884"/>
    <path d="M76 300H884"/>
    <path d="M76 424H884"/>
    <path d="M170 150V448"/>
    <path d="M456 150V448"/>
    <path d="M742 150V448"/>
  </g>

  <g stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M216 244H248" stroke="#F7931A"/>
    <path d="M346 244H378" stroke="#F7931A"/>
    <path d="M428 288V312" stroke="#22C55E" marker-end="url(#arrow-green)"/>
    <path d="M428 288V404" stroke="#F7931A" marker-end="url(#arrow-orange)"/>
    <path d="M476 336H558" stroke="#22C55E" marker-end="url(#arrow-green)"/>
    <path d="M476 444H558" stroke="#7C5CFF" marker-end="url(#arrow-violet)"/>
  </g>

  <g filter="url(#soft)" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="200" width="96" height="88" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="168" y="236" fill="#F4EAD8" font-size="18" font-weight="700">B0</text>
    <text x="168" y="264" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">genesis</text>

    <rect x="250" y="200" width="96" height="88" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="298" y="236" fill="#F4EAD8" font-size="18" font-weight="700">B1</text>
    <text x="298" y="264" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">prev</text>

    <rect x="380" y="200" width="96" height="88" rx="14" fill="#20252D" stroke="#F7931A" stroke-width="3"/>
    <text x="428" y="236" fill="#F4EAD8" font-size="18" font-weight="700">B2</text>
    <text x="428" y="264" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13">fork point</text>

    <rect x="380" y="312" width="96" height="80" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="2"/>
    <text x="428" y="348" fill="#F4EAD8" font-size="18" font-weight="700">B3</text>
    <text x="428" y="372" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13">soft</text>

    <rect x="560" y="312" width="96" height="80" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="2"/>
    <text x="608" y="348" fill="#F4EAD8" font-size="18" font-weight="700">B4</text>
    <text x="608" y="372" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="13">soft</text>

    <rect x="380" y="404" width="96" height="80" rx="14" fill="#2A2331" stroke="#7C5CFF" stroke-width="2"/>
    <text x="428" y="440" fill="#F4EAD8" font-size="18" font-weight="700">B3'</text>
    <text x="428" y="464" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">hard</text>

    <rect x="560" y="404" width="96" height="80" rx="14" fill="#2A2331" stroke="#7C5CFF" stroke-width="2"/>
    <text x="608" y="440" fill="#F4EAD8" font-size="18" font-weight="700">B4'</text>
    <text x="608" y="464" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13">hard</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="680" y="308" width="140" height="88" rx="14" fill="#14251A" stroke="#22C55E" stroke-width="2"/>
    <text x="750" y="340" text-anchor="middle" fill="#22C55E" font-size="18" font-weight="700">Backward</text>
    <text x="750" y="366" text-anchor="middle" fill="#22C55E" font-size="18" font-weight="700">compatible</text>

    <rect x="680" y="410" width="140" height="88" rx="14" fill="#241E31" stroke="#7C5CFF" stroke-width="2"/>
    <text x="750" y="442" text-anchor="middle" fill="#B7B1A8" font-size="18" font-weight="700">Not backward</text>
    <text x="750" y="468" text-anchor="middle" fill="#B7B1A8" font-size="18" font-weight="700">compatible</text>
  </g>
</svg>
