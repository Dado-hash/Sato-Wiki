<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Network Effects</title>
  <desc id="desc">The Bitcoin flywheel — a self-reinforcing cycle of adoption and value.</desc>
  
  <defs>
    <!-- Arrowhead markers for perfectly tracking arcs -->
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#F7931A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Soft shadow for the boxes -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Backgrounds -->
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <!-- Titles -->
  <text x="76" y="78" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Network Effects</text>
  <text x="76" y="108" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">The Bitcoin flywheel — a self-reinforcing cycle of adoption and value.</text>

  <!-- Faint dashed background ring -->
  <circle cx="480" cy="305" r="155" fill="none" stroke="#28313B" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- PERFECT CIRCULAR ARROWS (R=155) -->
  <!-- 0 to 1: Users to Miners (Target Orange) -->
  <path d="M 533.0 159.3 A 155 155 0 0 1 579.7 186.3" fill="none" stroke="#F7931A" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  
  <!-- 1 to 2: Miners to Security (Target Purple) -->
  <path d="M 632.7 278.0 A 155 155 0 0 1 632.7 332.0" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  
  <!-- 2 to 3: Security to Value (Target Green) -->
  <path d="M 579.7 423.7 A 155 155 0 0 1 533.0 450.7" fill="none" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  
  <!-- 3 to 4: Value to Developers (Target Orange) -->
  <path d="M 427.0 450.7 A 155 155 0 0 1 380.3 423.7" fill="none" stroke="#F7931A" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  
  <!-- 4 to 5: Developers to Applications (Target Purple) -->
  <path d="M 327.3 332.0 A 155 155 0 0 1 327.3 278.0" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  
  <!-- 5 to 0: Applications to Users (Target Green) -->
  <path d="M 380.3 186.3 A 155 155 0 0 1 427.0 159.3" fill="none" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrow-green)"/>


  <!-- NODES -->
  <!-- Center: NETWORK FLYWHEEL -->
  <g filter="url(#soft)">
    <circle cx="480" cy="305" r="46" fill="#1C2128" stroke="#343A44" stroke-width="1.5"/>
    <text x="480" y="301" text-anchor="middle" fill="#8E96A4" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">NETWORK</text>
    <text x="480" y="319" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">FLYWHEEL</text>
  </g>

  <!-- Node 0: USERS (Top, -90deg) -->
  <g filter="url(#soft)">
    <rect x="422" y="126" width="116" height="48" rx="8" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="480" y="146" text-anchor="middle" fill="#8E96A4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">MORE</text>
    <text x="480" y="164" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">USERS</text>
  </g>

  <!-- Node 1: MINERS (TopRight, -30deg) -->
  <g filter="url(#soft)">
    <rect x="556.2" y="203.5" width="116" height="48" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="614.2" y="223.5" text-anchor="middle" fill="#8E96A4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">MORE</text>
    <text x="614.2" y="241.5" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">MINERS</text>
  </g>

  <!-- Node 2: SECURITY (BottomRight, +30deg) -->
  <g filter="url(#soft)">
    <rect x="556.2" y="358.5" width="116" height="48" rx="8" fill="#20252D" stroke="#8B5CF6" stroke-width="2"/>
    <text x="614.2" y="378.5" text-anchor="middle" fill="#8E96A4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">MORE</text>
    <text x="614.2" y="396.5" text-anchor="middle" fill="#8B5CF6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">SECURITY</text>
  </g>

  <!-- Node 3: VALUE (Bottom, +90deg) -->
  <g filter="url(#soft)">
    <rect x="422" y="436" width="116" height="48" rx="8" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="480" y="456" text-anchor="middle" fill="#8E96A4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">MORE</text>
    <text x="480" y="474" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">VALUE</text>
  </g>

  <!-- Node 4: DEVELOPERS (BottomLeft, +150deg) -->
  <g filter="url(#soft)">
    <rect x="287.8" y="358.5" width="116" height="48" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="345.8" y="378.5" text-anchor="middle" fill="#8E96A4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">MORE</text>
    <text x="345.8" y="396.5" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">DEVELOPERS</text>
  </g>

  <!-- Node 5: APPLICATIONS (TopLeft, +210deg) -->
  <g filter="url(#soft)">
    <rect x="287.8" y="203.5" width="116" height="48" rx="8" fill="#20252D" stroke="#8B5CF6" stroke-width="2"/>
    <text x="345.8" y="223.5" text-anchor="middle" fill="#8E96A4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">MORE</text>
    <text x="345.8" y="241.5" text-anchor="middle" fill="#8B5CF6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">APPLICATIONS</text>
  </g>

  <!-- Bottom Details -->
  <text x="480" y="500" text-anchor="middle" fill="#8E96A4" font-family="JetBrains Mono, monospace" font-size="13">V ∝ n² — Metcalfe's Law</text>
  <text x="480" y="516" text-anchor="middle" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="11">Total wallet addresses: ~400M+ (2025)</text>

</svg>