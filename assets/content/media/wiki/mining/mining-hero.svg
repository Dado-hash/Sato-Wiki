<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin mining — assembling a block candidate from the mempool</title>
  <desc id="desc">A miner selects transactions from the mempool, builds a block header, and searches for a valid proof of work solution.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Bitcoin mining</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Assembling a block candidate from the mempool</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 152H884"/>
    <path d="M76 320H884"/>
    <path d="M76 432H884"/>
    <path d="M192 152V432"/>
    <path d="M468 152V432"/>
    <path d="M726 152V432"/>
  </g>

  <g transform="translate(-12 0)">

    <!-- Mempool -->
    <g filter="url(#soft)">
      <rect x="72" y="174" width="240" height="230" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
      <text x="192" y="212" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Mempool</text>
      <text x="192" y="236" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="15">unconfirmed transactions</text>

      <rect x="100" y="262" width="184" height="38" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="148" y="288" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">tx: a4f1...</text>
      <text x="268" y="288" text-anchor="end" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">42 sat/vB</text>

      <rect x="100" y="310" width="184" height="38" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="148" y="336" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">tx: b3e9...</text>
      <text x="268" y="336" text-anchor="end" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">18 sat/vB</text>

      <rect x="100" y="358" width="184" height="38" rx="10" fill="#171B21" stroke="#46505C"/>
      <text x="148" y="384" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">tx: c7d2...</text>
      <text x="268" y="384" text-anchor="end" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="14">4 sat/vB</text>
    </g>

    <path d="M326 290H388" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

    <!-- ASIC Miner -->
    <g filter="url(#soft)">
      <rect x="404" y="174" width="160" height="230" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
      <text x="484" y="212" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">ASIC Miner</text>

      <!-- Rack enclosure -->
      <rect x="424" y="238" width="120" height="140" rx="10" fill="#171B21" stroke="#343A44" stroke-width="1.5"/>

      <!-- Hash board 1 -->
      <rect x="434" y="250" width="100" height="30" rx="6" fill="#1A1F28" stroke="#46505C"/>
      <rect x="440" y="257" width="22" height="16" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1.2"/>
      <rect x="468" y="257" width="22" height="16" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1.2"/>
      <rect x="496" y="257" width="22" height="16" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1.2"/>
      <text x="484" y="293" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">SHA-256</text>

      <!-- Hash board 2 -->
      <rect x="434" y="306" width="100" height="30" rx="6" fill="#1A1F28" stroke="#46505C"/>
      <rect x="440" y="313" width="22" height="16" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1.2"/>
      <rect x="468" y="313" width="22" height="16" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1.2"/>
      <rect x="496" y="313" width="22" height="16" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1.2"/>
      <text x="484" y="349" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">SHA-256</text>

      <!-- Fan / vent -->
      <circle cx="484" cy="368" r="5" fill="none" stroke="#46505C" stroke-width="1.5"/>
      <circle cx="484" cy="368" r="2" fill="#46505C"/>
    </g>

    <path d="M578 290H644" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

    <!-- Block candidate -->
    <g filter="url(#soft)">
      <rect x="660" y="174" width="224" height="230" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
      <text x="772" y="212" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Block candidate</text>

      <rect x="688" y="240" width="168" height="34" rx="8" fill="#171B21" stroke="#46505C"/>
      <text x="700" y="263" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">prev hash</text>
      <text x="848" y="263" text-anchor="end" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="13">0000...a1b2</text>

      <rect x="688" y="282" width="168" height="34" rx="8" fill="#171B21" stroke="#46505C"/>
      <text x="700" y="305" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Merkle root</text>
      <text x="848" y="305" text-anchor="end" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="13">f3e4...</text>

      <rect x="688" y="324" width="168" height="34" rx="8" fill="#171B21" stroke="#46505C"/>
      <text x="700" y="347" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">nonce</text>
      <text x="848" y="347" text-anchor="end" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">???</text>

      <rect x="688" y="366" width="168" height="28" rx="14" fill="#2A2116" stroke="#F7931A" stroke-width="1.5"/>
      <text x="772" y="386" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">searching...</text>
    </g>

    <path d="M898 290H938" stroke="#22C55E" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <rect x="888" y="162" width="60" height="32" rx="16" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
    <text x="918" y="184" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">valid</text>

    <!-- Coinbase label below -->
    <rect x="660" y="428" width="224" height="44" rx="22" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
    <text x="772" y="456" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">coinbase + fees → miner</text>

  </g>
</svg>
