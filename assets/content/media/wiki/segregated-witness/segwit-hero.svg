<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Segregated Witness separation</title>
  <desc id="desc">A Bitcoin transaction is split into transaction data (inputs, outputs, locktime) and witness data (signatures). The txid is computed only from the non-witness part, making it non-malleable.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Segregated Witness</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Signatures separated from transaction data — txid is no longer malleable.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 156H884"/>
    <path d="M76 310H884"/>
  </g>

  <g filter="url(#soft)">
    <rect x="260" y="176" width="440" height="116" rx="18" fill="#20252D" stroke="#F7931A" stroke-width="1.8"/>
    <rect x="480" y="200" text-anchor="middle" x="480" width="0" height="0"/>
    <text x="480" y="214" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Bitcoin Transaction</text>

    <rect x="282" y="240" width="180" height="34" rx="12" fill="#171B21" stroke="#46505C"/>
    <text x="372" y="262" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15">version · inputs · outputs</text>

    <rect x="498" y="240" width="180" height="34" rx="12" fill="#2A2116" stroke="#F7931A" stroke-width="1.6"/>
    <text x="588" y="262" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">signatures</text>
  </g>

  <path d="M480 296V336" stroke="#F7931A" stroke-width="4" stroke-linecap="round"/>
  <path d="M480 336C480 346 280 354 280 368" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M480 336C480 346 680 354 680 368" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="76" y="336" width="396" height="140" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="274" y="374" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Transaction Data</text>
    <rect x="104" y="398" width="124" height="30" rx="10" fill="#171B21" stroke="#46505C"/>
    <text x="166" y="418" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">version</text>
    <rect x="240" y="398" width="124" height="30" rx="10" fill="#171B21" stroke="#46505C"/>
    <text x="302" y="418" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">inputs</text>
    <rect x="104" y="434" width="124" height="30" rx="10" fill="#171B21" stroke="#46505C"/>
    <text x="166" y="454" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">outputs</text>
    <rect x="240" y="434" width="124" height="30" rx="10" fill="#171B21" stroke="#46505C"/>
    <text x="302" y="454" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">locktime</text>
    <rect x="390" y="428" width="64" height="24" rx="12" fill="#203327" stroke="#22C55E" stroke-width="1.4"/>
    <text x="422" y="445" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">txid ✓</text>
  </g>

  <g filter="url(#soft)">
    <rect x="488" y="336" width="396" height="140" rx="18" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="686" y="374" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Witness Data</text>
    <rect x="520" y="398" width="152" height="30" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1.6"/>
    <text x="596" y="418" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">signature stack</text>
    <rect x="688" y="398" width="152" height="30" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1.6"/>
    <text x="764" y="418" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">witness script</text>
    <rect x="520" y="440" width="140" height="24" rx="12" fill="#241E31" stroke="#7C5CFF" stroke-width="1.4"/>
    <text x="590" y="457" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">NOT in txid</text>
    <rect x="688" y="440" width="140" height="24" rx="12" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="758" y="457" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">wtxid only</text>
  </g>

  <path d="M274 480V498" stroke="#7C8794" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
  <text x="214" y="510" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">non-malleable</text>

  <path d="M686 480V498" stroke="#7C8794" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
  <text x="654" y="510" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">malleable but isolated</text>
</svg>
