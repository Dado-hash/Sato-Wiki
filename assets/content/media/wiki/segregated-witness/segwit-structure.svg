<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Legacy vs SegWit transaction structure</title>
  <desc id="desc">Side-by-side comparison of legacy and SegWit transaction formats. Legacy includes signatures in scriptSig. SegWit adds a marker, flag, and separate witness section with a weight discount.</desc>

  <defs>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Transaction format comparison</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Legacy vs SegWit serialization with witness discount and weight calculation.</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 146H884"/>
    <path d="M76 498H884"/>
    <path d="M480 146V498"/>
  </g>

  <g filter="url(#soft)">
    <rect x="76" y="162" width="384" height="314" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="268" y="200" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Legacy Transaction</text>
    <text x="268" y="222" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Signatures inside inputs</text>

    <rect x="96" y="244" width="344" height="30" rx="8" fill="#171B21" stroke="#46505C"/>
    <text x="120" y="264" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">version</text>
    <text x="416" y="264" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">4 B</text>

    <rect x="96" y="282" width="344" height="62" rx="8" fill="#2A2116" stroke="#F7931A" stroke-width="1.6"/>
    <text x="120" y="302" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">inputs</text>
    <text x="416" y="302" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">var</text>
    <text x="120" y="326" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">prevout · <tspan fill="#F7931A">scriptSig (sig+pubkey)</tspan> · seq</text>
    <text x="416" y="330" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">~146 B / input</text>

    <rect x="96" y="352" width="344" height="30" rx="8" fill="#171B21" stroke="#46505C"/>
    <text x="120" y="372" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">outputs</text>
    <text x="416" y="372" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">var</text>

    <rect x="96" y="390" width="344" height="30" rx="8" fill="#171B21" stroke="#46505C"/>
    <text x="120" y="410" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">locktime</text>
    <text x="416" y="410" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">4 B</text>

    <rect x="96" y="434" width="344" height="28" rx="14" fill="#241E31" stroke="#7C5CFF" stroke-width="1.4"/>
    <text x="268" y="453" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">1 MB block limit</text>
  </g>

  <g filter="url(#soft)">
    <rect x="500" y="162" width="384" height="314" rx="18" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <text x="692" y="200" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">SegWit Transaction</text>
    <text x="692" y="222" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">Witness data separated</text>

    <rect x="520" y="244" width="344" height="30" rx="8" fill="#171B21" stroke="#46505C"/>
    <text x="544" y="264" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">version</text>
    <text x="840" y="264" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">4 B</text>

    <rect x="520" y="282" width="344" height="30" rx="8" fill="#2A2116" stroke="#F7931A" stroke-width="1.6"/>
    <text x="544" y="302" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">marker + flag</text>
    <text x="840" y="302" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">2 B</text>

    <rect x="520" y="320" width="344" height="46" rx="8" fill="#171B21" stroke="#46505C"/>
    <text x="544" y="340" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">inputs (scriptSig empty)</text>
    <text x="840" y="340" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">var</text>
    <text x="544" y="356" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">prevout · <tspan fill="#22C55E">∅ scriptSig</tspan> · seq</text>

    <rect x="520" y="374" width="344" height="30" rx="8" fill="#171B21" stroke="#46505C"/>
    <text x="544" y="394" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="14">outputs</text>
    <text x="840" y="394" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">var</text>

    <rect x="520" y="412" width="344" height="48" rx="8" fill="#2A2116" stroke="#F7931A" stroke-width="1.6"/>
    <text x="544" y="432" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">witness data</text>
    <text x="840" y="432" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">var</text>
    <text x="544" y="448" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">stack items per input · <tspan fill="#22C55E">1 WU / B</tspan></text>

    <rect x="520" y="468" width="161" height="20" rx="10" fill="#171B21" stroke="#46505C"/>
    <text x="544" y="483" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="12">locktime</text>
    <text x="667" y="483" text-anchor="end" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">4 B</text>

    <rect x="693" y="468" width="171" height="20" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1.2"/>
    <text x="778" y="483" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">base×3 + total ≤ 4 MU</text>
  </g>

  <g stroke="#7C8794" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.7">
    <line x1="476" y1="196" x2="476" y2="460" marker-start="url(#arrow-muted)" marker-end="url(#arrow-muted)"/>
  </g>
</svg>
