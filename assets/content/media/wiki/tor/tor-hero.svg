<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tor routing</title>
  <desc id="desc">A wallet connection passes through three Tor relays, so the peer sees only the exit address.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 12)">

  <rect x="296" y="206" width="368" height="136" rx="18" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="480" y="194" text-anchor="middle" fill="#8B5CF6" font-family="Inter" font-size="18" font-weight="700">Tor</text>

  <rect x="96" y="226" width="140" height="96" rx="12" fill="#20252D" stroke="#B7B1A8" stroke-width="2"/>
  <text x="166" y="284" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="22">IP</text>

  <circle cx="340" cy="274" r="34" fill="#20252D" stroke="#8B5CF6" stroke-width="2.5"/>
  <circle cx="480" cy="274" r="34" fill="#20252D" stroke="#8B5CF6" stroke-width="2.5"/>
  <circle cx="620" cy="274" r="34" fill="#20252D" stroke="#8B5CF6" stroke-width="2.5"/>

  <path d="M236 274H306M374 274H446M514 274H586M654 274H726" stroke="#8E96A4" stroke-width="3" stroke-linecap="round"/>
  <polygon points="740,274 728,267 728,281" fill="#8E96A4"/>

  <rect x="740" y="226" width="120" height="96" rx="12" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="800" y="284" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="22">IP</text>
</g>
</svg>
