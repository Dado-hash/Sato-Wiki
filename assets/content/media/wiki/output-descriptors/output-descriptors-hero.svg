<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Output descriptor</title>
  <desc id="desc">A descriptor string with its key origin and checksum fans out into a set of derived addresses.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 -6)">

  <!-- The descriptor string -->
  <rect x="130" y="156" width="700" height="76" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <text x="252" y="202" font-family="JetBrains Mono" font-size="20"><tspan fill="#F7931A">wpkh(</tspan><tspan fill="#8B5CF6">[d34db33f/84h/0h/0h]</tspan><tspan fill="#F4EAD8">KEY</tspan><tspan fill="#F7931A">)</tspan><tspan fill="#22C55E">#checksum</tspan></text>

  <!-- Fan out to derived outputs -->
  <path d="M480 232 V288" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M230 288 H730" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M230 288 V316" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M480 288 V316" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M730 288 V316" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="224,310 236,310 230,320" fill="#B7B1A8"/>
  <polygon points="474,310 486,310 480,320" fill="#B7B1A8"/>
  <polygon points="724,310 736,310 730,320" fill="#B7B1A8"/>

  <rect x="130" y="324" width="200" height="80" rx="8" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <text x="230" y="371" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="20">bc1q...</text>
  <rect x="380" y="324" width="200" height="80" rx="8" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <text x="480" y="371" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="20">bc1q...</text>
  <rect x="630" y="324" width="200" height="80" rx="8" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <text x="730" y="371" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="20">bc1q...</text>
</g>
</svg>
