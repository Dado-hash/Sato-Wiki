<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Merkle Tree</title>
  <desc id="desc">A binary hash tree showing four transactions hashed in pairs up to a single Merkle root.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Merkle Tree</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Efficient verification of transaction membership</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 145H884"/>
    <path d="M76 260H884"/>
    <path d="M76 375H884"/>
    <path d="M76 490H884"/>
  </g>

  <!-- Connecting lines between nodes -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Tx0 + Tx1 -> H01 -->
    <path d="M216 388L312 314" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <path d="M408 388L312 314" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <!-- Tx2 + Tx3 -> H23 -->
    <path d="M552 388L648 314" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <path d="M744 388L648 314" stroke="#7C8794" marker-end="url(#arrow-muted)"/>
    <!-- H01 + H23 -> Root -->
    <path d="M344 274L480 188" stroke="#22C55E" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <path d="M616 274L480 188" stroke="#22C55E" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Hash operation labels -->
  <rect x="254" y="348" width="100" height="20" rx="6" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <text x="304" y="362" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">SHA256d</text>
  <rect x="590" y="348" width="100" height="20" rx="6" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <text x="640" y="362" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">SHA256d</text>
  <rect x="422" y="232" width="100" height="20" rx="6" fill="#20252D" stroke="#22C55E" stroke-width="1"/>
  <text x="472" y="246" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="11">SHA256d</text>

  <!-- + labels between paired tx hashes -->
  <text x="320" y="421" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">+</text>
  <text x="656" y="421" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">+</text>
  <text x="448" y="248" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">+</text>

  <!-- Root node -->
  <g filter="url(#soft)">
    <rect x="380" y="156" width="200" height="56" rx="14" fill="#2A2116" stroke="#F7931A" stroke-width="2.5"/>
    <text x="480" y="176" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Merkle Root</text>
    <text x="480" y="198" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13">7d4e3a...c91f</text>
  </g>

  <!-- Intermediate nodes -->
  <g filter="url(#soft)">
    <rect x="268" y="268" width="166" height="50" rx="12" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="351" y="287" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">H01 = H(Tx0 + Tx1)</text>
    <text x="351" y="306" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12">b1f4c9...a3d2</text>
  </g>
  <g filter="url(#soft)">
    <rect x="526" y="268" width="166" height="50" rx="12" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <text x="609" y="287" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">H23 = H(Tx2 + Tx3)</text>
    <text x="609" y="306" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12">e7a2b8...4f61</text>
  </g>

  <!-- Transaction leaf nodes -->
  <g filter="url(#soft)">
    <rect x="146" y="396" width="140" height="46" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.8"/>
    <text x="216" y="415" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">Tx0</text>
    <text x="216" y="432" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">a1b2c3...d4e5</text>
  </g>
  <g filter="url(#soft)">
    <rect x="338" y="396" width="140" height="46" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.8"/>
    <text x="408" y="415" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">Tx1</text>
    <text x="408" y="432" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">f6e7d8...c9b0</text>
  </g>
  <g filter="url(#soft)">
    <rect x="482" y="396" width="140" height="46" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.8"/>
    <text x="552" y="415" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">Tx2</text>
    <text x="552" y="432" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">9a8b7c...6d5e</text>
  </g>
  <g filter="url(#soft)">
    <rect x="674" y="396" width="140" height="46" rx="10" fill="#20252D" stroke="#46505C" stroke-width="1.8"/>
    <text x="744" y="415" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">Tx3</text>
    <text x="744" y="432" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">4e5f6a...7b8c</text>
  </g>

  <!-- Merkle proof callout -->
  <rect x="38" y="460" width="260" height="44" rx="10" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
  <text x="168" y="478" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Merkle proof for Tx2: Tx3 + H01</text>
  <text x="168" y="496" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">log2(n) hashes needed per proof</text>

  <!-- SPV callout -->
  <rect x="660" y="460" width="260" height="44" rx="10" fill="#2A2331" stroke="#7C5CFF" stroke-width="1.5"/>
  <text x="790" y="478" text-anchor="middle" fill="#7C5CFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">SPV: verify without full block</text>
  <text x="790" y="496" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11">keep only block headers + proofs</text>
</svg>
