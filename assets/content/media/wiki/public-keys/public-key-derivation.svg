<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Public Key Derivation — elliptic curve multiplication</title>
  <desc id="desc">A private key scalar is multiplied by the secp256k1 generator point G to produce the public key point K = k*G on the elliptic curve. This operation is one-way: the private key cannot be recovered from the public key.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Public Key Derivation</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Elliptic curve multiplication is one-way — you cannot go back from K to k.</text>

  <!-- Separator -->
  <line x1="76" y1="144" x2="884" y2="144" stroke="#28313B" stroke-width="1" opacity="0.55"/>

  <!-- ====== TOP HALF: Private Key → × G → Public Key ====== -->

  <!-- Private key box (orange) -->
  <g filter="url(#soft)">
    <rect x="76" y="170" width="280" height="130" rx="14" fill="#2A2116" stroke="#F7931A" stroke-width="2.4"/>
    <text x="216" y="200" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Private Key</text>
    <rect x="94" y="214" width="244" height="30" rx="6" fill="#111418" stroke="#343A44" stroke-width="1"/>
    <text x="216" y="235" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11">0xE9 87 3D 79 ... C1 A5 2B 40</text>
    <text x="216" y="270" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">scalar k <tspan fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">[256 bits]</tspan></text>
    <text x="216" y="290" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">known only to the owner</text>
  </g>

  <!-- × G arrow -->
  <path d="M356 235L416 235" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <!-- Multiplication label on arrow -->
  <rect x="356" y="166" width="60" height="28" rx="6" fill="#20252D" stroke="#46505C" stroke-width="1.4"/>
  <text x="386" y="185" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">× G</text>

  <!-- Public key box (green) -->
  <g filter="url(#soft)">
    <rect x="426" y="162" width="320" height="148" rx="14" fill="#0A1F16" stroke="#22C55E" stroke-width="2.4"/>
    <text x="586" y="192" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Public Key</text>

    <!-- x-coordinate -->
    <text x="444" y="220" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="11">x = 0x79BE667E ... F2FC984A</text>
    <!-- y-coordinate -->
    <text x="444" y="242" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="11">y = 0x483ADA77 ... 51C0E0E7</text>

    <line x1="444" y1="254" x2="728" y2="254" stroke="#28313B" stroke-width="1" opacity="0.4"/>

    <text x="586" y="278" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14">point K = k × G <tspan fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">(x, y)</tspan></text>
    <text x="586" y="300" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">safe to share · derived deterministically</text>
  </g>

  <!-- ====== BOTTOM HALF: Elliptic Curve with point P = k×G ====== -->

  <line x1="76" y1="340" x2="884" y2="340" stroke="#28313B" stroke-width="1" opacity="0.55"/>

  <!-- Elliptic curve SVG plot -->
  <!-- Coordinate axes -->
  <g transform="translate(480, 440)">
    <!-- Axes -->
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#46505C" stroke-width="1.2"/>
    <line x1="0" y1="70" x2="0" y2="-70" stroke="#46505C" stroke-width="1.2"/>

    <!-- Axis labels -->
    <text x="270" y="16" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="end">x</text>
    <text x="-12" y="-68" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14">y</text>

    <!-- Elliptic curve y² = x³ + 7 (secp256k1) — realistic shape -->
    <!-- Top branch -->
    <path d="M-260,25 C-240,6 -220,-10 -200,-18 C-180,-24 -170,-26 -160,-22 C-150,-16 -145,2 -140,14 C-135,24 -130,30 -125,30 C-120,28 -115,24 -110,18 C-105,12 -100,4 -95,-6 C-90,-16 -85,-24 -80,-30 C-75,-34 -70,-36 -65,-36 C-60,-36 -55,-34 -50,-30 C-45,-24 -40,-16 -35,-6 C-30,6 -25,20 -20,36 C-15,52 -10,64 -5,70"
      fill="none" stroke="#F4EAD8" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <!-- Top branch continues above viewport -->
    <path d="M-5,70 C0,74 5,72 10,60 C15,48 20,30 25,12 C30,-6 35,-22 40,-34 C45,-44 50,-50 55,-50 C60,-50 65,-48 70,-42 C75,-36 80,-26 85,-14 C90,-2 95,12 100,26 C105,38 110,48 115,54 C120,58 125,60 130,60"
      fill="none" stroke="#F4EAD8" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <!-- Top branch continues further right -->
    <path d="M130,60 C140,60 150,54 160,42 C170,28 180,10 190,-4 C200,-18 210,-28 220,-32 C230,-34 240,-30 250,-20 C255,-14 258,-8 260,0"
      fill="none" stroke="#F4EAD8" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

    <!-- Bottom branch (mirrored) -->
    <path d="M-260,-25 C-240,-6 -220,10 -200,18 C-180,24 -170,26 -160,22 C-150,16 -145,-2 -140,-14 C-135,-24 -130,-30 -125,-30 C-120,-28 -115,-24 -110,-18 C-105,-12 -100,-4 -95,6 C-90,16 -85,24 -80,30 C-75,34 -70,36 -65,36 C-60,36 -55,34 -50,30 C-45,24 -40,16 -35,6 C-30,-6 -25,-20 -20,-36 C-15,-52 -10,-64 -5,-70"
      fill="none" stroke="#F4EAD8" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <!-- Bottom branch continues below viewport -->
    <path d="M-5,-70 C0,-74 5,-72 10,-60 C15,-48 20,-30 25,-12 C30,6 35,22 40,34 C45,44 50,50 55,50 C60,50 65,48 70,42 C75,36 80,26 85,14 C90,2 95,-12 100,-26 C105,-38 110,-48 115,-54 C120,-58 125,-60 130,-60"
      fill="none" stroke="#F4EAD8" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <!-- Bottom branch continues further right -->
    <path d="M130,-60 C140,-60 150,-54 160,-42 C170,-28 180,-10 190,4 C200,18 210,28 220,32 C230,34 240,30 250,20 C255,14 258,8 260,0"
      fill="none" stroke="#F4EAD8" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

    <!-- Point P = k*G (on curve) -->
    <circle cx="85" cy="-14" r="7" fill="#22C55E" stroke="#0A1F16" stroke-width="2"/>
    <circle cx="85" cy="-14" r="3" fill="#22C55E"/>

    <!-- Line from point to x-axis (showing x-coordinate) -->
    <line x1="85" y1="-14" x2="85" y2="0" stroke="#22C55E" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
    <!-- Line from point to y-axis (showing y-coordinate) -->
    <line x1="85" y1="-14" x2="0" y2="-14" stroke="#22C55E" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>

    <!-- Point label -->
    <text x="98" y="-18" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">P = k × G</text>

    <!-- G point (generator) -->
    <circle cx="-30" cy="6" r="4.5" fill="#F7931A" stroke="#0A1F16" stroke-width="1.5"/>
    <text x="-40" y="20" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">G</text>

    <!-- Annotation: confirmed by the curve equation -->
    <text x="0" y="105" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">secp256k1: y² = x³ + 7  (mod p)</text>
  </g>

  <!-- Right side: details panel -->
  <g transform="translate(626, 360)">
    <rect x="0" y="0" width="280" height="130" rx="12" fill="#20252D" stroke="#46505C" stroke-width="1.4"/>
    <text x="140" y="28" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Key Properties</text>
    <line x1="16" y1="40" x2="264" y2="40" stroke="#28313B" stroke-width="1" opacity="0.5"/>

    <circle cx="24" cy="60" r="4" fill="#22C55E"/>
    <text x="36" y="65" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">One-way: K = k × G is easy, inverse is hard</text>

    <circle cx="24" cy="82" r="4" fill="#22C55E"/>
    <text x="36" y="87" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Compressed: 33 bytes (x + sign of y)</text>

    <circle cx="24" cy="104" r="4" fill="#22C55E"/>
    <text x="36" y="109" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Uncompressed: 65 bytes (x + y)</text>
  </g>

  <!-- Footer legend -->
  <text x="64" y="524" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">K = k × G  ·  Discrete logarithm problem  ·  secp256k1</text>
  <text x="600" y="524" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">For wallet: Private key → Public key → Address (hash)</text>
</svg>
