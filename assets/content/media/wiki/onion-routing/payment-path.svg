<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Hop Payment Path in Lightning Network</title>
  <desc id="desc">A five-node Lightning Network graph showing the mesh topology and a highlighted multi-hop payment path from Alice through Charlie, Bob, and Diana to Carol, with HTLCs flowing forward and preimages returning.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted-p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#46505C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Multi-Hop Payment Path</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">The sender selects the entire path. Each intermediate node knows only its predecessor and successor.</text>

  <line x1="64" y1="140" x2="920" y2="140" stroke="#28313B" stroke-width="1" opacity="0.55"/>

  <text x="64" y="165" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">LIGHTNING NETWORK GRAPH</text>

  <line x1="64" y1="175" x2="920" y2="175" stroke="#28313B" stroke-width="1" opacity="0.2"/>

  <g opacity="0.3">
    <line x1="200" y1="210" x2="380" y2="210" stroke="#46505C" stroke-width="2"/>
    <line x1="200" y1="210" x2="420" y2="330" stroke="#46505C" stroke-width="2"/>
    <line x1="380" y1="210" x2="420" y2="330" stroke="#46505C" stroke-width="2"/>
    <line x1="380" y1="210" x2="600" y2="240" stroke="#46505C" stroke-width="2"/>
    <line x1="420" y1="330" x2="600" y2="240" stroke="#46505C" stroke-width="2"/>
    <line x1="420" y1="330" x2="780" y2="300" stroke="#46505C" stroke-width="2"/>
    <line x1="600" y1="240" x2="780" y2="300" stroke="#46505C" stroke-width="2"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="200" cy="210" r="36" fill="#241E31" stroke="#7C5CFF" stroke-width="2"/>
  </g>
  <text x="200" y="216" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Alice</text>

  <g filter="url(#soft)">
    <circle cx="380" cy="210" r="36" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  </g>
  <text x="380" y="216" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Bob</text>

  <g filter="url(#soft)">
    <circle cx="420" cy="330" r="36" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  </g>
  <text x="420" y="336" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Diana</text>

  <g filter="url(#soft)">
    <circle cx="600" cy="240" r="36" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  </g>
  <text x="600" y="246" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Charlie</text>

  <g filter="url(#soft)">
    <circle cx="780" cy="300" r="36" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  </g>
  <text x="780" y="306" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Carol</text>

  <text x="64" y="400" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">HIGHLIGHTED PAYMENT PATH</text>
  <line x1="64" y1="410" x2="920" y2="410" stroke="#28313B" stroke-width="1" opacity="0.2"/>

  <!-- Alice ↔ Bob -->
  <line x1="235.3" y1="203" x2="344.7" y2="203" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="290" y="196" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">HTLC</text>

  <line x1="344.7" y1="217" x2="235.3" y2="217" stroke="#22C55E" stroke-width="3.5" marker-end="url(#arrow-green)" stroke-dasharray="6,4"/>
  <text x="290" y="233" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">preimage</text>

  <!-- Bob ↔ Diana -->
  <line x1="384.5" y1="245.7" x2="402.2" y2="298.7" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="375" y="275" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">HTLC</text>

  <line x1="415.5" y1="294.3" x2="397.8" y2="241.3" stroke="#22C55E" stroke-width="3.5" marker-end="url(#arrow-green)" stroke-dasharray="6,4"/>
  <text x="418" y="268" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="10">preimage</text>

  <!-- Diana ↔ Charlie -->
  <path d="M454.7 320.5 L571.6 262.1" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="503" y="274" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">HTLC</text>

  <path d="M565.3 249.5 L448.5 308" stroke="#22C55E" stroke-width="3.5" marker-end="url(#arrow-green)" stroke-dasharray="6,4"/>
  <text x="555" y="312" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">preimage</text>

  <!-- Charlie ↔ Carol -->
  <path d="M631.3 257.8 L744.3 295.5" stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="697" y="262" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="10">HTLC</text>

  <path d="M748.7 282.2 L635.7 244.5" stroke="#22C55E" stroke-width="3.5" marker-end="url(#arrow-green)" stroke-dasharray="6,4"/>
  <text x="720" y="300" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="10">preimage</text>

  <g filter="url(#soft)">
    <rect x="340" y="425" width="340" height="65" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1.5"/>
  </g>
  <text x="354" y="447" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Source Routing</text>
  <text x="354" y="467" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Alice (the sender) selects every hop in the path.</text>
  <text x="354" y="483" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Bob sees only Alice and Diana — not Charlie or Carol.</text>
</svg>