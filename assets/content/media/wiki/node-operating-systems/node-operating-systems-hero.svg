<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Home node appliance</title>
  <desc id="desc">A small computer runs a node, an Electrum server, a Lightning node and apps, and sends its backups to a drive.</desc>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 -6)">

  <!-- Device body -->
  <rect x="300" y="92" width="360" height="280" rx="22" fill="#1C2128" stroke="#343A44" stroke-width="2"/>

  <!-- System bar -->
  <rect x="318" y="112" width="324" height="44" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="480" y="140" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="18">OS</text>

  <!-- App tiles -->
  <rect x="318" y="172" width="156" height="84" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="396" y="222" text-anchor="middle" fill="#F7931A" font-family="Inter" font-size="24" font-weight="700">node</text>

  <rect x="486" y="172" width="156" height="84" rx="8" fill="#20252D" stroke="#8B5CF6" stroke-width="2"/>
  <text x="564" y="222" text-anchor="middle" fill="#8B5CF6" font-family="Inter" font-size="18" font-weight="700">Electrum</text>

  <rect x="318" y="272" width="156" height="84" rx="8" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
  <text x="396" y="322" text-anchor="middle" fill="#22C55E" font-family="Inter" font-size="18" font-weight="700">Lightning</text>

  <rect x="486" y="272" width="156" height="84" rx="8" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <text x="564" y="322" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">app</text>

  <!-- Backup flow to the drive -->
  <path d="M480 372V404" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="480,412 474,402 486,402" fill="#22C55E"/>
  <rect x="410" y="412" width="140" height="56" rx="8" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
  <text x="480" y="446" text-anchor="middle" fill="#22C55E" font-family="Inter" font-size="18" font-weight="700">backup</text>
</g>
</svg>
