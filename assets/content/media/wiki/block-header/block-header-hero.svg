<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Block header chain</title>
  <desc id="desc">Three linked block headers, and the header hash must fall below the target encoded by nBits.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 -12)">

  <!-- Three headers linked by the previous hash -->
  <rect x="96" y="160" width="200" height="110" rx="8" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <text x="196" y="206" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">header</text>

  <rect x="380" y="160" width="200" height="110" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="480" y="206" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">header</text>
  <text x="480" y="246" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono" font-size="16">nonce</text>

  <rect x="664" y="160" width="200" height="110" rx="8" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <text x="764" y="206" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">header</text>

  <path d="M296 215 H366" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="366,209 378,215 366,221" fill="#B7B1A8"/>
  <path d="M580 215 H650" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="650,209 662,215 650,221" fill="#B7B1A8"/>

  <!-- Target scale: hash below the nBits target is valid -->
  <rect x="120" y="354" width="720" height="24" rx="12" fill="#20252D" stroke="#343A44" stroke-width="1.5"/>
  <rect x="121" y="355" width="208" height="22" rx="11" fill="#22C55E" fill-opacity="0.35"/>
  <path d="M330 336 V390" stroke="#F7931A" stroke-width="3" stroke-linecap="round"/>
  <text x="330" y="328" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono" font-size="16">nBits</text>

  <circle cx="240" cy="366" r="9" fill="#22C55E"/>
  <text x="240" y="412" text-anchor="middle" fill="#22C55E" font-family="Inter" font-size="16" font-weight="700">hash</text>
</g>
</svg>
