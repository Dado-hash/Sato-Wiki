<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Node computer and disk use</title>
  <desc id="desc">A small node computer sits beside two disk bars, one for a pruned node and one for a full archive.</desc>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 10)">

  <!-- Small node computer -->
  <rect x="130" y="170" width="200" height="140" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <path d="M160 200H300M160 220H300M160 240H300" stroke="#343A44" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="290" r="7" fill="#22C55E"/>
  <text x="230" y="350" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">node</text>

  <!-- Pruned node disk use -->
  <text x="400" y="200" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">pruned</text>
  <rect x="400" y="214" width="440" height="32" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <rect x="400" y="214" width="180" height="32" rx="8" fill="#8B5CF6"/>

  <!-- Full archive disk use -->
  <text x="400" y="312" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">full</text>
  <rect x="400" y="326" width="440" height="32" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <rect x="400" y="326" width="440" height="32" rx="8" fill="#46505C"/>
</g>
</svg>
