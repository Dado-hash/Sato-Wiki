<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Coin selection</title>
  <desc id="desc">A wallet picks two of its UTXOs as inputs, pays one output and returns the rest to a change output.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(58 0)">

  <!-- Wallet UTXOs: selected ones in orange -->
  <text x="150" y="156" fill="#B7B1A8" font-family="Inter" font-size="16" font-weight="700">UTXO</text>
  <rect x="150" y="170" width="100" height="60" rx="8" fill="#20252D" stroke="#5B6573" stroke-width="2"/>
  <rect x="262" y="170" width="60" height="60" rx="8" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
  <rect x="334" y="170" width="150" height="60" rx="8" fill="#20252D" stroke="#5B6573" stroke-width="2"/>
  <rect x="496" y="170" width="200" height="60" rx="8" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>

  <text x="292" y="156" text-anchor="middle" fill="#F7931A" font-family="Inter" font-size="16" font-weight="700">input</text>
  <text x="596" y="156" text-anchor="middle" fill="#F7931A" font-family="Inter" font-size="16" font-weight="700">input</text>

  <!-- Arrows from the selected inputs to the outputs -->
  <path d="M292 230 V308" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="286,308 298,308 292,318" fill="#B7B1A8"/>
  <path d="M596 230 V308" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="590,308 602,308 596,318" fill="#B7B1A8"/>

  <!-- Payment output and change output -->
  <rect x="180" y="318" width="260" height="80" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="310" y="365" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="18" font-weight="700">output</text>

  <rect x="470" y="318" width="226" height="80" rx="8" fill="#1C2128" stroke="#8B5CF6" stroke-width="2"/>
  <text x="583" y="365" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="18" font-weight="700">output</text>
</g>
</svg>
