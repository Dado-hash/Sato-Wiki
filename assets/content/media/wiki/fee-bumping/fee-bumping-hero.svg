<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fee bumping with RBF and CPFP</title>
  <desc id="desc">Two lanes: replace-by-fee swaps a stuck transaction for a larger version, and child-pays-for-parent adds a high-fee child.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(-10 -16)">

  <!-- Lane 1: RBF -->
  <rect x="96" y="150" width="788" height="120" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <text x="124" y="218" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">RBF</text>
  <rect x="330" y="180" width="160" height="60" rx="8" fill="#20252D" stroke="#5B6573" stroke-width="2"/>
  <text x="410" y="217" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="18">tx</text>
  <path d="M490 210 H562" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="562,204 574,210 562,216" fill="#B7B1A8"/>
  <rect x="580" y="170" width="200" height="80" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="680" y="217" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono" font-size="20">tx'</text>

  <!-- Lane 2: CPFP -->
  <rect x="96" y="310" width="788" height="120" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <text x="124" y="378" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">CPFP</text>
  <rect x="330" y="340" width="160" height="60" rx="8" fill="#20252D" stroke="#5B6573" stroke-width="2"/>
  <text x="410" y="377" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono" font-size="18">parent</text>
  <path d="M490 370 H562" stroke="#B7B1A8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="562,364 574,370 562,376" fill="#B7B1A8"/>
  <rect x="580" y="330" width="200" height="80" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <text x="680" y="377" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono" font-size="20">child</text>
</g>
</svg>
