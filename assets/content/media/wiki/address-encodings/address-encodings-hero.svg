<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bech32m and Base58Check address anatomy</title>
  <desc id="desc">A Bech32 string has a prefix, a separator, data and a checksum, while a Base58Check string has a version byte, a payload and a checksum.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <rect x="130" y="192" width="90" height="44" rx="6" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <rect x="220" y="192" width="30" height="44" rx="6" fill="#1C2128" stroke="#46505C" stroke-width="2"/>
  <rect x="250" y="192" width="480" height="44" rx="6" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <rect x="730" y="192" width="100" height="44" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
  <text x="175" y="220" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="16">bc</text>
  <text x="235" y="220" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="16">1</text>
  <text x="490" y="220" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="16">data</text>
  <text x="780" y="220" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono" font-size="16">checksum</text>

  <rect x="130" y="312" width="90" height="44" rx="6" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <rect x="220" y="312" width="500" height="44" rx="6" fill="#20252D" stroke="#46505C" stroke-width="2"/>
  <rect x="720" y="312" width="110" height="44" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
  <text x="175" y="340" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="16">version</text>
  <text x="470" y="340" text-anchor="middle" fill="#F4EAD8" font-family="JetBrains Mono" font-size="16">payload</text>
  <text x="775" y="340" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono" font-size="16">checksum</text>
</svg>
