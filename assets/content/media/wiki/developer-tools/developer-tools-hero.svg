<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mainnet, testnet and regtest</title>
  <desc id="desc">A library can target mainnet, testnet or a private regtest chain, which keeps test coins apart from real funds.</desc>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(0 -20)">

  <!-- Library -->
  <rect x="110" y="255" width="180" height="80" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="200" y="302" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="24" font-weight="700">BDK</text>

  <!-- Connectors -->
  <g stroke="#7C8794" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 295H335V190H372"/>
    <path d="M290 295H372"/>
    <path d="M335 295V400H372"/>
  </g>
  <polygon points="380,190 370,185 370,195" fill="#7C8794"/>
  <polygon points="380,295 370,290 370,300" fill="#7C8794"/>
  <polygon points="380,400 370,395 370,405" fill="#7C8794"/>

  <!-- Mainnet lane -->
  <rect x="380" y="150" width="470" height="80" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="404" y="196" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">mainnet</text>
  <rect x="600" y="170" width="40" height="40" rx="6" fill="#46505C"/>
  <rect x="648" y="170" width="40" height="40" rx="6" fill="#46505C"/>
  <rect x="696" y="170" width="40" height="40" rx="6" fill="#46505C"/>
  <rect x="744" y="170" width="40" height="40" rx="6" fill="#46505C"/>
  <rect x="792" y="170" width="40" height="40" rx="6" fill="#46505C"/>

  <!-- Testnet lane -->
  <rect x="380" y="255" width="470" height="80" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="404" y="301" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">testnet</text>
  <rect x="600" y="275" width="40" height="40" rx="6" fill="#2A303A" stroke="#56626F" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="648" y="275" width="40" height="40" rx="6" fill="#2A303A" stroke="#56626F" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="696" y="275" width="40" height="40" rx="6" fill="#2A303A" stroke="#56626F" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Regtest lane -->
  <rect x="380" y="360" width="470" height="80" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="404" y="406" fill="#F4EAD8" font-family="Inter" font-size="20" font-weight="700">regtest</text>
  <rect x="600" y="380" width="40" height="40" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
  <rect x="648" y="380" width="40" height="40" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
</g>
</svg>
