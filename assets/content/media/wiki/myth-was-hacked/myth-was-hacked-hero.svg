<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Where an attack reaches</title>
  <desc id="desc">Three stacked layers in which an attack reaches only the outer services layer, leaving the signature check untouched.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(52 -6)">

  <!-- Attack arrow into the outer layer -->
  <path d="M96 160H180" stroke="#EF4444" stroke-width="3"/>
  <polygon points="178,150 194,160 178,170" fill="#EF4444"/>

  <!-- Services: exchanges and wallets -->
  <rect x="200" y="120" width="560" height="80" rx="8" fill="#20252D" stroke="#8E96A4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="480" y="168" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">exchange</text>

  <path d="M480 200V240M480 320V360" stroke="#343A44" stroke-width="2"/>

  <!-- Software: implements the rules -->
  <rect x="200" y="240" width="560" height="80" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>
  <text x="480" y="288" text-anchor="middle" fill="#B7B1A8" font-family="Inter" font-size="22">block</text>

  <!-- Protocol: consensus rules and signatures -->
  <rect x="200" y="360" width="560" height="80" rx="8" fill="#1C2128" stroke="#22C55E" stroke-width="2"/>
  <text x="480" y="408" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">ECDSA</text>
</g>
</svg>
