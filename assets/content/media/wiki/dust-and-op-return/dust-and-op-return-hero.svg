<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dust and OP_RETURN outputs</title>
  <desc id="desc">On the left, a dust output is smaller than the cost of spending it; on the right, an OP_RETURN output carries data and is sealed.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <g transform="translate(-10 -6)">

  <!-- Left: dust, a small value against the cost of spending it -->
  <rect x="96" y="150" width="360" height="260" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <text x="276" y="190" text-anchor="middle" fill="#F4EAD8" font-family="Inter" font-size="22" font-weight="700">dust</text>
  <rect x="130" y="226" width="292" height="44" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <rect x="130" y="320" width="36" height="44" rx="6" fill="#8E96A4"/>

  <!-- Right: OP_RETURN, data pushes in an output that is sealed -->
  <rect x="504" y="150" width="380" height="260" rx="8" fill="#1C2128" stroke="#343A44" stroke-width="2"/>
  <text x="694" y="190" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono" font-size="20">OP_RETURN</text>
  <rect x="530" y="226" width="328" height="64" rx="8" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
  <rect x="548" y="238" width="40" height="40" rx="4" fill="#343A44" stroke="#5B6573" stroke-width="1.5"/>
  <rect x="600" y="238" width="40" height="40" rx="4" fill="#343A44" stroke="#5B6573" stroke-width="1.5"/>
  <rect x="652" y="238" width="40" height="40" rx="4" fill="#343A44" stroke="#5B6573" stroke-width="1.5"/>
  <rect x="704" y="238" width="40" height="40" rx="4" fill="#343A44" stroke="#5B6573" stroke-width="1.5"/>
  <rect x="756" y="238" width="40" height="40" rx="4" fill="#343A44" stroke="#5B6573" stroke-width="1.5"/>
  <rect x="836" y="226" width="8" height="64" rx="2" fill="#B7B1A8"/>
</g>
</svg>
