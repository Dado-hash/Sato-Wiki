<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hash function diagram</title>
  <desc id="desc">Arbitrary input data is processed by a hash function to produce a fixed-size output fingerprint.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Hash Function</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Arbitrary input, fixed output</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M101 142H909"/>
    <path d="M101 260H909"/>
    <path d="M101 380H909"/>
    <path d="M355 140V448"/>
    <path d="M635 140V448"/>
  </g>

  <g filter="url(#soft)">
    <rect x="101" y="170" width="248" height="200" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="225" y="210" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Arbitrary input</text>

    <g stroke="#B7B1A8" stroke-linecap="round" opacity="0.82">
      <path d="M133 238H281" stroke-width="3"/>
      <path d="M133 262H249" stroke-width="3"/>
      <path d="M133 286H305" stroke-width="3"/>
      <path d="M133 310H221" stroke-width="3"/>
      <path d="M133 334H265" stroke-width="3"/>
    </g>
    <circle cx="115" cy="238" r="4" fill="#DBC2AE"/>
    <circle cx="115" cy="262" r="4" fill="#DBC2AE"/>
    <circle cx="115" cy="286" r="4" fill="#DBC2AE"/>
    <circle cx="115" cy="310" r="4" fill="#DBC2AE"/>
    <circle cx="115" cy="334" r="4" fill="#DBC2AE"/>

    <text x="225" y="398" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="14">variable size</text>
  </g>

  <path d="M349 270H425" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="425" y="170" width="200" height="200" rx="18" fill="#20252D" stroke="#F7931A" stroke-width="1.8"/>
    <text x="525" y="216" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Hash</text>
    <text x="525" y="246" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Function</text>
    <rect x="455" y="272" width="140" height="32" rx="16" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="525" y="294" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">SHA-256</text>
    <g stroke="#B7B1A8" stroke-linecap="round" opacity="0.5">
      <path d="M455 330H595" stroke-width="2"/>
    </g>
    <text x="525" y="360" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="14">one-way, deterministic</text>
  </g>

  <path d="M625 270H685" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="685" y="170" width="174" height="200" rx="18" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="772" y="210" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Fixed-size output</text>

    <rect x="709" y="236" width="126" height="32" rx="16" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
    <text x="772" y="258" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">0xa3f1...7e9b</text>

    <rect x="719" y="286" width="106" height="32" rx="16" fill="#2A2116" stroke="#F7931A" stroke-width="1.5"/>
    <text x="772" y="308" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">256 bits</text>

    <g stroke="#B7B1A8" stroke-linecap="round" opacity="0.5">
      <path d="M719 332H825" stroke-width="2"/>
    </g>
    <text x="772" y="356" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="14">always 32 bytes</text>
  </g>

  <!-- bottom section removed -->
</svg>
