<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hash function diagram</title>
  <desc id="desc">Arbitrary input data is processed by a hash function to produce a fixed-size output fingerprint.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Hash Function</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Arbitrary input, fixed output</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 152H884"/>
    <path d="M76 270H884"/>
    <path d="M76 390H884"/>
    <path d="M246 150V458"/>
    <path d="M622 150V458"/>
  </g>

  <g filter="url(#soft)">
    <rect x="76" y="180" width="248" height="200" rx="18" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="200" y="220" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Arbitrary input</text>

    <g stroke="#B7B1A8" stroke-linecap="round" opacity="0.82">
      <path d="M108 248H256" stroke-width="3"/>
      <path d="M108 272H224" stroke-width="3"/>
      <path d="M108 296H280" stroke-width="3"/>
      <path d="M108 320H196" stroke-width="3"/>
      <path d="M108 344H240" stroke-width="3"/>
    </g>
    <circle cx="90" cy="248" r="4" fill="#DBC2AE"/>
    <circle cx="90" cy="272" r="4" fill="#DBC2AE"/>
    <circle cx="90" cy="296" r="4" fill="#DBC2AE"/>
    <circle cx="90" cy="320" r="4" fill="#DBC2AE"/>
    <circle cx="90" cy="344" r="4" fill="#DBC2AE"/>

    <text x="200" y="408" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="14">variable size</text>
  </g>

  <path d="M346 280H460" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="480" y="180" width="200" height="200" rx="18" fill="#20252D" stroke="#F7931A" stroke-width="1.8"/>
    <text x="580" y="226" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Hash</text>
    <text x="580" y="256" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Function</text>
    <rect x="510" y="282" width="140" height="32" rx="16" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="580" y="304" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">SHA-256</text>
    <g stroke="#B7B1A8" stroke-linecap="round" opacity="0.5">
      <path d="M510 340H650" stroke-width="2"/>
    </g>
    <text x="580" y="370" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="14">one-way, deterministic</text>
  </g>

  <path d="M702 280H788" stroke="#F7931A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="808" y="180" width="228" height="200" rx="18" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="922" y="220" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Fixed-size output</text>

    <rect x="840" y="246" width="164" height="32" rx="16" fill="#14251A" stroke="#22C55E" stroke-width="1.5"/>
    <text x="922" y="268" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">0xa3f1...7e9b</text>

    <rect x="840" y="296" width="164" height="32" rx="16" fill="#2A2116" stroke="#F7931A" stroke-width="1.5"/>
    <text x="922" y="318" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">256 bits</text>

    <g stroke="#B7B1A8" stroke-linecap="round" opacity="0.5">
      <path d="M840 355H1004" stroke-width="2"/>
    </g>
    <text x="922" y="380" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="14">always 32 bytes</text>
  </g>

  <g stroke="#7C8794" stroke-linecap="round" opacity="0.45">
    <path d="M96 440H228" stroke-width="2"/>
    <path d="M96 448H196" stroke-width="2"/>
    <path d="M96 456H212" stroke-width="2"/>
  </g>
  <text x="54" y="456" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14">hello.txt</text>

  <path d="M490 440H620" stroke="#7C8794" stroke-width="2" stroke-linecap="round"/>
  <path d="M498 448H600" stroke="#7C8794" stroke-width="2" stroke-linecap="round"/>
  <text x="534" y="468" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14">same input</text>
  <text x="534" y="488" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="14">always same output</text>

  <path d="M870 440H922" stroke="#7C8794" stroke-width="2" stroke-linecap="round"/>
  <g fill="#22C55E">
    <circle cx="844" cy="442" r="4"/>
    <circle cx="844" cy="450" r="4"/>
    <circle cx="844" cy="458" r="4"/>
  </g>
  <text x="922" y="458" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">0xa3f1...7e9b</text>
</svg>
