<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Halving supply curve</title>
  <desc id="desc">A supply curve that rises in halving steps and flattens toward the 21,000,000 limit.</desc>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="24" width="904" height="500" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <rect x="96" y="92" width="768" height="372" rx="8" fill="#20252D" stroke="#343A44" stroke-width="2"/>

  <!-- Supply ceiling -->
  <path d="M150 160H830" stroke="#F7931A" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="820" y="150" text-anchor="end" fill="#F4EAD8" font-family="Inter" font-size="18" font-weight="600">21,000,000</text>

  <!-- Curve area and line -->
  <path d="M150 428L286 294L422 227L558 193.5L694 176.75L830 168.4V428Z" fill="#F7931A" fill-opacity="0.12"/>
  <path d="M150 428L286 294L422 227L558 193.5L694 176.75L830 168.4" stroke="#F7931A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="286" cy="294" r="6" fill="#20252D" stroke="#F7931A" stroke-width="2.5"/>
  <circle cx="422" cy="227" r="6" fill="#20252D" stroke="#F7931A" stroke-width="2.5"/>
  <circle cx="558" cy="193.5" r="6" fill="#20252D" stroke="#F7931A" stroke-width="2.5"/>
  <circle cx="694" cy="176.75" r="6" fill="#20252D" stroke="#F7931A" stroke-width="2.5"/>
  <circle cx="830" cy="168.4" r="6" fill="#20252D" stroke="#F7931A" stroke-width="2.5"/>

  <!-- Axes -->
  <path d="M150 428H830M150 428V130" stroke="#8E96A4" stroke-width="2"/>
  <path d="M286 428V434M422 428V434M558 428V434M694 428V434M830 428V434" stroke="#8E96A4" stroke-width="2"/>
  <text x="286" y="458" text-anchor="middle" fill="#B7B1A8" font-family="Inter" font-size="16">210,000</text>
  <text x="830" y="458" text-anchor="end" fill="#B7B1A8" font-family="Inter" font-size="16">block</text>
</svg>
