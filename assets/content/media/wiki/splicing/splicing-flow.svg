<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Channel Splicing</title>
  <desc id="desc">Diagram showing how splicing adds or removes funds from an open Lightning channel. Center: open channel between Alice and Bob (1.0 BTC). Top: splice-in arrow adds 0.5 BTC resulting in 1.5 BTC capacity. Bottom: splice-out arrow removes 0.3 BTC resulting in 0.7 BTC capacity. Channel stays open during both operations. Comparison callout shows without splicing requires close and reopen with 2 on-chain transactions.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Channel Splicing</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Add or remove funds from a channel without closing it</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M64 148H896"/>
  </g>

  <!-- Splice-in section (top) -->
  <text x="64" y="188" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">SPLICE-IN</text>
  <text x="64" y="208" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">Alice adds funds to the open channel</text>

  <g filter="url(#soft)">
    <rect x="64" y="226" width="170" height="80" rx="14" fill="#20252D" stroke="#7C8794" stroke-width="1"/>
    <text x="149" y="256" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Alice's Wallet</text>
    <text x="149" y="278" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">+ 0.5 BTC</text>
  </g>

  <path d="M250 266H320" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="285" y="256" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12">Splice-in tx</text>
  <text x="285" y="274" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">on-chain</text>

  <!-- Center: Channel Card -->
  <g filter="url(#soft)">
    <rect x="334" y="210" width="280" height="110" rx="16" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <rect x="354" y="226" width="34" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="382" y="241" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12">&#x26A1;</text>
    <text x="400" y="241" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Open Channel</text>
    <text x="400" y="259" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Alice &#x2194; Bob</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M354 276H594"/>
    </g>
    <text x="474" y="296" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">1.0 BTC capacity</text>
    <text x="474" y="312" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Stays open during splice</text>
  </g>

  <path d="M630 266H700" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="665" y="256" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">confirmed</text>

  <!-- Splice-in result -->
  <g filter="url(#soft)">
    <rect x="714" y="226" width="200" height="80" rx="14" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="814" y="256" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">1.5 BTC</text>
    <text x="814" y="278" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">New channel capacity</text>
    <text x="814" y="296" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Channel stays open</text>
  </g>

  <!-- Splice-out section (bottom) -->
  <text x="64" y="388" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">SPLICE-OUT</text>
  <text x="64" y="408" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">Alice removes funds, channel stays open</text>

  <g filter="url(#soft)">
    <rect x="64" y="426" width="170" height="80" rx="14" fill="#20252D" stroke="#7C8794" stroke-width="1"/>
    <text x="149" y="456" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Alice's Wallet</text>
    <text x="149" y="478" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13">- 0.3 BTC</text>
  </g>

  <path d="M250 466H320" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="285" y="456" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12">Splice-out tx</text>
  <text x="285" y="474" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">on-chain</text>

  <!-- Channel (same center) -->
  <g filter="url(#soft)">
    <rect x="334" y="410" width="280" height="110" rx="16" fill="#20252D" stroke="#F7931A" stroke-width="2" opacity="0.4"/>
  </g>
  <g filter="url(#soft)">
    <rect x="334" y="410" width="280" height="110" rx="16" fill="#20252D" stroke="#F7931A" stroke-width="2"/>
    <rect x="354" y="426" width="34" height="22" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="382" y="441" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12">&#x26A1;</text>
    <text x="400" y="441" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Open Channel</text>
    <text x="400" y="459" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Alice &#x2194; Bob</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M354 476H594"/>
    </g>
    <text x="474" y="496" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">1.0 BTC capacity</text>
    <text x="474" y="512" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Stays open during splice</text>
  </g>

  <path d="M630 466H700" stroke="#F7931A" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <!-- Splice-out result -->
  <g filter="url(#soft)">
    <rect x="714" y="426" width="200" height="80" rx="14" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="814" y="456" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">0.7 BTC</text>
    <text x="814" y="478" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">New channel capacity</text>
    <text x="814" y="496" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Channel stays open</text>
  </g>

  <!-- Comparison callout -->
  <g filter="url(#soft)">
    <rect x="64" y="306" width="412" height="60" rx="10" fill="#2A2116" stroke="#F7931A" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="80" y="330" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Without splicing:</text>
    <text x="80" y="350" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Close channel &#x2192; reopen new channel (2 on-chain txs)</text>
  </g>

  <!-- Legend bottom -->
  <line x1="540" y1="336" x2="596" y2="336" stroke="#7C8794" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="604" y="340" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Comparison callout</text>
  <path d="M738 336H770" stroke="#F7931A" stroke-width="2"/>
  <text x="778" y="340" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Splice-out</text>
  <path d="M862 336H894" stroke="#22C55E" stroke-width="2"/>
  <text x="900" y="340" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Splice-in</text>
</svg>
