<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Splicing vs Traditional Channel Resize</title>
  <desc id="desc">Two-panel comparison of traditional channel resize versus splicing. Left panel (Traditional): 4 steps — close channel (tx 1), wait for confirmations, reopen new channel (tx 2), wait again. Shows 2 on-chain transactions and channel downtime. Right panel (Splicing): 1 step — splice transaction with 1 on-chain transaction, channel stays active. Timeline bars at bottom show splicing is significantly faster.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Splicing vs Traditional Channel Resize</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Splicing requires one transaction and no channel downtime</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M64 148H896"/>
    <path d="M480 148V490"/>
  </g>

  <!-- Left panel header: Traditional -->
  <text x="272" y="144" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">TRADITIONAL (CLOSE + REOPEN)</text>

  <!-- Step 1: Close channel -->
  <g filter="url(#soft)">
    <rect x="100" y="172" width="340" height="56" rx="12" fill="#20252D" stroke="#F7931A" stroke-width="1.5"/>
    <rect x="112" y="180" width="28" height="20" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="126" y="194" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11">1</text>
    <text x="150" y="196" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Close channel</text>
    <text x="150" y="214" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Broadcast closing tx (on-chain tx #1)</text>
  </g>

  <path d="M270 232V256" stroke="#F7931A" stroke-width="2.5" marker-end="url(#arrow-orange)" fill="none"/>

  <!-- Step 2: Wait -->
  <g filter="url(#soft)">
    <rect x="140" y="264" width="260" height="46" rx="12" fill="#20252D" stroke="#7C8794" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="270" y="286" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">Wait for tx confirmation</text>
    <text x="270" y="302" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">~10-60 minutes</text>
  </g>

  <path d="M270 314V338" stroke="#F7931A" stroke-width="2.5" marker-end="url(#arrow-orange)" fill="none"/>

  <!-- Step 3: Open new channel -->
  <g filter="url(#soft)">
    <rect x="100" y="346" width="340" height="56" rx="12" fill="#20252D" stroke="#F7931A" stroke-width="1.5"/>
    <rect x="112" y="354" width="28" height="20" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="126" y="368" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11">2</text>
    <text x="150" y="370" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Open new channel</text>
    <text x="150" y="388" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Broadcast new funding tx (on-chain tx #2)</text>
  </g>

  <path d="M270 406V430" stroke="#F7931A" stroke-width="2.5" marker-end="url(#arrow-orange)" fill="none"/>

  <!-- Step 4: Wait again -->
  <g filter="url(#soft)">
    <rect x="140" y="438" width="260" height="46" rx="12" fill="#20252D" stroke="#7C8794" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="270" y="460" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">Wait for tx confirmation</text>
    <text x="270" y="476" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">~10-60 minutes</text>
  </g>

  <!-- Right panel header: Splicing -->
  <text x="720" y="144" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">SPLICING</text>

  <!-- Single step -->
  <g filter="url(#soft)">
    <rect x="500" y="172" width="440" height="120" rx="16" fill="#203327" stroke="#22C55E" stroke-width="2"/>
  </g>

  <!-- Step: Splice tx -->
  <g filter="url(#soft)">
    <rect x="516" y="188" width="200" height="56" rx="12" fill="#20252D" stroke="#22C55E" stroke-width="1.5"/>
    <rect x="528" y="196" width="28" height="20" rx="6" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="542" y="210" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="11">1</text>
    <text x="566" y="212" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Splice transaction</text>
    <text x="566" y="230" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">1 on-chain tx</text>
  </g>

  <path d="M732 216H790" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <g filter="url(#soft)">
    <rect x="800" y="188" width="124" height="56" rx="12" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="862" y="212" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Channel</text>
    <text x="862" y="230" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Active</text>
  </g>

  <!-- Splicing details -->
  <text x="532" y="268" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">&#x2022; No channel downtime</text>
  <text x="532" y="284" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">&#x2022; Old channel stays operational until splice confirms</text>

  <!-- Timeline comparison -->
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M64 500H896"/>
  </g>
  <text x="64" y="514" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Timeline</text>

  <!-- Traditional timeline bar -->
  <g filter="url(#soft)">
    <rect x="160" y="502" width="300" height="10" rx="5" fill="#2A2116"/>
    <rect x="160" y="502" width="60" height="10" rx="5" fill="#F7931A" opacity="0.8"/>
    <rect x="220" y="502" width="30" height="10" fill="#2A2116"/>
    <rect x="250" y="502" width="60" height="10" rx="5" fill="#F7931A" opacity="0.8"/>
    <rect x="310" y="502" width="30" height="10" fill="#2A2116"/>
    <rect x="340" y="502" width="60" height="10" rx="5" fill="#F7931A" opacity="0.8"/>
    <rect x="400" y="502" width="30" height="10" fill="#2A2116"/>
    <rect x="430" y="502" width="30" height="10" rx="5" fill="#F7931A" opacity="0.8"/>
  </g>
  <text x="160" y="494" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="9">Close</text>
  <text x="250" y="494" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="9">Wait</text>
  <text x="340" y="494" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="9">Open</text>
  <text x="430" y="494" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="9">Wait</text>
  <text x="496" y="512" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Traditional: ~20-120 min</text>

  <!-- Splicing timeline bar -->
  <g filter="url(#soft)">
    <rect x="600" y="502" width="120" height="10" rx="5" fill="#203327"/>
    <rect x="600" y="502" width="120" height="10" rx="5" fill="#22C55E" opacity="0.8"/>
  </g>
  <text x="600" y="494" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="9">Splice</text>
  <text x="736" y="510" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Splicing: ~10-60 min</text>

  <!-- Arrow showing same confirmation wait but no close/open overhead -->
  <path d="M640 496V490" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arrow-green)" fill="none"/>

  <!-- Channel down indicator for traditional -->
  <text x="160" y="524" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="10">Channel DOWN during this period</text>
  <path d="M160 520H460" stroke="#F7931A" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Channel active indicator for splicing -->
  <text x="600" y="524" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="10">Channel ACTIVE throughout</text>
  <path d="M600 520H720" stroke="#22C55E" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
</svg>
