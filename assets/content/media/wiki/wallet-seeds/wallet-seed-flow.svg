<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wallet Seed Generation</title>
  <desc id="desc">Flow from entropy to mnemonic phrase to seed: random entropy (128-256 bits) is split into chunks, each chunk maps to a BIP 39 word, the word sequence plus optional passphrase produces a 512-bit seed via PBKDF2.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Wallet Seed</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">From entropy to mnemonic to master seed</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
    <path d="M76 310H884"/>
  </g>
  <g filter="url(#soft)">
    <rect x="64" y="166" width="200" height="110" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="164" y="198" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Entropy</text>
    <text x="164" y="226" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">128 — 256 bits</text>
    <rect x="170" y="244" width="12" height="12" rx="2" fill="#F7931A"/>
    <rect x="186" y="244" width="12" height="12" rx="2" fill="#22C55E"/>
    <rect x="202" y="244" width="12" height="12" rx="2" fill="#7C8794"/>
    <rect x="218" y="244" width="12" height="12" rx="2" fill="#F7931A"/>
    <rect x="234" y="244" width="12" height="12" rx="2" fill="#B7B1A8"/>
    <text x="164" y="266" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">CSPRNG randomness</text>
  </g>
  <path d="M264 221L322 221" stroke="#F7931A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="274" y="214" width="48" height="18" rx="4" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
  <text x="298" y="227" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11">BIP 39</text>
  <g filter="url(#soft)">
    <rect x="344" y="166" width="240" height="110" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="464" y="198" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Mnemonic Phrase</text>
    <text x="464" y="226" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">12 / 15 / 18 / 21 / 24 words</text>
    <text x="464" y="250" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">abandon ... zoo</text>
    <text x="464" y="268" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">Wordlist: 2048 words (BIP 39)</text>
  </g>
  <path d="M584 221L638 221" stroke="#7C8794" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  <rect x="594" y="214" width="40" height="18" rx="4" fill="#20252D" stroke="#46505C" stroke-width="1"/>
  <text x="614" y="227" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="10">PBKDF2</text>
  <g filter="url(#soft)">
    <rect x="658" y="166" width="260" height="110" rx="14" fill="#20252D" stroke="#22C55E" stroke-width="2"/>
    <text x="788" y="198" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Master Seed</text>
    <text x="788" y="226" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="12">512 bits</text>
    <rect x="710" y="244" width="16" height="12" rx="2" fill="#22C55E" opacity="0.6"/>
    <rect x="730" y="244" width="16" height="12" rx="2" fill="#22C55E" opacity="0.7"/>
    <rect x="750" y="244" width="16" height="12" rx="2" fill="#22C55E"/>
    <rect x="770" y="244" width="16" height="12" rx="2" fill="#22C55E" opacity="0.8"/>
    <rect x="790" y="244" width="16" height="12" rx="2" fill="#22C55E" opacity="0.5"/>
    <rect x="810" y="244" width="16" height="12" rx="2" fill="#22C55E" opacity="0.9"/>
    <rect x="830" y="244" width="16" height="12" rx="2" fill="#22C55E" opacity="0.3"/>
    <rect x="850" y="244" width="16" height="12" rx="2" fill="#22C55E" opacity="0.7"/>
    <rect x="870" y="244" width="16" height="12" rx="2" fill="#22C55E" opacity="0.6"/>
    <text x="788" y="268" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="11">HMAC-SHA512 × 2048 rounds</text>
  </g>
  <g filter="url(#soft)">
    <rect x="64" y="328" width="856" height="150" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="492" y="358" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">BIP 39 Mnemonic Encoding</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M80 374H904"/>
    </g>
    <text x="164" y="402" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Step 1</text>
    <text x="164" y="426" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">Generate ENT random bits</text>
    <text x="164" y="448" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">128 bits for 12 words</text>
    <text x="164" y="466" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">256 bits for 24 words</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M330 388V480"/>
    </g>
    <text x="480" y="402" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Step 2</text>
    <text x="480" y="426" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">SHA-256 checksum (ENT/32)</text>
    <text x="480" y="448" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Append first N bits of hash</text>
    <text x="480" y="466" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Total bits = ENT + CS</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M640 388V480"/>
    </g>
    <text x="800" y="402" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Step 3</text>
    <text x="800" y="426" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13">Split into 11-bit groups</text>
    <text x="800" y="448" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Map each → word index</text>
    <text x="800" y="466" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="12">0—2047</text>
  </g>
</svg>
