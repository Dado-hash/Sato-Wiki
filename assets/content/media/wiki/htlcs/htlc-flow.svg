<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hash Time Locked Contract (HTLC)</title>
  <desc id="desc">Conditional payments using hashlock and timelock for atomic multi-hop routing across three Lightning Network nodes: Alice, Bob, and Carol.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#F7931A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#7C8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="484" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>
  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Hash Time Locked Contract (HTLC)</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">Conditional payments using hashlock and timelock for atomic multi-hop routing</text>
  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 148H884"/>
  </g>
  <text x="190" y="170" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">SENDER</text>
  <text x="480" y="170" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">FORWARDER</text>
  <text x="770" y="170" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">RECEIVER</text>
  <g filter="url(#soft)">
    <rect x="70" y="190" width="240" height="195" rx="14" fill="#2A2116" stroke="#F7931A" stroke-width="2"/>
    <rect x="86" y="206" width="72" height="24" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="122" y="222" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">ALICE</text>
    <text x="175" y="223" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Sender</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M86 242H294"/>
    </g>
    <text x="190" y="268" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Creates HTLC with:</text>
    <text x="190" y="292" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13">Hashlock H(x)</text>
    <text x="190" y="316" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">Timelock 144 blocks</text>
    <text x="190" y="346" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Locks 5 BTC in HTLC</text>
    <text x="190" y="370" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Timeout reclaims funds</text>
  </g>
  <g filter="url(#soft)">
    <rect x="360" y="190" width="240" height="195" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <rect x="376" y="206" width="72" height="24" rx="6" fill="#20252D" stroke="#46505C" stroke-width="1"/>
    <text x="412" y="222" text-anchor="middle" fill="#B7B1A8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">BOB</text>
    <text x="465" y="223" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Forwarder</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M376 242H584"/>
    </g>
    <text x="480" y="268" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Receives conditional HTLC</text>
    <text x="480" y="292" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Creates matching HTLC</text>
    <text x="480" y="316" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">to Carol with shorter</text>
    <text x="480" y="336" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">timelock (CLTV delta)</text>
    <text x="480" y="370" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12">Waits for preimage x</text>
  </g>
  <g filter="url(#soft)">
    <rect x="650" y="190" width="240" height="195" rx="14" fill="#203327" stroke="#22C55E" stroke-width="2"/>
    <rect x="666" y="206" width="72" height="24" rx="6" fill="#203327" stroke="#22C55E" stroke-width="1"/>
    <text x="702" y="222" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">CAROL</text>
    <text x="755" y="223" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Receiver</text>
    <g stroke="#28313B" stroke-width="1" opacity="0.4">
      <path d="M666 242H874"/>
    </g>
    <text x="770" y="268" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Knows the preimage x</text>
    <text x="770" y="292" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">such that H(x) matches</text>
    <text x="770" y="316" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">the hashlock H(x)</text>
    <text x="770" y="346" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="12">Reveals x to claim</text>
    <text x="770" y="370" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">Funds are released</text>
  </g>
  <g stroke="#F7931A" stroke-width="4" marker-end="url(#arrow-orange)">
    <path d="M310 260L355 260"/>
    <path d="M600 260L645 260"/>
  </g>
  <text x="332" y="253" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="11">HTLC</text>
  <text x="622" y="253" text-anchor="middle" fill="#F7931A" font-family="Inter, Arial, sans-serif" font-size="11">HTLC</text>
  <g stroke="#22C55E" stroke-width="3.5" marker-end="url(#arrow-green)">
    <path d="M650 350L605 350"/>
    <path d="M360 350L315 350"/>
  </g>
  <text x="627" y="343" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="11">Preimage x</text>
  <text x="337" y="343" text-anchor="middle" fill="#22C55E" font-family="Inter, Arial, sans-serif" font-size="11">Preimage x</text>
  <g filter="url(#soft)">
    <rect x="70" y="425" width="820" height="60" rx="14" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="480" y="450" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Atomicity: either all hops succeed and every intermediary collects their routing fee,</text>
    <text x="480" y="472" text-anchor="middle" fill="#7C8794" font-family="Inter, Arial, sans-serif" font-size="12">or all hops timeout and every party recovers their original funds</text>
  </g>
</svg>