<svg width="960" height="644" viewBox="0 0 960 644" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SHA-256 Compression Round</title>
  <desc id="desc">A single round of the SHA-256 compression function showing message schedule input, 8 working variables A-H, and state update for the next round.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#7C8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="644" rx="28" fill="#111418"/>
  <rect x="28" y="28" width="904" height="588" rx="22" fill="#171B21" stroke="#343A44" stroke-width="2"/>

  <text x="64" y="82" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">SHA-256 Compression Round</text>
  <text x="64" y="116" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="18">64 rounds of deterministic state mixing from a 512-bit message block</text>

  <g stroke="#28313B" stroke-width="1" opacity="0.55">
    <path d="M76 152H884"/>
    <path d="M276 150V172"/>
    <path d="M656 150V172"/>
  </g>

  <text x="160" y="141" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Message Schedule</text>
  <text x="464" y="141" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">Round Function</text>
  <text x="780" y="141" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="13">State Update</text>

  <g filter="url(#soft)">
    <rect x="64" y="172" width="192" height="240" rx="16" fill="#20252D" stroke="#46505C" stroke-width="2"/>
    <text x="160" y="210" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Message Schedule</text>

    <rect x="88" y="234" width="144" height="32" rx="8" fill="#171B21" stroke="#46505C" stroke-width="1.4"/>
    <text x="160" y="254" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14">512-bit block</text>

    <path d="M160 266V288" stroke="#7C8794" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>

    <rect x="88" y="288" width="144" height="32" rx="8" fill="#171B21" stroke="#46505C" stroke-width="1.4"/>
    <text x="160" y="308" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="14">16 words (W₀…W₁₅)</text>

    <path d="M160 320V342" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

    <rect x="88" y="342" width="144" height="34" rx="8" fill="#2A2116" stroke="#F7931A" stroke-width="1.4"/>
    <text x="160" y="364" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">64 rounds ← 16</text>
  </g>

  <text x="276" y="266" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">Wₜ</text>
  <path d="M260 280H296" stroke="#F7931A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="296" y="172" width="336" height="336" rx="16" fill="#20252D" stroke="#46505C" stroke-width="2"/>

    <text x="464" y="206" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Compression Function</text>

    <g stroke="#28313B" stroke-width="1" opacity="0.45">
      <path d="M320 224H608"/>
      <path d="M320 328H608"/>
    </g>

    <rect x="320" y="236" width="60" height="38" rx="8" fill="#171B21" stroke="#7C5CFF" stroke-width="1.4"/>
    <text x="350" y="259" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">A</text>

    <rect x="392" y="236" width="60" height="38" rx="8" fill="#171B21" stroke="#7C5CFF" stroke-width="1.4"/>
    <text x="422" y="259" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">B</text>

    <rect x="464" y="236" width="60" height="38" rx="8" fill="#171B21" stroke="#7C5CFF" stroke-width="1.4"/>
    <text x="494" y="259" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">C</text>

    <rect x="536" y="236" width="60" height="38" rx="8" fill="#171B21" stroke="#7C5CFF" stroke-width="1.4"/>
    <text x="566" y="259" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">D</text>

    <rect x="320" y="368" width="60" height="38" rx="8" fill="#171B21" stroke="#F7931A" stroke-width="1.4"/>
    <text x="350" y="391" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">E</text>

    <rect x="392" y="368" width="60" height="38" rx="8" fill="#171B21" stroke="#F7931A" stroke-width="1.4"/>
    <text x="422" y="391" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">F</text>

    <rect x="464" y="368" width="60" height="38" rx="8" fill="#171B21" stroke="#F7931A" stroke-width="1.4"/>
    <text x="494" y="391" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">G</text>

    <rect x="536" y="368" width="60" height="38" rx="8" fill="#171B21" stroke="#F7931A" stroke-width="1.4"/>
    <text x="566" y="391" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">H</text>

    <text x="350" y="296" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Σ₀</text>
    <text x="458" y="296" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Maj</text>
    <path d="M380 252H392" stroke="#7C8794" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M452 252H464" stroke="#7C8794" stroke-width="1.5" stroke-linecap="round"/>

    <text x="350" y="428" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Σ₁</text>
    <text x="458" y="428" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="12">Ch</text>
    <path d="M380 384H392" stroke="#7C8794" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M452 384H464" stroke="#7C8794" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="336" y="308" width="88" height="20" rx="6" fill="#2A2116" stroke="#F7931A" stroke-width="1"/>
    <text x="380" y="322" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">Kₜ + Wₜ</text>

    <text x="464" y="468" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle">
      <tspan x="464" dy="0">A' = T₁ + T₂</tspan>
      <tspan x="464" dy="18" fill="#F7931A">E' = D + T₁</tspan>
    </text>
    <path d="M566 275V360" stroke="#7C8794" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
  </g>

  <path d="M640 330H672" stroke="#F7931A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <g filter="url(#soft)">
    <rect x="680" y="172" width="200" height="240" rx="16" fill="#20252D" stroke="#46505C" stroke-width="2"/>

    <text x="780" y="210" text-anchor="middle" fill="#F4EAD8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">State Update</text>

    <rect x="704" y="234" width="152" height="36" rx="10" fill="#171B21" stroke="#46505C" stroke-width="1.4"/>
    <text x="780" y="252" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">A B C D ←</text>
    <text x="780" y="266" text-anchor="middle" fill="#7C5CFF" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">   shifted right</text>

    <path d="M780 270V292" stroke="#7C8794" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>

    <rect x="704" y="292" width="152" height="36" rx="10" fill="#171B21" stroke="#46505C" stroke-width="1.4"/>
    <text x="780" y="310" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">E F G H ←</text>
    <text x="780" y="324" text-anchor="middle" fill="#F7931A" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">   shifted right</text>

    <path d="M780 328V350" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>

    <rect x="704" y="350" width="152" height="30" rx="15" fill="#203327" stroke="#22C55E" stroke-width="1.4"/>
    <text x="780" y="369" text-anchor="middle" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">→ next round</text>
  </g>

  <g filter="url(#soft)">
    <rect x="64" y="532" width="816" height="56" rx="14" fill="#171B21" stroke="#343A44" stroke-width="1.5"/>
    <text x="472" y="556" text-anchor="middle" fill="#B7B1A8" font-family="Inter, Arial, sans-serif" font-size="16">
      After 64 rounds: working variables + initial hash values = 256-bit digest
    </text>
    <text x="472" y="575" text-anchor="middle" fill="#7C8794" font-family="JetBrains Mono, monospace" font-size="13">
      H₀…H₇ + A…H → concatenated big-endian output
    </text>
  </g>
</svg>
